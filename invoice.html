<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>វិក្កយបត្រ - តូបជជុស Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kantumruy Pro', sans-serif; }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-3 flex flex-col items-center justify-center">

  <div id="invoiceCard" class="bg-white w-full max-w-md p-5 rounded-2xl shadow-sm border space-y-4">
    <div class="flex justify-between items-start border-b pb-3">
      <div class="flex items-center gap-2">
        <img src="https://gzclvhcvsfcslilxaiyg.supabase.co/storage/v1/object/public/product-images/logo.png" 
             onerror="this.src='https://via.placeholder.com/50';" class="w-10 h-10 rounded-full border">
        <div>
          <h1 class="font-bold text-sm">តូបជជុស Online</h1>
          <p class="text-[10px] text-gray-500">វិក្កយបត្រ / Invoice</p>
        </div>
      </div>
      <div class="text-right">
        <span class="text-xs font-bold text-blue-600 block" id="invNum">#INV-001</span>
        <span class="text-[10px] text-gray-400" id="invDate">--/--/----</span>
      </div>
    </div>

    <div class="bg-gray-50 p-2.5 rounded-xl text-xs space-y-0.5">
      <p class="font-bold text-gray-700">👤 ព័ត៌មានអតិថិជន៖</p>
      <p class="text-gray-600" id="custNameText">ឈ្មោះ៖ --</p>
      <p class="text-gray-600" id="custPhoneText">លេខទូរស័ព្ទ៖ --</p>
      <p class="text-gray-600" id="custAddressText">អាសយដ្ឋាន៖ --</p>
    </div>

    <div class="space-y-2">
      <p class="text-xs font-bold text-gray-700">👖 ទំនិញដែលបានទិញ៖</p>
      <div id="invoiceItems" class="space-y-1.5 text-xs"></div>
    </div>

    <div class="border-t pt-2 space-y-1 text-xs">
      <div class="flex justify-between text-gray-500">
        <span>ថ្លៃទំនិញសរុប៖</span>
        <span id="subTotal">$0.00</span>
      </div>
      <div class="flex justify-between text-gray-500">
        <span>ថ្លៃដឹកជញ្ជូន៖</span>
        <span id="deliveryFee">$0.00</span>
      </div>
      <div class="flex justify-between font-bold text-sm pt-2 border-t text-gray-900">
        <span>សរុបចុងក្រោយ៖</span>
        <span class="text-blue-600" id="grandTotal">$0.00</span>
      </div>
    </div>

    <div class="text-center pt-2 border-t text-[10px] text-gray-400">
      🙏 អរគុណសម្រាប់ការគាំទ្រ តូបជជុស Online!
    </div>
  </div>

  <div class="w-full max-w-md mt-3 space-y-2 no-print">
    <button onclick="sendToTelegram()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
      💬 ផ្ញើវិក្កយបត្រនេះទៅ Telegram Admin
    </button>
    <div class="flex gap-2">
      <button onclick="window.print()" class="w-1/2 bg-gray-800 text-white font-bold py-2 rounded-xl text-xs">🖨️ Print / Save PDF</button>
      <a href="index.html" onclick="localStorage.clear()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2 rounded-xl text-xs text-center">🏠 ទំព័រដើម</a>
    </div>
  </div>

  <script>
    const cart = JSON.parse(localStorage.getItem('cartData')) || [];
    const details = JSON.parse(localStorage.getItem('orderDetails')) || { customer: {}, deliveryFee: 0, itemsTotal: 0, grandTotal: 0 };

    document.getElementById('invDate').innerText = new Date().toLocaleDateString('km-KH');
    document.getElementById('invNum').innerText = `#INV-${Math.floor(1000 + Math.random() * 9000)}`;

    document.getElementById('custNameText').innerText = `ឈ្មោះ៖ ${details.customer.name || 'ភ្ញៀវទូទៅ'}`;
    document.getElementById('custPhoneText').innerText = `លេខទូរស័ព្ទ៖ ${details.customer.phone || '--'}`;
    document.getElementById('custAddressText').innerText = `អាសយដ្ឋាន៖ ${details.customer.address || '--'}`;

    const itemsContainer = document.getElementById('invoiceItems');
    itemsContainer.innerHTML = cart.map(item => {
      const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
      const codeText = codeMatch ? codeMatch[1] : 'N/A';
      return `
        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg border">
          <span><b>#${codeText}</b> - ${item.title}</span>
          <span class="font-bold text-blue-600">$${parseFloat(item.price || 0).toFixed(2)}</span>
        </div>
      `;
    }).join('');

    document.getElementById('subTotal').innerText = `$${details.itemsTotal.toFixed(2)}`;
    document.getElementById('deliveryFee').innerText = `$${details.deliveryFee.toFixed(2)}`;
    document.getElementById('grandTotal').innerText = `$${details.grandTotal.toFixed(2)}`;

    function sendToTelegram() {
      let msg = `🧾 *វិក្កយបត្រថ្មីពី Web - តូបជជុស Online*\n\n`;
      msg += `👤 *អតិថិជន:* ${details.customer.name}\n`;
      msg += `📞 *ទូរស័ព្ទ:* ${details.customer.phone}\n`;
      msg += `📍 *អាសយដ្ឋាន:* ${details.customer.address}\n\n`;
      msg += `👖 *បញ្ជីទំនិញ (${cart.length} មុខ):*\n`;

      cart.forEach((item, idx) => {
        const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
        const codeText = codeMatch ? codeMatch[1] : 'N/A';
        msg += `${idx + 1}. #${codeText} - ${item.title} ($${parseFloat(item.price || 0).toFixed(2)})\n`;
      });

      msg += `\n🚚 *ថ្លៃដឹក:* $${details.deliveryFee.toFixed(2)}`;
      msg += `\n💰 *សរុបចុងក្រោយ:* $${details.grandTotal.toFixed(2)}`;

      window.open(`https://t.me/Torp_jojus_online?text=${encodeURIComponent(msg)}`, '_blank');
    }
  </script>
</body>
</html>
