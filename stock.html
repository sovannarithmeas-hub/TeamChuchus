<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - បញ្ជីស្តុកទំនិញ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
  <div class="max-w-xl mx-auto">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-gray-800">📦 បញ្ជីស្តុកទំនិញទាំងអស់</h1>
      <a href="index.html" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-700">
        ➕ បញ្ចូលស្តុកថ្មី
      </a>
    </div>

    <div class="mb-3">
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="🔍 ស្វែងរកតាមលេខកូដ ឬប្រភេទខោ..." class="w-full p-2.5 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
    </div>

    <div class="flex bg-gray-200 p-1 rounded-xl mb-4 font-medium text-xs sm:text-sm">
      <button id="tabInStock" onclick="switchTab('instock')" class="flex-1 py-1.5 text-center rounded-lg bg-white text-blue-600 font-bold shadow-sm transition">
        📦 ក្នុងស្តុក (<span id="cntInStock">0</span>)
      </button>
      <button id="tabSoldOut" onclick="switchTab('soldout')" class="flex-1 py-1.5 text-center rounded-lg text-gray-600 hover:text-gray-800 transition">
        ❌ លក់ដាច់ (<span id="cntSoldOut">0</span>)
      </button>
      <button id="tabAll" onclick="switchTab('all')" class="flex-1 py-1.5 text-center rounded-lg text-gray-600 hover:text-gray-800 transition">
        📋 ទាំងអស់ (<span id="cntAll">0</span>)
      </button>
    </div>

    <div id="productList" class="space-y-3">
      <p class="text-center text-gray-500 py-6">⏳ កំពុងទាញទិន្នន័យស្តុក...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gzclvhcvsfcslilxaiyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VVZOPQCUQFRDSlOgXhUI5g_kri2S-Ww'; 
    
    // ⚙️ ព័ត៌មាន Telegram Bot
    const TELEGRAM_BOT_TOKEN = '8994221143:AAFtNb2tA7eqIzmbonP58qhdvgcxyODwZWA'; 
    const TELEGRAM_CHAT_ID = '@tobchuchusonline';       

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allProducts = [];
    let currentTab = 'instock'; // ករណីដើមគឺបង្ហាញតែអីវ៉ាន់ក្នុងស្តុក

    // ទាញយកទិន្នន័យពី Supabase
    async function loadProducts() {
      const container = document.getElementById('productList');
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        allProducts = data || [];
        updateTabCounts();
        filterProducts();
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p class="text-center text-red-500 py-6">❌ មិនអាចទាញទិន្នន័យបានទេ៖ ${err.message}</p>`;
      }
    }

    // គណនាចំនួនទំនិញតាម Tab នីមួយៗ
    function updateTabCounts() {
      const inStockCount = allProducts.filter(p => !(p.stock_quantity === 0 || (p.description && p.description.includes('[SOLD OUT]')))).length;
      const soldOutCount = allProducts.filter(p => p.stock_quantity === 0 || (p.description && p.description.includes('[SOLD OUT]'))).length;

      document.getElementById('cntInStock').innerText = inStockCount;
      document.getElementById('cntSoldOut').innerText = soldOutCount;
      document.getElementById('cntAll').innerText = allProducts.length;
    }

    // ប្តូរ Tab Active
    function switchTab(tab) {
      currentTab = tab;
      
      const tabBtns = {
        instock: document.getElementById('tabInStock'),
        soldout: document.getElementById('tabSoldOut'),
        all: document.getElementById('tabAll')
      };

      Object.keys(tabBtns).forEach(key => {
        if (key === tab) {
          tabBtns[key].className = 'flex-1 py-1.5 text-center rounded-lg bg-white text-blue-600 font-bold shadow-sm transition';
        } else {
          tabBtns[key].className = 'flex-1 py-1.5 text-center rounded-lg text-gray-600 hover:text-gray-800 transition';
        }
      });

      filterProducts();
    }

    // តម្រៀប & Search ទិន្នន័យ
    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      let filtered = allProducts.filter(p => {
        const isSoldOut = p.stock_quantity === 0 || (p.description && p.description.includes('[SOLD OUT]'));
        if (currentTab === 'instock') return !isSoldOut;
        if (currentTab === 'soldout') return isSoldOut;
        return true; // tab 'all'
      });

      if (query) {
        filtered = filtered.filter(p => 
          (p.title && p.title.toLowerCase().includes(query)) ||
          (p.description && p.description.toLowerCase().includes(query))
        );
      }

      renderProducts(filtered);
    }

    // បង្ហាញទិន្នន័យលើអេក្រង់
    function renderProducts(products) {
      const container = document.getElementById('productList');
      if (products.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-500 py-6">📭 មិនមានទំនិញក្នុងផ្នែកនេះទេ</p>`;
        return;
      }

      container.innerHTML = products.map(item => {
        const firstImg = (item.images && item.images.length > 0) ? item.images[0] : 'https://via.placeholder.com/100';
        const sizes = Array.isArray(item.sizes) ? item.sizes.join(', ') : (item.sizes || 'N/A');
        
        let code = 'N/A';
        if (item.description) {
          const match = item.description.match(/\[Code:\s*([^\]]+)\]/i);
          if (match) code = match[1];
        }

        const isSoldOut = item.stock_quantity === 0 || (item.description && item.description.includes('[SOLD OUT]'));

        return `
          <div class="bg-white p-3 rounded-xl shadow flex gap-3 items-center border ${isSoldOut ? 'border-red-300 bg-red-50/40' : 'border-gray-200'}">
            <div class="relative">
              <img src="${firstImg}" class="w-20 h-20 object-cover rounded-lg border">
              ${isSoldOut ? '<span class="absolute top-0 left-0 bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-tl-lg rounded-br-lg">SOLD OUT</span>' : ''}
            </div>
            
            <div class="flex-1">
              <h3 class="font-bold text-gray-800 text-base flex items-center gap-1">
                ${item.title || 'ខោជជុស'}
                ${isSoldOut ? '<span class="text-xs text-red-600 font-normal">(លក់ដាច់ហើយ)</span>' : ''}
              </h3>
              <p class="text-xs text-gray-500 mt-0.5">${item.description || ''}</p>
              <div class="flex gap-2 items-center mt-1">
                <span class="text-sm font-bold ${isSoldOut ? 'line-through text-gray-400' : 'text-blue-600'}">$${parseFloat(item.price).toFixed(2)}</span>
                <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded border">Size: ${sizes}</span>
              </div>
            </div>

            <div class="flex flex-col gap-1.5">
              ${!isSoldOut ? `
                <button onclick="markAsSold(${item.id}, '${item.description || ''}', '${code}', '${item.title || 'ខោជជុស'}')" class="bg-green-600 text-white px-2.5 py-1 rounded-lg hover:bg-green-700 text-xs font-semibold shadow-sm">
                  🛒 លក់ដាច់
                </button>
              ` : `
                <span class="text-xs text-center text-red-600 font-bold bg-red-100 px-2 py-1 rounded-lg">
                  ❌ លក់រួច
                </span>
              `}
              <button onclick="deleteProduct(${item.id})" class="bg-red-50 text-red-600 px-2.5 py-1 rounded-lg hover:bg-red-100 text-xs font-semibold border border-red-200">
                🗑️ លុប
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 📢 Post សារ លក់ដាច់ ទៅ Telegram
    async function sendSoldOutToTelegram(code, title) {
      if (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN === 'YOUR_TELEGRAM_BOT_TOKEN_HERE') return;

      try {
        const soldText = `❌ <b>[ ទំនិញលក់ដាច់ហើយ / SOLD OUT ]</b> ❌\n\n` +
                         `🏷️ លេខកូដទំនិញ៖ <b>#${code.toUpperCase()}</b>\n` +
                         `👖 ប្រភេទម៉ូដ៖ <b>${title}</b>\n\n` +
                         `សូមអរគុណអតិថិជនសម្រាប់ការគាំទ្រ! 🙏✨\n` +
                         `ទំនិញលេខកូដនេះត្រូវបានលក់ដាច់ហើយ។`;

        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: soldText,
            parse_mode: 'HTML'
          })
        });
      } catch (err) {
        console.error('Telegram Sold Out Post Error:', err);
      }
    }

    // 🛒 Mark as Sold
    async function markAsSold(id, currentDesc, code, title) {
      if (!confirm(`តើអ្នកប្រាកដថាខោលេខកូដ #${code} ត្រូវបានលក់ដាច់ហើយមែនទេ?`)) return;

      try {
        const updatedDesc = currentDesc ? `${currentDesc} [SOLD OUT]` : '[SOLD OUT]';

        const { error } = await supabaseClient
          .from('products')
          .update({ 
            stock_quantity: 0,
            description: updatedDesc
          })
          .eq('id', id);

        if (error) throw error;

        await sendSoldOutToTelegram(code, title);

        alert('✅ បានកត់ត្រាថា "លក់ដាច់" និង Post ទៅ Telegram រួចរាល់!');
        loadProducts();
      } catch (err) {
        alert('❌ មិនអាចប្តូរ狀態បានទេ៖ ' + err.message);
      }
    }

    // Delete Product
    async function deleteProduct(id) {
      if (!confirm('តើអ្នកប្រាកដថាចង់លុបទំនិញនេះចេញពីស្តុកមែនទេ?')) return;

      try {
        const { error } = await supabaseClient
          .from('products')
          .delete()
          .eq('id', id);

        if (error) throw error;

        alert('✅ លុបទំនិញជោគជ័យ!');
        loadProducts();
      } catch (err) {
        alert('❌ មិនអាចលុបបានទេ៖ ' + err.message);
      }
    }

    // ដំណើរការដំបូង
    loadProducts();
  </script>
</body>
</html>
