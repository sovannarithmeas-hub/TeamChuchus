<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - បញ្ជីស្តុកទំនិញ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
  <div class="max-w-xl mx-auto">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-gray-800">📦 បញ្ជីស្តុកទំនិញទាំងអស់</h1>
      <a href="index.html" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-700">
        ➕ បញ្ចូលស្តុកថ្មី
      </a>
    </div>

    <div class="mb-4">
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="🔍 ស្វែងរកតាមលេខកូដ ឬប្រភេទខោ..." class="w-full p-2.5 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div id="productList" class="space-y-3">
      <p class="text-center text-gray-500 py-6">⏳ កំពុងទាញទិន្នន័យស្តុក...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gzclvhcvsfcslilxaiyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VVZOPQCUQFRDSlOgXhUI5g_kri2S-Ww'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];

    // ទាញយកទិន្នន័យពី Supabase
    async function loadProducts() {
      const container = document.getElementById('productList');
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        allProducts = data || [];
        renderProducts(allProducts);
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p class="text-center text-red-500">❌ មិនអាចទាញទិន្នន័យបានទេ៖ ${err.message}</p>`;
      }
    }

    // បង្ហាញទិន្នន័យលើអេក្រង់
    function renderProducts(products) {
      const container = document.getElementById('productList');
      if (products.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-500 py-6">📭 មិនទាន់មានទំនិញក្នុងស្តុកនៅឡើយទេ</p>`;
        return;
      }

      container.innerHTML = products.map(item => {
        const firstImg = (item.images && item.images.length > 0) ? item.images[0] : 'https://via.placeholder.com/100';
        const sizes = Array.isArray(item.sizes) ? item.sizes.join(', ') : (item.sizes || 'N/A');

        return `
          <div class="bg-white p-3 rounded-xl shadow flex gap-3 items-center border border-gray-200">
            <img src="${firstImg}" class="w-20 h-20 object-cover rounded-lg border">
            <div class="flex-1">
              <h3 class="font-bold text-gray-800 text-base">${item.title || 'ខោជជុស'}</h3>
              <p class="text-xs text-gray-500 mt-0.5">${item.description || ''}</p>
              <div class="flex gap-2 items-center mt-1">
                <span class="text-sm font-bold text-blue-600">$${parseFloat(item.price).toFixed(2)}</span>
                <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded border">Size: ${sizes}</span>
              </div>
            </div>
            <div>
              <button onclick="deleteProduct(${item.id})" class="bg-red-50 text-red-600 p-2 rounded-lg hover:bg-red-100 text-xs font-semibold">
                🗑️ លុប
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Search
    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(p => 
        (p.title && p.title.toLowerCase().includes(query)) ||
        (p.description && p.description.toLowerCase().includes(query))
      );
      renderProducts(filtered);
    }

    // Delete Product
    async function deleteProduct(id) {
      if (!confirm('តើអ្នកប្រាកដថាចង់លុបទំនិញនេះចេញពីស្តុកមែនទេ?')) return;

      try {
        const { error } = await supabaseClient
          .from('products')
          .delete()
          .eq('id', id);

        if (error) throw error;

        alert('✅ លុបទំនិញជោគជ័យ!');
        loadProducts(); // ទាញទិន្នន័យថ្មីមកវិញ
      } catch (err) {
        alert('❌ មិនអាចលុបបានទេ៖ ' + err.message);
      }
    }

    // ដំណើរការដំបូង
    loadProducts();
  </script>
</body>
</html>
