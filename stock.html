<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - មើលស្តុក</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Kantumruy Pro', sans-serif !important; }
  </style>
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">
  <div class="max-w-xl mx-auto">
    
    <div class="flex justify-between items-center mb-5 bg-white p-2 rounded-xl shadow-sm border border-gray-200">
      <a href="admin.html" class="flex-1 py-1.5 text-center text-gray-600 hover:text-gray-800 font-medium text-xs transition">
        ➕ បញ្ចូលស្តុក
      </a>
      <a href="stock.html" class="flex-1 py-1.5 text-center bg-blue-600 text-white rounded-lg font-bold text-xs shadow-sm">
        📦 មើលស្តុក
      </a>
      <a href="sales.html" class="flex-1 py-1.5 text-center text-gray-600 hover:text-gray-800 font-medium text-xs transition">
        📈 របាយការណ៍
      </a>
    </div>

    <div class="mb-4">
      <input type="text" id="searchInput" onkeyup="filterStock()" placeholder="🔍 ស្វែងរកតាមលេខកូដ ឬប្រភេទខោ..." class="w-full p-2.5 border rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-sm">
    </div>

    <div id="stockList" class="space-y-3">
      <p class="text-center text-gray-500 py-8">⏳ កំពុងទាញទិន្នន័យស្តុក...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gzclvhcvsfcslilxaiyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VVZOPQCUQFRDSlOgXhUI5g_kri2S-Ww'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];

    async function loadStock() {
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;
        allProducts = data || [];
        filterStock();
      } catch (err) {
        document.getElementById('stockList').innerHTML = `<p class="text-center text-red-500 py-8">❌ មិនអាចទាញទិន្នន័យបានទេ៖ ${err.message}</p>`;
      }
    }

    function filterStock() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(p => 
        (p.title && p.title.toLowerCase().includes(q)) || 
        (p.description && p.description.toLowerCase().includes(q))
      );
      renderStock(filtered);
    }

    function renderStock(products) {
      const container = document.getElementById('stockList');
      if (products.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400 py-8">📭 គ្មានទិន្នន័យ</p>`;
        return;
      }

      container.innerHTML = products.map(p => {
        const img = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/150';
        const isSold = p.stock_quantity === 0 || (p.description && p.description.includes('[SOLD OUT]'));

        return `
          <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-200 flex items-center justify-between gap-3">
            <img src="${img}" class="w-16 h-16 object-cover rounded-xl flex-shrink-0">
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-gray-800 text-sm truncate">${p.title || 'ខោជជុស'}</h3>
              <p class="text-xs text-gray-500 truncate">${p.description || ''}</p>
              <div class="text-xs font-bold text-blue-600 mt-1">$${parseFloat(p.price).toFixed(2)}</div>
            </div>
            
            <div class="flex flex-col gap-1.5 flex-shrink-0">
              ${isSold ? 
                `<span class="bg-red-100 text-red-600 px-2 py-1 rounded-lg text-xs font-bold text-center">❌ លក់ដាច់</span>` : 
                `<button onclick="markAsSold(${p.id}, '${p.description || ''}')" class="bg-green-600 hover:bg-green-700 text-white px-2.5 py-1 rounded-lg text-xs font-bold shadow transition">🛒 លក់ដាច់</button>`
              }
              <button onclick="deleteProduct(${p.id})" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1">
                🗑️ លុប
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // មុខងារ Mark ជា SOLD OUT
    async function markAsSold(id, currentDesc) {
      if(!confirm('តើអ្នកប្រាកដថាបានលក់ខោនេះដាច់ហើយមែនទេ?')) return;
      try {
        const updatedDesc = currentDesc + ' [SOLD OUT]';
        const { error } = await supabaseClient
          .from('products')
          .update({ stock_quantity: 0, description: updatedDesc })
          .eq('id', id);

        if (error) throw error;
        alert('✅ អាប់ដេតជា SOLD OUT រួចរាល់!');
        loadStock();
      } catch(err) {
        alert('❌ បរាជ័យ៖ ' + err.message);
      }
    }

    // មុខងារ លុបទំនិញ
    async function deleteProduct(id) {
      if(!confirm('តើអ្នកប្រាកដជាចង់លុបទំនិញនេះចេញពី Database ដែរឬទេ?')) return;
      try {
        const { error } = await supabaseClient
          .from('products')
          .delete()
          .eq('id', id);

        if (error) throw error;
        alert('✅ បានលុបទំនិញជោគជ័យ!');
        loadStock();
      } catch(err) {
        alert('❌ មិនអាចលុបបានទេ៖ ' + err.message);
      }
    }

    loadStock();
  </script>
</body>
</html>
