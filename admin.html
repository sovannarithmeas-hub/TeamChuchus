<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - បញ្ចូលស្តុក</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Kantumruy Pro', sans-serif !important; }
  </style>
</head>
<body class="bg-gray-100 p-3 sm:p-4 font-sans text-gray-800">
  <div class="max-w-xl mx-auto">
    
    <div class="flex justify-between items-center mb-5 bg-white p-2 rounded-xl shadow-sm border border-gray-200">
      <a href="admin.html" class="flex-1 py-1.5 text-center bg-blue-600 text-white rounded-lg font-bold text-xs shadow-sm">
        ➕ បញ្ចូលស្តុក
      </a>
      <a href="stock.html" class="flex-1 py-1.5 text-center text-gray-600 hover:text-gray-800 rounded-lg font-medium text-xs transition">
        📦 មើលស្តុក
      </a>
      <a href="sales.html" class="flex-1 py-1.5 text-center text-gray-600 hover:text-gray-800 rounded-lg font-medium text-xs transition">
        📈 របាយការណ៍
      </a>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="text-lg font-bold text-gray-800 mb-1 flex items-center gap-2">
        ➕ បញ្ចូលស្តុកទំនិញថ្មី
      </h2>
      <p class="text-xs text-gray-500 mb-4">បញ្ចូលទិន្នន័យខោ និង Post ចូល Telegram Channel ស្វ័យប្រវត្តិ</p>

      <form id="productForm" class="space-y-3.5">
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">🏷️ លេខកូដ (#)</label>
            <input type="text" id="code" placeholder="J-001" required class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">👖 ម៉ូដ/ប្រាក</label>
            <input type="text" id="title" placeholder="Uniqlo / Levi's" required class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">💵 ថ្លៃលក់ ($)</label>
            <input type="number" step="0.01" id="price" placeholder="18.80" required class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">📉 ថ្លៃដើម ($)</label>
            <input type="number" step="0.01" id="costPrice" placeholder="10.00" required class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">📏 ទំហំទូទៅ (Size)</label>
          <input type="text" id="size" placeholder="S, M, L, XL..." required class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="bg-blue-50/50 p-3 rounded-xl border border-blue-100">
          <label class="block text-xs font-bold text-blue-800 mb-2">📐 ទំហំលម្អិតខោ (រង្វាស់)</label>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-[11px] font-medium text-gray-600 mb-1">ចង្កេះ (W)</label>
              <input type="text" id="waist" placeholder="33" required class="w-full p-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-[11px] font-medium text-gray-600 mb-1">សម្រុង (L)</label>
              <input type="text" id="length" placeholder="106" required class="w-full p-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-[11px] font-medium text-gray-600 mb-1">ចុងជើង (Leg)</label>
              <input type="text" id="leg" placeholder="17" required class="w-full p-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">📝 ចំណាំបន្ថែម (សាច់ខោ/ពណ៌...)</label>
          <textarea id="details" rows="2" placeholder="សាច់ទន់ ស្រួលស្លៀក ក្បាលប៊ូតុង..." class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">🖼️ រូបភាពទំនិញ (ជ្រើសបានច្រើនរូប)</label>
          <input type="file" id="imageFiles" accept="image/*" multiple required class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:outline-none file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow transition flex items-center justify-center gap-2 text-sm mt-2">
          🚀 រក្សាទុក និង Post ទៅ Telegram
        </button>

      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gzclvhcvsfcslilxaiyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VVZOPQCUQFRDSlOgXhUI5g_kri2S-Ww'; 
    const TELEGRAM_BOT_TOKEN = '8994221143:AAFtNb2tA7eqIzmbonP58qhdvgcxyODwZWA'; 
    const TELEGRAM_CHAT_ID = '@tobchuchusonline';

    const BUCKET_NAME = 'product-images'; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Upload រូបភាពទៅ Supabase Storage
    async function uploadImages(files) {
      const imageUrls = [];
      for (const file of files) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

        const { error: uploadError } = await supabaseClient.storage
          .from(BUCKET_NAME)
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(fileName);
        imageUrls.push(data.publicUrl);
      }
      return imageUrls;
    }

    // Post ទៅ Telegram
    async function postToTelegram(code, title, price, size, waist, length, leg, details, imageUrls) {
      const caption = `✨ <b>[ ផលិតផលថ្មីចូលស្តុក ]</b> ✨\n\n` +
                      `🏷️ លេខកូដទំនិញ: <b>#${code.toUpperCase()}</b>\n` +
                      `👖 ប្រភេទម៉ូដ: <b>${title}</b>\n` +
                      `💵 តម្លៃ: <b>$${parseFloat(price).toFixed(2)}</b>\n` +
                      `📏 Size / ទំហំ: <b>${size}</b>\n\n` +
                      `📝 <b>ព័ត៌មានទំហំ & លក្ខណៈ:</b>\n` +
                      `• ចង្កេះ (Waist): <b>${waist}</b>\n` +
                      `• ប្រវែង (Length): <b>${length}</b>\n` +
                      `• ចុងជើង: <b>${leg}</b>\n` +
                      (details ? `• ចំណាំ: ${details}\n\n` : `\n`) +
                      `🛍️ <b>កម៉្មង់ទិញតាមរយៈ Admin:</b> @YourAdminUsername\n` +
                      `🚚 <b>សេវាកម្មដឹកជញ្ជូន:</b> 24 ខេត្ត/ក្រុង`;

      if (imageUrls.length === 1) {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, photo: imageUrls[0], caption: caption, parse_mode: 'HTML' })
        });
      } else if (imageUrls.length > 1) {
        const media = imageUrls.map((url, idx) => ({
          type: 'photo',
          media: url,
          caption: idx === 0 ? caption : '',
          parse_mode: 'HTML'
        }));

        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMediaGroup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, media: media })
        });
      }
    }

    // Handle Form Submit
    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = '⏳ កំពុង Upload រូបភាព និងបញ្ចូលទិន្នន័យ...';

      try {
        const code = document.getElementById('code').value.trim();
        const title = document.getElementById('title').value.trim();
        const price = parseFloat(document.getElementById('price').value);
        const costPrice = parseFloat(document.getElementById('costPrice').value);
        const size = document.getElementById('size').value.trim();
        
        // ទាញតម្លៃ ចង្កេះ, សម្រុង, ចុងជើង
        const waist = document.getElementById('waist').value.trim();
        const length = document.getElementById('length').value.trim();
        const leg = document.getElementById('leg').value.trim();
        const details = document.getElementById('details').value.trim();

        const fileInput = document.getElementById('imageFiles');

        if (fileInput.files.length === 0) throw new Error('សូមជ្រើសរើសរូបភាពយ៉ាងហោចណាស់ ១ សន្លឹក!');

        // 1. Upload រូបភាពទៅ Supabase Storage
        const imageUrls = await uploadImages(fileInput.files);

        // 2. រៀបចំព័ត៌មានលម្អិត និងរក្សាទុកទៅ Database
        const fullDesc = `[Code: ${code}] W:${waist} L:${length} Leg:${leg}${details ? ' ' + details : ''}`;
        
        const { error: dbError } = await supabaseClient.from('products').insert([{
          title: title,
          price: price,
          cost_price: costPrice,
          sizes: [size],
          description: fullDesc,
          images: imageUrls,
          stock_quantity: 1
        }]);

        if (dbError) throw dbError;

        // 3. Post ទៅ Telegram
        await postToTelegram(code, title, price, size, waist, length, leg, details, imageUrls);

        alert('✅ បញ្ចូលស្តុក និង Post ទៅ Telegram ជោគជ័យ!');
        document.getElementById('productForm').reset();
      } catch (err) {
        alert('❌ បរាជ័យ៖ ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '🚀 រក្សាទុក និង Post ទៅ Telegram';
      }
    });
  </script>
</body>
</html>
