<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2864ee"><title>Admin · តូបជជុស Online</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><div id="toast" class="toast"></div><main class="shell"><section id="authView" class="panel auth-panel"><div class="brand"><div class="brand-mark">🛍️</div><div><b>តូបជជុស Online</b><small>Admin Product Management</small></div></div><h1>ចូលគ្រប់គ្រងហាង</h1><p class="muted">ផ្នែកនេះសម្រាប់ម្ចាស់ហាងតែប៉ុណ្ណោះ។ សូមប្រើ Email ដែលត្រូវបានផ្តល់សិទ្ធិ Admin រួច។</p><form id="loginForm" class="form-grid" autocomplete="on"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button id="loginBtn" class="primary" type="submit">ចូល Admin</button></form><p id="authMsg" class="msg"></p></section><section id="appView" hidden><header class="topbar panel"><div><b>Admin · ផលិតផល</b><small id="adminEmail"></small></div><div class="top-actions"><button id="refreshBtn" class="ghost" type="button">↻ Refresh</button><button id="logoutBtn" class="ghost danger" type="button">ចាកចេញ</button></div></header><section class="panel toolbar"><div><h1>ផលិតផល</h1><p class="muted">បន្ថែម កែប្រែ បិទ/បើក និងលុបផលិតផល។</p></div><button id="newBtn" class="primary" type="button">＋ បន្ថែមទំនិញ</button></section><section id="editor" class="panel editor" hidden><div class="editor-head"><h2 id="editorTitle">បន្ថែមទំនិញ</h2><button id="cancelBtn" class="icon-btn" type="button">×</button></div><form id="productForm" class="form-grid"><input id="productId" type="hidden"><div class="upload-row"><label class="upload-box"><input id="imageFile" type="file" accept="image/*" multiple><span>📷 ជ្រើសរើសរូបផលិតផល</span><small>អាចជ្រើសរើសច្រើនរូប</small></label><div class="preview"><div id="imagePreviews" class="image-previews"></div><span id="previewEmpty">មិនទាន់មានរូប</span></div></div><div class="two"><label>កូដទំនិញ<input id="code"></label><label>ឈ្មោះទំនិញ<input id="name" required></label></div><div class="two"><label>តម្លៃ (USD)<input id="price" required type="number" min="0" step="0.01"></label><label>ប្រភេទ<input id="category" required></label></div><label>ពិពណ៌នា<textarea id="description" rows="4"></textarea></label><div class="two"><label>🔗 TikTok Link<input id="tiktokUrl" type="url"></label><label>🔗 Facebook Page Link<input id="facebookUrl" type="url"></label></div><label class="switch"><input id="active" type="checkbox" checked><span>បង្ហាញលើ Homepage</span></label><div class="form-actions"><button id="cancelBtn2" type="button" class="ghost">បោះបង់</button><button id="saveBtn" type="submit" class="primary">រក្សាទុកផលិតផល</button></div></form></section><section id="productList" class="product-list"></section></section></main><script type="importmap">{"imports":{"@supabase/supabase-js":"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"}}</script><script type="module" src="admin.js"></script><script type="module" src="admin-image-manager-v2.js"></script></body></html>
