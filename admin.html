<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - Admin បញ្ចូលស្តុក</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Kantumruy Pro', sans-serif !important;
    }
  </style>
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">
  <div class="max-w-xl mx-auto">
    
    <div class="flex justify-between items-center mb-5 bg-white p-2 rounded-xl shadow-sm border border-gray-200">
      <a href="admin.html" class="flex-1 py-1.5 text-center bg-blue-600 text-white rounded-lg font-bold text-xs shadow-sm">
        ➕ បញ្ចូលស្តុក
      </a>
      <a href="stock.html" class="flex-1 py-1.5 text-center text-gray-600 hover:text-gray-800 rounded-lg font-medium text-xs transition">
        📦 មើលស្តុក
      </a>
      <a href="sales.html" class="flex-1 py-1.5 text-center text-gray-600 hover:text-gray-800 rounded-lg font-medium text-xs transition">
        📈 របាយការណ៍
      </a>
    </div>

    <div class="mb-4">
      <h1 class="text-xl font-bold text-gray-800">➕ បញ្ចូលស្តុកទំនិញថ្មី</h1>
      <p class="text-xs text-gray-500">បញ្ចូលទិន្នន័យខោ និង Post ចូល Telegram Channel ស្វ័យប្រវត្តិ</p>
    </div>

    <form id="productForm" onsubmit="handleSubmit(event)" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">🏷️ លេខកូដ (#)</label>
          <input type="text" id="code" required placeholder="J-001" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">👖 ម៉ូដ/ប្រាក</label>
          <input type="text" id="title" required placeholder="Uniqlo / Levi's" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">💵 ថ្លៃលក់ ($)</label>
          <input type="number" step="0.01" id="price" required placeholder="18.80" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">📉 ថ្លៃដើម ($)</label>
          <input type="number" step="0.01" id="cost_price" required placeholder="10.00" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">📏 ទំហំ (Size)</label>
        <input type="text" id="sizes" required placeholder="L, XL ឬ ចង្កេះ 32" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">📝 ព័ត៌មានបន្ថែម/ទំហំលម្អិត</label>
        <textarea id="description" rows="3" placeholder="ចង្កេះ: 33, ប្រវែង: 106, ជើង: 17..." class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">🖼️ រូបភាព URL (បំបែកដោយសញ្ញាក្បៀស ,)</label>
        <textarea id="images" rows="2" placeholder="https://link1.jpg, https://link2.jpg" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm shadow transition mt-2">
        🚀 រក្សាទុក និង Post ទៅ Telegram
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://gzclvhcvsfcslilxaiyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VVZOPQCUQFRDSlOgXhUI5g_kri2S-Ww'; 
    const TELEGRAM_BOT_TOKEN = '8994221143:AAFtNb2tA7eqIzmbonP58qhdvgcxyODwZWA'; 
    const TELEGRAM_CHAT_ID = '@tobchuchusonline';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = '⏳ កំពុងរក្សាទុក...';

      const code = document.getElementById('code').value.trim();
      const title = document.getElementById('title').value.trim();
      const price = parseFloat(document.getElementById('price').value);
      const cost_price = parseFloat(document.getElementById('cost_price').value);
      const sizes = document.getElementById('sizes').value.trim();
      const userDesc = document.getElementById('description').value.trim();
      const imagesInput = document.getElementById('images').value.trim();

      const imgArray = imagesInput ? imagesInput.split(',').map(s => s.trim()) : [];
      const fullDesc = `[Code: ${code}] ${userDesc}`;

      try {
        // ១. រក្សាទុកក្នុង Supabase Database
        const { data, error } = await supabaseClient
          .from('products')
          .insert([{
            title: title,
            price: price,
            cost_price: cost_price,
            sizes: [sizes],
            description: fullDesc,
            images: imgArray,
            stock_quantity: 1
          }]);

        if (error) throw error;

        // ២. Post ទៅ Telegram Channel
        await sendToTelegram(code, title, price, sizes, userDesc);

        alert('✅ បញ្ចូលស្តុក និង Post ទៅ Telegram ជោគជ័យ!');
        document.getElementById('productForm').reset();
      } catch (err) {
        alert('❌ មានបញ្ហា៖ ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '🚀 រក្សាទុក និង Post ទៅ Telegram';
      }
    }

    async function sendToTelegram(code, title, price, sizes, desc) {
      if (!TELEGRAM_BOT_TOKEN) return;

      const postText = `✨ <b>[ ផលិតផលថ្មីចូលស្តុក ]</b> ✨\n\n` +
                       `🏷️ លេខកូដទំនិញ៖ <b>#${code.toUpperCase()}</b>\n` +
                       `👖 ប្រភេទម៉ូដ៖ <b>${title}</b>\n` +
                       `💵 តម្លៃ៖ <b>$${price.toFixed(2)}</b>\n` +
                       `📏 Size / ទំហំ៖ <b>${sizes}</b>\n\n` +
                       `📝 <b>ព័ត៌មានទំហំ & លម្អិត៖</b>\n${desc}\n\n` +
                       `🛍️ <b>កម្ម៉ង់ទិញតាមលោក Admin:</b> @Torp_jojus_online\n` +
                       `🚚 <b>សេវាកម្មដឹកជញ្ជូន៖</b> ២៤ ខេត្ត/ក្រុង`;

      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: postText,
            parse_mode: 'HTML'
          })
        });
      } catch (err) {
        console.error('Telegram Post Error:', err);
      }
    }
  </script>
</body>
</html>
