<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - បញ្ចូលស្តុក</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Kantumruy Pro', sans-serif !important; }
  </style>
</head>
<body class="bg-gray-100 p-3 sm:p-4 font-sans text-gray-800">
  <div class="max-w-xl mx-auto">
    
    <div class="flex justify-between items-center mb-5 bg-white p-2 rounded-xl shadow-sm border border-gray-200">
      <a href="admin.html" class="flex-1 py-1.5 text-center bg-blue-600 text-white rounded-lg font-bold text-xs shadow-sm">
        ➕ បញ្ចូលស្តុក
      </a>
      <a href="stock.html" class="flex-1 py-1.5 text-center text-gray-600 hover:text-gray-800 rounded-lg font-medium text-xs transition">
        📦 មើលស្តុក
      </a>
      <a href="sales.html" class="flex-1 py-1.5 text-center text-gray-600 hover:text-gray-800 rounded-lg font-medium text-xs transition">
        📈 របាយការណ៍
      </a>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="text-lg font-bold text-gray-800 mb-1 flex items-center gap-2">
        ➕ បញ្ចូលស្តុកទំនិញថ្មី
      </h2>
      <p class="text-xs text-gray-500 mb-4">បញ្ចូលទិន្នន័យខោ និង Post ចូល Telegram Channel ស្វ័យប្រវត្តិ</p>

      <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 mb-4">
        <label class="block text-xs font-bold text-amber-900 mb-1">⚡ វាយ/Paste ទិន្នន័យ ១ជួរ (Shortcut)</label>
        <div class="flex gap-2">
          <input type="text" id="quickInput" placeholder="J-001 Levi's 18.80 10.00 L 33 106 17 សាច់ស្អាត" class="flex-1 p-2 border rounded-lg text-xs bg-white focus:ring-2 focus:ring-amber-500 outline-none">
          <button type="button" onclick="parseQuickInput()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition">
            បំពេញ
          </button>
        </div>
        <p class="text-[10px] text-amber-700 mt-1">លំដាប់៖ កូដ ម៉ូដ ថ្លៃលក់ ថ្លៃដើម Size ចង្កេះ សម្រុង ចុងជើង ចំណាំ</p>
      </div>

      <form id="productForm" class="space-y-3.5">
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">🏷️ លេខកូដ (#)</label>
            <input type="text" id="code" placeholder="J-001" required class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">👖 ម៉ូដ/ប្រាក</label>
            <input type="text" id="title" placeholder="Uniqlo / Levi's" required class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">💵 ថ្លៃលក់ ($)</label>
            <input type="number" step="0.01" id="price" placeholder="18.80" required class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">📉 ថ្លៃដើម ($)</label>
            <input type="number" step="0.01" id="costPrice" placeholder="10.00" required class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">📏 ទំហំទូទៅ (Size)</label>
          <input type="text" id="size" placeholder="S, M, L, XL..." required class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="bg-blue-50/50 p-3 rounded-xl border border-blue-100">
          <label class="block text-xs font-bold text-blue-800 mb-2">📐 ទំហំលម្អិតខោ (រង្វាស់)</label>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-[11px] font-medium text-gray-600 mb-1">ចង្កេះ (W)</label>
              <input type="text" id="waist" placeholder="33" required class="w-full p-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-[11px] font-medium text-gray-600 mb-1">សម្រុង (L)</label>
              <input type="text" id="length" placeholder="106" required class="w-full p-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-[11px] font-medium text-gray-600 mb-1">ចុងជើង (Leg)</label>
              <input type="text" id="leg" placeholder="17" required class="w-full p-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="block text-xs font-bold text-gray-800">📝 ចំណាំ / Caption Template</label>
            <button type="button" onclick="clearDetails()" class="text-[10px] text-red-500 font-medium hover:underline">🗑️ លុបចេញ</button>
          </div>
          
          <div class="mb-2">
            <span class="text-[10px] text-gray-500 block mb-1">ទម្រង់ Caption៖</span>
            <div class="flex flex-wrap gap-1.5">
              <button type="button" onclick="applyCaptionTemplate(1)" class="text-[11px] bg-blue-50 hover:bg-blue-100 text-blue-700 px-2.5 py-1 rounded-lg border border-blue-200 font-medium transition">
                📋 Form ស្ដង់ដារ
              </button>
              <button type="button" onclick="applyCaptionTemplate(2)" class="text-[11px] bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-lg border border-indigo-200 font-medium transition">
                ✨ សាច់យឺត/ស្ទ្រីច
              </button>
              <button type="button" onclick="applyCaptionTemplate(3)" class="text-[11px] bg-purple-50 hover:bg-purple-100 text-purple-700 px-2.5 py-1 rounded-lg border border-purple-200 font-medium transition">
                🔥 ទំនិញ Grade A (99%)
              </button>
            </div>
          </div>

          <div class="mb-2">
            <span class="text-[10px] text-gray-500 block mb-1">ថែមពាក្យរហ័ស៖</span>
            <div class="flex flex-wrap gap-1">
              <button type="button" onclick="addTag('• សាច់ទន់ ស្រួលស្លៀក')" class="text-[10px] bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-0.5 rounded border border-gray-300">☁️ សាច់ទន់</button>
              <button type="button" onclick="addTag('• ក្បាលប៊ូតុង')" class="text-[10px] bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-0.5 rounded border border-gray-300">🔘 ក្បាលប៊ូតុង</button>
              <button type="button" onclick="addTag('• ក្បាលរ៉ូត')" class="text-[10px] bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-0.5 rounded border border-gray-300">🤐 ក្បាលរ៉ូត</button>
              <button type="button" onclick="addTag('• ពណ៌នៅជ្រះស្អាត')" class="text-[10px] bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-0.5 rounded border border-gray-300">🎨 ពណ៌ជ្រះស្អាត</button>
            </div>
          </div>

          <textarea id="details" rows="4" placeholder="ជ្រើសរើស Caption Template ឬវាយបញ្ចូលនៅទីនេះ..." class="w-full p-2.5 border rounded-lg text-xs leading-relaxed focus:ring-2 focus:ring-blue-500 outline-none font-mono bg-gray-50"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">🖼️ រូបភាពទំនិញ (ជ្រើសបានច្រើនរូប)</label>
          <input type="file" id="imageFiles" accept="image/*" multiple required class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:outline-none file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow transition flex items-center justify-center gap-2 text-sm mt-2">
          🚀 រក្សាទុក និង Post ទៅ Telegram (Ctrl + Enter)
        </button>

      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gzclvhcvsfcslilxaiyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VVZOPQCUQFRDSlOgXhUI5g_kri2S-Ww'; 
    const TELEGRAM_BOT_TOKEN = '8994221143:AAFtNb2tA7eqIzmbonP58qhdvgcxyODwZWA'; 
    const TELEGRAM_CHAT_ID = '@tobchuchusonline';

    const BUCKET_NAME = 'product-images'; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 📋 TEMPLATES CAPTION
    function applyCaptionTemplate(type) {
      const details = document.getElementById('details');
      if (type === 1) {
        details.value = `• ស្ថានភាព៖ នៅស្អាត 90%+\n• ប្រភេទសាច់៖ សាច់ខោឃាវប៊យស្អាត\n• ម៉ូដ៖ ជើងត្រង់/ស្ដង់ដារ`;
      } else if (type === 2) {
        details.value = `• ស្ថានភាព៖ នៅស្អាត 95%\n• ប្រភេទសាច់៖ សាច់ស្ទ្រីច (យឺតស្រួលស្លៀក)\n• លក្ខណៈពិសេស៖ មិនតឹងជើង ស្រួលផ្លាស់ប្តូរទីតាំង`;
      } else if (type === 3) {
        details.value = `• ស្ថានភាព៖ Grade A+ (ស្អាត 99% ដូចថ្មី)\n• ប្រភេទសាច់៖ សាច់ក្រាស់ស្អាត ពណ៌មិនទាន់ស្លេក\n• ក្បាលប៊ូតុង/រ៉ូត៖ នៅមាំទាំងអស់`;
      }
    }

    function addTag(tag) {
      const details = document.getElementById('details');
      if (details.value.trim() === '') {
        details.value = tag;
      } else {
        details.value += '\n' + tag;
      }
    }

    function clearDetails() {
      document.getElementById('details').value = '';
    }

    // FUNCTION: BATCH PARSER
    function parseQuickInput() {
      const input = document.getElementById('quickInput').value.trim();
      if (!input) return;

      const parts = input.split(/\s+/);

      if (parts[0]) document.getElementById('code').value = parts[0];
      if (parts[1]) document.getElementById('title').value = parts[1];
      if (parts[2]) document.getElementById('price').value = parts[2];
      if (parts[3]) document.getElementById('costPrice').value = parts[3];
      if (parts[4]) document.getElementById('size').value = parts[4];
      if (parts[5]) document.getElementById('waist').value = parts[5];
      if (parts[6]) document.getElementById('length').value = parts[6];
      if (parts[7]) document.getElementById('leg').value = parts[7];
      if (parts.length > 8) {
        document.getElementById('details').value = parts.slice(8).join(' ');
      }
    }

    // Keyboard Shortcuts
    document.getElementById('quickInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        parseQuickInput();
        document.getElementById('imageFiles').focus();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('productForm').requestSubmit();
      }
    });

    // Upload រូបភាព
    async function uploadImages(files) {
      const imageUrls = [];
      for (const file of files) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

        const { error: uploadError } = await supabaseClient.storage
          .from(BUCKET_NAME)
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(fileName);
        imageUrls.push(data.publicUrl);
      }
      return imageUrls;
    }

    // Post ទៅ Telegram
    async function postToTelegram(code, title, price, size, waist, length, leg, details, imageUrls) {
      const caption = `✨ <b>[ ផលិតផលថ្មីចូលស្តុក ]</b> ✨\n\n` +
                      `🏷️ លេខកូដទំនិញ: <b>#${code.toUpperCase()}</b>\n` +
                      `👖 ប្រភេទម៉ូដ: <b>${title}</b>\n` +
                      `💵 តម្លៃ: <b>$${parseFloat(price).toFixed(2)}</b>\n` +
                      `📏 Size / ទំហំ: <b>${size}</b>\n\n` +
                      `📝 <b>ព័ត៌មានទំហំ & លក្ខណៈ:</b>\n` +
                      `• ចង្កេះ (Waist): <b>${waist}</b>\n` +
                      `• ប្រវែង (Length): <b>${length}</b>\n` +
                      `• ចុងជើង: <b>${leg}</b>\n` +
                      (details ? `\n${details}\n\n` : `\n`) +
                      `🛍️ <b>កម៉្មង់ទិញតាមរយៈ Admin:</b> @Torp_jojus_online\n` +
                      `🚚 <b>សេវាកម្មដឹកជញ្ជូន:</b> 24 ខេត្ត/ក្រុង`;

      if (imageUrls.length === 1) {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, photo: imageUrls[0], caption: caption, parse_mode: 'HTML' })
        });
      } else if (imageUrls.length > 1) {
        const media = imageUrls.map((url, idx) => ({
          type: 'photo',
          media: url,
          caption: idx === 0 ? caption : '',
          parse_mode: 'HTML'
        }));

        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMediaGroup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, media: media })
        });
      }
    }

    // Handle Form Submit
    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = '⏳ កំពុង Upload រូបភាព និងបញ្ចូលទិន្នន័យ...';

      try {
        const code = document.getElementById('code').value.trim();
        const title = document.getElementById('title').value.trim();
        const price = parseFloat(document.getElementById('price').value);
        const costPrice = parseFloat(document.getElementById('costPrice').value);
        const size = document.getElementById('size').value.trim();
        
        const waist = document.getElementById('waist').value.trim();
        const length = document.getElementById('length').value.trim();
        const leg = document.getElementById('leg').value.trim();
        const details = document.getElementById('details').value.trim();

        const fileInput = document.getElementById('imageFiles');

        if (fileInput.files.length === 0) throw new Error('សូមជ្រើសរើសរូបភាពយ៉ាងហោចណាស់ ១ សន្លឹក!');

        // 1. Upload រូបភាព
        const imageUrls = await uploadImages(fileInput.files);

        // 2. រក្សាទុក Database
        const fullDesc = `[Code: ${code}] W:${waist} L:${length} Leg:${leg}${details ? '\n' + details : ''}`;
        
        const { error: dbError } = await supabaseClient.from('products').insert([{
          title: title,
          price: price,
          cost_price: costPrice,
          sizes: [size],
          description: fullDesc,
          images: imageUrls,
          stock_quantity: 1
        }]);

        if (dbError) throw dbError;

        // 3. Post ទៅ Telegram
        await postToTelegram(code, title, price, size, waist, length, leg, details, imageUrls);

        alert('✅ បញ្ចូលស្តុក និង Post ទៅ Telegram ជោគជ័យ!');
        document.getElementById('productForm').reset();
        document.getElementById('quickInput').value = '';
        document.getElementById('quickInput').focus();
      } catch (err) {
        alert('❌ បរាជ័យ៖ ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '🚀 រក្សាទុក និង Post ទៅ Telegram (Ctrl + Enter)';
      }
    });
  </script>
</body>
</html>
