<!DOCTYPE html>
<html lang="km">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ព័ត៌មានដឹកជញ្ជូន</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{font-family:'Kantumruy Pro',sans-serif;background:#f0f7ff;}</style>
</head>
<body class="p-4 max-w-md mx-auto">
<div class="bg-white rounded-2xl p-5 shadow-lg">
  <h1 class="font-bold text-lg mb-4">🚚 ព័ត៌មានដឹកជញ្ជូន</h1>
  
  <form id="deliveryForm">
    <!-- ឈ្មោះ (Lock ស្វ័យប្រវត្តិ) -->
    <div class="mb-3">
      <label class="block font-semibold mb-1 text-sm">👤 ឈ្មោះអតិថិជន</label>
      <input type="text" id="custName" readonly disabled class="w-full p-3 rounded-xl border bg-gray-100 text-gray-700 cursor-not-allowed">
    </div>
    
    <!-- លេខទូរស័ព្ទ (បញ្ចូលតែលេខ) -->
    <div class="mb-3">
      <label class="block font-semibold mb-1 text-sm">📞 លេខទូរស័ព្ទ</label>
      <input type="tel" id="custPhone" required placeholder="012345678" class="w-full p-3 rounded-xl border focus:border-blue-500 outline-none">
    </div>

    <!-- អាសយដ្ឋាន -->
    <div class="mb-3">
      <label class="block font-semibold mb-1 text-sm">📍 អាសយដ្ឋាន</label>
      <textarea id="custAddress" required rows="2" placeholder="ផ្ទះលេខ, ផ្លូវ..." class="w-full p-3 rounded-xl border focus:border-blue-500 outline-none"></textarea>
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md hover:bg-blue-700">បន្តទៅការបង់ប្រាក់</button>
  </form>
</div>

<script>
  const tg = window.Telegram?.WebApp; if(tg) tg.ready();
  
  // ទាញឈ្មោះ Telegram មកដាក់
  const nameInput = document.getElementById('custName');
  let tgName = "ភ្ញៀវ";
  if(tg && tg.initDataUnsafe?.user) {
    const u = tg.initDataUnsafe.user;
    tgName = [u.first_name, u.last_name].filter(Boolean).join(' ');
  }
  nameInput.value = tgName;

  // ការពារការបញ្ចូលអក្សរក្នុង Phone
  document.getElementById('custPhone').addEventListener('keydown', function(e) {
    if(!/^[0-9]$/.test(e.key) && !['Backspace','Delete','Tab','ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();
    }
  });

  document.getElementById('deliveryForm').onsubmit = function(e) {
    e.preventDefault();
    const order = {
      cart: [JSON.parse(localStorage.getItem('buyNowItem'))],
      details: {
        customer: {
          name: nameInput.value,
          phone: document.getElementById('custPhone').value,
          address: document.getElementById('custAddress').value
        }
      }
    };
    localStorage.setItem('pendingOrder', JSON.stringify(order));
    localStorage.removeItem('buyNowItem');
    window.location.href = 'waiting-payment.html';
  };
</script>
</body>
</html>
