<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - កត់ត្រាការដឹកជញ្ជូន</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Kantumruy Pro', sans-serif !important;
    }
  </style>
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">
  <div class="max-w-2xl mx-auto">
    
    <div class="flex justify-between items-center mb-5 bg-white p-2 rounded-xl shadow-sm border border-gray-200 overflow-x-auto text-xs">
      <a href="admin.html" class="flex-1 min-w-[70px] py-1.5 text-center text-gray-600 hover:text-gray-800 font-medium">➕ បញ្ចូលស្តុក</a>
      <a href="stock.html" class="flex-1 min-w-[70px] py-1.5 text-center text-gray-600 hover:text-gray-800 font-medium">📦 មើលស្តុក</a>
      <a href="delivery.html" class="flex-1 min-w-[70px] py-1.5 text-center bg-blue-600 text-white rounded-lg font-bold shadow-sm">🚚 ដឹកជញ្ជូន</a>
      <a href="sales.html" class="flex-1 min-w-[70px] py-1.5 text-center text-gray-600 hover:text-gray-800 font-medium">📈 របាយការណ៍</a>
    </div>

    <div class="mb-4">
      <h1 class="text-xl font-bold text-gray-800">🚚 កត់ត្រា & តាមដានការដឹកជញ្ជូន</h1>
      <p class="text-xs text-gray-500">គ្រប់គ្រងការផ្ញើឥវ៉ាន់ជូនអតិថិជនតាមក្រុមហ៊ុនដឹក</p>
    </div>

    <form id="deliveryForm" onsubmit="handleDeliverySubmit(event)" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3 mb-6">
      <h2 class="font-bold text-sm text-gray-700 border-b pb-2">➕ បញ្ចូលការដឹកជញ្ជូនថ្មី</h2>
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">👤 ឈ្មោះអតិថិជន</label>
          <input type="text" id="customer_name" required placeholder="ឈ្មោះភ្ញៀវ" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">📞 លេខទូរស័ព្ទ</label>
          <input type="text" id="customer_phone" required placeholder="012 345 678" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white outline-none">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">🏷️ លេខកូដទំនិញ/ខោ</label>
          <input type="text" id="item_code" required placeholder="J-001, J-002" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">🏢 ក្រុមហ៊ុនដឹក</label>
          <select id="courier_name" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white outline-none font-medium">
            <option value="វីរៈប៊ុនថាំ (VET)">វីរៈប៊ុនថាំ (VET)</option>
            <option value="J&T Express">J&T Express</option>
            <option value="Capitol Express">Capitol Express</option>
            <option value="ដឹកជញ្ជូនផ្ទាល់ (Delivery)">ដឹកជញ្ជូនផ្ទាល់ (Delivery)</option>
            <option value="ផ្សេងៗ">ផ្សេងៗ</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">📍 អាសយដ្ឋាន/ខេត្ត-ក្រុង</label>
        <input type="text" id="address" required placeholder="ឧ. ភ្នំពេញ, បាត់ដំបង..." class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white outline-none">
      </div>

      <button onclick="goToInvoice()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">
  📄 មើលវិក្កយបត្រ (Invoice)
      </button>

<script>
  function goToInvoice() {
    // បញ្ជូនទៅទំព័រ invoice.html
    window.location.href = 'invoice.html';
  }
</script>
    </form>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-3.5 border-b bg-gray-50 flex justify-between items-center">
        <h3 class="font-bold text-gray-700 text-sm">📋 បញ្ជីកត់ត្រាការដឹកជញ្ជូន</h3>
        <span class="text-xs text-gray-500" id="deliveryCount">0 ជើង</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-gray-600">
          <thead class="bg-gray-100 text-gray-700 uppercase font-semibold border-b">
            <tr>
              <th class="p-3">អតិថិជន / កូដ</th>
              <th class="p-3">អាសយដ្ឋាន / ក្រុមហ៊ុន</th>
              <th class="p-3">ស្ថានភាព</th>
              <th class="p-3 text-center">សកម្មភាព</th>
            </tr>
          </thead>
          <tbody id="deliveryTableBody" class="divide-y divide-gray-100">
            <tr>
              <td colspan="4" class="text-center py-6 text-gray-400">⏳ កំពុងទាញទិន្នន័យ...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://gzclvhcvsfcslilxaiyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VVZOPQCUQFRDSlOgXhUI5g_kri2S-Ww'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let deliveries = [];

    // ទាញយកទិន្នន័យដឹកជញ្ជូនពី Supabase (Table: deliveries)
    async function loadDeliveries() {
      const tableBody = document.getElementById('deliveryTableBody');
      try {
        const { data, error } = await supabaseClient
          .from('deliveries')
          .select('*')
          .order('id', { ascending: false });

        if (error) {
          // ប្រសិនបើមិនទាន់មាន Table វានឹងបង្ហាញសារប្រាប់ឱ្យបង្កើត Table
          if (error.code === '42P01') {
            tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-amber-600 font-medium">⚠️ សូមបង្កើត Table ឈ្មោះ "deliveries" ក្នុង Supabase ជាមុនសិន</td></tr>`;
            return;
          }
          throw error;
        }

        deliveries = data || [];
        document.getElementById('deliveryCount').innerText = `${deliveries.length} ជើង`;

        if (deliveries.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-400">📭 មិនទាន់មានទិន្នន័យដឹកជញ្ជូននៅឡើយទេ</td></tr>`;
          return;
        }

        tableBody.innerHTML = deliveries.map(item => {
          let statusBadge = '';
          if (item.status === ' pending') {
            statusBadge = `<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded font-bold">⏳ កំពុងរៀបចំ</span>`;
          } else if (item.status === 'shipping') {
            statusBadge = `<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-bold">🚚 កំពុងដឹក</span>`;
          } else {
            statusBadge = `<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded font-bold">✅ រួចរាល់</span>`;
          }

          return `
            <tr class="hover:bg-gray-50">
              <td class="p-3">
                <div class="font-bold text-gray-800">${item.customer_name}</div>
                <div class="text-[11px] text-gray-500">${item.customer_phone} | <span class="text-blue-600 font-semibold">#${item.item_code}</span></div>
              </td>
              <td class="p-3">
                <div class="font-medium text-gray-700">${item.address}</div>
                <div class="text-[11px] text-gray-400">${item.courier_name}</div>
              </td>
              <td class="p-3">${statusBadge}</td>
              <td class="p-3 text-center">
                <select onchange="updateStatus(${item.id}, this.value)" class="text-[11px] border rounded p-1 bg-white focus:ring-1 focus:ring-blue-500">
                  <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>⏳ កំពុងរៀបចំ</option>
                  <option value="shipping" ${item.status === 'shipping' ? 'selected' : ''}>🚚 កំពុងដឹក</option>
                  <option value="delivered" ${item.status === 'delivered' ? 'selected' : ''}>✅ រួចរាល់</option>
                </select>
              </td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-red-500">❌ មានបញ្ហា៖ ${err.message}</td></tr>`;
      }
    }

    // បញ្ចូលទិន្នន័យដឹកជញ្ជូនថ្មី
    async function handleDeliverySubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('deliveryBtn');
      btn.disabled = true;

      const payload = {
        customer_name: document.getElementById('customer_name').value.trim(),
        customer_phone: document.getElementById('customer_phone').value.trim(),
        item_code: document.getElementById('item_code').value.trim(),
        courier_name: document.getElementById('courier_name').value,
        address: document.getElementById('address').value.trim(),
        status: 'pending'
      };

      try {
        const { error } = await supabaseClient.from('deliveries').insert([payload]);
        if (error) throw error;

        alert('✅ កត់ត្រាការដឹកជញ្ជូនជោគជ័យ!');
        document.getElementById('deliveryForm').reset();
        loadDeliveries();
      } catch (err) {
        alert('❌ បរាជ័យ៖ ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    // អាប់ដេត status ដឹកជញ្ជូន
    async function updateStatus(id, newStatus) {
      try {
        const { error } = await supabaseClient
          .from('deliveries')
          .update({ status: newStatus })
          .eq('id', id);

        if (error) throw error;
        loadDeliveries();
      } catch (err) {
        alert('❌ មិនអាចអាប់ដេត status បានទេ៖ ' + err.message);
      }
    }

    loadDeliveries();
  </script>
</body>
</html>
