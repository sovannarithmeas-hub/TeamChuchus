<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ព័ត៌មានដឹកជញ្ជូន និងការទូទាត់ - តូបជជុស Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body { 
      font-family: 'Kantumruy Pro', sans-serif; 
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    }

    input, textarea, select {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    /* Glassmorphism Card Style */
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Input Focus Animations */
    .custom-input {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .custom-input:focus {
      background-color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    /* Active Payment Card Glow */
    .payment-option-active {
      border-color: #2563eb !important;
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%) !important;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }

    /* Entry Animations */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen p-3 sm:p-5 flex items-center justify-center">

  <!-- Main Card Container -->
  <div class="glass-card w-full max-w-md p-5 rounded-3xl shadow-xl border border-white/80 space-y-4 animate-slide-up">
    
    <!-- Header Page -->
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-3">
      <div class="flex items-center gap-3">
        <button type="button" onclick="goBack()" 
                class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl active:scale-90 transition-all flex items-center justify-center shadow-xs">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
        </button>
        <img src="https://gzclvhcvsfcslilxaiyg.supabase.co/storage/v1/object/public/product-images/photo_2026-08-10_18-23-16.jpg" 
             onerror="this.src='https://via.placeholder.com/50';" 
             class="w-10 h-10 rounded-2xl object-cover border-2 border-blue-500/20 shadow-xs">
        <div>
          <h1 class="font-extrabold text-xs sm:text-sm text-slate-900 leading-tight">🚚 ព័ត៌មានដឹកជញ្ជូន & ទូទាត់</h1>
          <p class="text-[10px] text-slate-500 font-medium">បំពេញព័ត៌មានដើម្បីបន្តទៅការបង់ប្រាក់</p>
        </div>
      </div>
    </div>

    <!-- Selected Items Summary -->
    <div class="bg-gradient-to-br from-blue-50/80 to-indigo-50/50 border border-blue-100 p-3.5 rounded-2xl space-y-2 text-xs shadow-xs">
      <div class="flex items-center justify-between border-b border-blue-100/80 pb-1.5">
        <span class="font-extrabold text-blue-900 flex items-center gap-1">
          <span>📦</span> ទំនិញដែលបានជ្រើសរើស
        </span>
        <span id="itemCountBadge" class="text-[10px] bg-blue-600 text-white font-bold px-2 py-0.2 rounded-full">0 មុខ</span>
      </div>
      <div id="selectedItems" class="space-y-1.5 pt-0.5 text-slate-700 max-h-36 overflow-y-auto pr-1"></div>
    </div>

    <!-- Form Section -->
    <form id="deliveryForm" onsubmit="submitOrder(event)" class="space-y-4 text-xs">
      
      <div class="space-y-3">
        <p class="font-extrabold text-slate-900 text-xs sm:text-[13px] flex items-center gap-1.5">
          <span class="p-1 bg-blue-100 text-blue-600 rounded-lg text-xs">📍</span> ព័ត៌មានអ្នកទទួល និងទីតាំង
        </p>

        <!-- Customer Name -->
        <div>
          <label class="font-bold block mb-1 text-slate-700 text-[11px]">👤 ឈ្មោះអតិថិជន <span class="text-rose-500">*</span></label>
          <input type="text" id="custName" required placeholder="ឧទាហរណ៍៖ សុខ ជា" 
                 class="custom-input w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-medium placeholder:text-slate-400 text-xs">
        </div>

        <!-- Customer Phone -->
        <div>
          <label class="font-bold block mb-1 text-slate-700 text-[11px]">📞 លេខទូរស័ព្ទ <span class="text-rose-500">*</span></label>
          <input type="tel" id="custPhone" required placeholder="ឧទាហរណ៍៖ 012 345 678" 
                 class="custom-input w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-medium placeholder:text-slate-400 text-xs">
        </div>

        <!-- Address -->
        <div>
          <label class="font-bold block mb-1 text-slate-700 text-[11px]">📍 អាសយដ្ឋានដឹកជញ្ជូន / ទីតាំង <span class="text-rose-500">*</span></label>
          <textarea id="custAddress" required rows="2" placeholder="ឧទាហរណ៍៖ ភ្នំពេញ, ផ្ទះលេខ..., ផ្លូវ..." 
                    class="custom-input w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-medium placeholder:text-slate-400 text-xs"></textarea>
        </div>

        <!-- Location Dropdown -->
        <div>
          <label class="font-bold block mb-1 text-slate-700 text-[11px]">🚚 តំបន់ដឹកជញ្ជូន</label>
          <select id="deliveryLocation" onchange="calculateTotal()" 
                  class="custom-input w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-semibold text-slate-800 text-xs">
            <option value="1.5">🏙️ ភ្នំពេញ ($1.50)</option>
            <option value="2.5">🏞️ តាមខេត្ត ($2.50)</option>
          </select>
        </div>
      </div>

      <!-- Payment Method Selection -->
      <div class="pt-2 border-t border-slate-200/80 space-y-2">
        <p class="font-extrabold text-slate-900 text-xs sm:text-[13px] flex items-center gap-1.5">
          <span class="p-1 bg-emerald-100 text-emerald-600 rounded-lg text-xs">💳</span> វិធីសាស្ត្រទូទាត់ប្រាក់
        </p>

        <div class="grid grid-cols-1 gap-2">
          <label class="payment-option-active flex items-center justify-between p-3.5 border-2 rounded-2xl cursor-pointer transition-all">
            <div class="flex items-center gap-3">
              <input type="radio" name="paymentMethod" value="ABA_KHQR" checked class="w-4 h-4 text-blue-600 accent-blue-600">
              <div>
                <p class="font-extrabold text-slate-900 text-xs">ABA KHQR (ទូទាត់ភ្លាមៗ)</p>
                <p class="text-[10px] text-slate-500 font-medium">ស្កែន ABA Mobile App ស្វ័យប្រវត្តិ</p>
              </div>
            </div>
            <span class="text-[10px] bg-rose-600 text-white font-black px-2.5 py-1 rounded-lg shadow-xs tracking-wider">ABA</span>
          </label>
        </div>
      </div>

      <!-- Pricing Summary Card -->
      <div class="border border-slate-200/80 rounded-2xl p-3.5 space-y-1.5 font-bold bg-slate-50/80 shadow-xs">
        <div class="flex justify-between text-slate-500 text-xs">
          <span>ថ្លៃទំនិញសរុប៖</span>
          <span id="itemsTotalText" class="text-slate-800 font-extrabold">$0.00</span>
        </div>
        <div class="flex justify-between text-slate-500 text-xs">
          <span>ថ្លៃដឹកជញ្ជូន៖</span>
          <span id="deliveryFeeText" class="text-slate-800 font-extrabold">$1.50</span>
        </div>
        <div class="flex justify-between items-center text-sm pt-2 border-t border-slate-200">
          <span class="text-slate-900 font-extrabold">សរុបទឹកប្រាក់ត្រូវបង់៖</span>
          <span id="grandTotalText" class="text-xl text-blue-600 font-black tracking-tight">$0.00</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-2.5 pt-1">
        <button type="button" onclick="goBack()" 
                class="w-1/3 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-extrabold py-3.5 rounded-2xl text-center transition-all shadow-xs text-xs">
          ❌ បោះបង់
        </button>
        <button type="submit" 
                class="w-2/3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 active:scale-95 text-white font-extrabold py-3.5 rounded-2xl shadow-lg shadow-blue-500/25 transition-all text-xs flex items-center justify-center gap-1">
          🚀 <span>បន្តទៅការបង់ប្រាក់</span>
        </button>
      </div>

    </form>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // 1️⃣ ទាញយកទិន្នន័យពី LocalStorage
    const buyNowItem = JSON.parse(localStorage.getItem('buyNowItem'));
    const cartItems = JSON.parse(localStorage.getItem('cartData')) || [];
    let checkoutItems = [];

    if (buyNowItem) {
      checkoutItems = [buyNowItem];
    } else {
      checkoutItems = cartItems;
    }

    if (checkoutItems.length === 0) {
      window.location.href = 'index.html';
    }

    let itemsSubtotal = 0;

    // 2️⃣ Render បញ្ជីទំនិញ
    function renderCheckoutSummary() {
      const container = document.getElementById('selectedItems');
      itemsSubtotal = 0;

      document.getElementById('itemCountBadge').innerText = `${checkoutItems.length} មុខ`;

      container.innerHTML = checkoutItems.map((item, index) => {
        const price = parseFloat(item.price || 0);
        itemsSubtotal += price;

        const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
        const itemCode = codeMatch ? codeMatch[1] : (item.code || 'N/A');

        return `
          <div class="flex justify-between items-center bg-white/70 p-2 rounded-xl border border-blue-100/60 shadow-xs">
            <div class="flex items-center gap-2 truncate pr-2">
              <span class="font-extrabold bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-md text-[10px]">#${itemCode}</span>
              <span class="font-bold text-slate-800 truncate">${item.title}</span>
            </div>
            <span class="font-black text-slate-900">$${price.toFixed(2)}</span>
          </div>
        `;
      }).join('');

      document.getElementById('itemsTotalText').innerText = `$${itemsSubtotal.toFixed(2)}`;
      calculateTotal();
    }

    // 3️⃣ គណនាប្រាក់សរុប
    function calculateTotal() {
      const deliveryFee = parseFloat(document.getElementById('deliveryLocation').value || 1.5);
      const grandTotal = itemsSubtotal + deliveryFee;

      document.getElementById('deliveryFeeText').innerText = `$${deliveryFee.toFixed(2)}`;
      document.getElementById('grandTotalText').innerText = `$${grandTotal.toFixed(2)}`;
    }

    // 4️⃣ ប៊ូតុង Back
    function goBack() {
      localStorage.removeItem('buyNowItem');
      window.location.href = 'index.html';
    }

    // 5️⃣ Submit Order
    function submitOrder(event) {
      event.preventDefault();

      const deliveryFee = parseFloat(document.getElementById('deliveryLocation').value || 1.5);
      const grandTotal = itemsSubtotal + deliveryFee;

      const orderData = {
        cart: checkoutItems,
        details: {
          customer: {
            name: document.getElementById('custName').value.trim(),
            phone: document.getElementById('custPhone').value.trim(),
            address: document.getElementById('custAddress').value.trim()
          },
          deliveryFee: deliveryFee,
          grandTotal: grandTotal,
          paymentMethod: 'ABA_KHQR'
        }
      };

      localStorage.setItem('pendingOrder', JSON.stringify(orderData));
      onOrderSuccess();
    }

    function onOrderSuccess() {
      if (localStorage.getItem('buyNowItem')) {
        localStorage.removeItem('buyNowItem');
      } else {
        localStorage.removeItem('cartData');
      }
      
      window.location.href = 'waiting-payment.html';
    }

    renderCheckoutSummary();
  </script>
</body>
</html>
