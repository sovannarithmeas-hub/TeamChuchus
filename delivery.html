<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ព័ត៌មានដឹកជញ្ជូន និងការទូទាត់ - តូបជជុស Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body { 
      font-family: 'Kantumruy Pro', sans-serif; 
      background-color: #f8fafc;
    }

    input, textarea, select {
      user-select: text;
      -webkit-user-select: text;
    }

    /* Glassmorphism Header */
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Modern Keyframe Animations */
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.2); }
      50% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
    }

    .animate-main-card {
      animation: slideUpFade 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .pulse-glow {
      animation: pulseGlow 2s infinite ease-in-out;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen p-3 sm:p-4 flex flex-col items-center justify-center text-slate-800">

  <!-- 🌟 Main Glass Container -->
  <div class="glass-card w-full max-w-md p-4 sm:p-5 rounded-3xl shadow-xl border border-slate-200/80 space-y-4 animate-main-card">
    
    <!-- 1️⃣ Header Section -->
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <div class="flex items-center gap-3">
        <button type="button" onclick="goBack()" 
                class="w-9 h-9 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl flex items-center justify-center transition-transform active:scale-90 border border-slate-200/60 shadow-xs">
          ⬅️
        </button>
        
        <div class="relative">
          <img src="https://gzclvhcvsfcslilxaiyg.supabase.co/storage/v1/object/public/product-images/photo_2026-08-10_18-23-16.jpg" 
               onerror="this.src='https://via.placeholder.com/50';" 
               class="w-10 h-10 rounded-2xl object-cover border-2 border-blue-500/30 shadow-xs">
        </div>

        <div>
          <h1 class="font-extrabold text-sm text-slate-900 leading-tight">🚚 ព័ត៌មានដឹកជញ្ជូន & ទូទាត់</h1>
          <p class="text-[10px] text-slate-500 font-medium mt-0.5">បំពេញព័ត៌មានដើម្បីបន្តទៅការបង់ប្រាក់</p>
        </div>
      </div>
    </div>

    <!-- 2️⃣ Selected Items Summary Card -->
    <div class="bg-gradient-to-br from-blue-50/80 to-indigo-50/50 border border-blue-100/90 p-3.5 rounded-2xl space-y-2 text-xs shadow-xs">
      <div class="flex justify-between items-center border-b border-blue-200/60 pb-1.5">
        <span class="font-bold text-blue-950 flex items-center gap-1.5">
          <span>📦</span> ទំនិញដែលបានជ្រើសរើស
        </span>
        <span id="itemsBadgeCount" class="bg-blue-600 text-white font-black text-[10px] px-2 py-0.5 rounded-full shadow-xs">
          0 មុខ
        </span>
      </div>
      <div id="selectedItems" class="space-y-1.5 pt-0.5 max-h-36 overflow-y-auto pr-1"></div>
    </div>

    <!-- 3️⃣ Form Section -->
    <form id="deliveryForm" onsubmit="submitOrder(event)" class="space-y-4 text-xs">
      
      <!-- Customer Information Block -->
      <div class="space-y-2.5">
        <p class="font-bold text-slate-900 text-xs flex items-center gap-1.5">
          <span class="p-1 bg-amber-100 text-amber-700 rounded-lg text-[11px]">📍</span> 
          <span>ព័ត៌មានអ្នកទទួល និងទីតាំង</span>
        </p>

        <!-- Customer Name -->
        <div>
          <label class="font-semibold block mb-1 text-slate-700 text-[11px]">👤 ឈ្មោះអតិថិជន <span class="text-rose-500">*</span></label>
          <input type="text" id="custName" required placeholder="ឧទាហរណ៍៖ សុខ ជា" 
                 class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200/90 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition shadow-inner placeholder:text-slate-400 font-medium">
        </div>

        <!-- Phone Number -->
        <div>
          <label class="font-semibold block mb-1 text-slate-700 text-[11px]">📞 លេខទូរស័ព្ទ <span class="text-rose-500">*</span></label>
          <input type="tel" id="custPhone" required placeholder="ឧទាហរណ៍៖ 012 345 678" 
                 class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200/90 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition shadow-inner placeholder:text-slate-400 font-medium">
        </div>

        <!-- Address -->
        <div>
          <label class="font-semibold block mb-1 text-slate-700 text-[11px]">📍 អាសយដ្ឋាន / ទីតាំងដឹកជញ្ជូន <span class="text-rose-500">*</span></label>
          <textarea id="custAddress" required rows="2" placeholder="ឧទាហរណ៍៖ ភ្នំពេញ, ផ្ទះលេខ..., ផ្លូវ..." 
                    class="w-full px-3 py-2 bg-slate-50 border border-slate-200/90 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition shadow-inner placeholder:text-slate-400 font-medium"></textarea>
        </div>

        <!-- Delivery Option -->
        <div>
          <label class="font-semibold block mb-1 text-slate-700 text-[11px]">🚚 ជ្រើសរើសតំបន់ដឹកជញ្ជូន</label>
          <div class="relative">
            <select id="deliveryLocation" onchange="calculateTotal()" 
                    class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200/90 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 font-semibold text-slate-800 transition shadow-inner appearance-none pr-8">
              <option value="1.5">ភ្នំពេញ (+$1.50)</option>
              <option value="2.5">តាមខេត្ត (+$2.50)</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
              ▼
            </div>
          </div>
        </div>
      </div>

      <!-- 4️⃣ Payment Method Selection -->
      <div class="pt-2 border-t border-slate-100 space-y-2">
        <p class="font-bold text-slate-900 text-xs flex items-center gap-1.5">
          <span class="p-1 bg-emerald-100 text-emerald-700 rounded-lg text-[11px]">💳</span> 
          <span>វិធីសាស្ត្រទូទាត់ប្រាក់</span>
        </p>

        <div class="grid grid-cols-1 gap-2">
          <label class="relative flex items-center justify-between p-3 bg-gradient-to-r from-blue-50/60 to-indigo-50/60 border-2 border-blue-500 rounded-2xl cursor-pointer shadow-xs transition-all active:scale-[0.99] pulse-glow">
            <div class="flex items-center gap-3">
              <input type="radio" name="paymentMethod" value="ABA_KHQR" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-slate-300">
              <div>
                <p class="font-extrabold text-slate-900">ABA KHQR (ទូទាត់ភ្លាមៗ)</p>
                <p class="text-[10px] text-slate-500 font-medium">ស្កែន ABA Mobile App ស្វ័យប្រវត្តិ</p>
              </div>
            </div>
            <span class="text-[10px] bg-rose-600 text-white font-black px-2 py-1 rounded-lg shadow-xs tracking-wider">
              ABA PAY
            </span>
          </label>
        </div>
      </div>

      <!-- 5️⃣ Pricing Summary Card -->
      <div class="border border-slate-200/80 bg-slate-50/90 p-3.5 rounded-2xl space-y-1.5 font-bold shadow-xs">
        <div class="flex justify-between text-slate-500 text-[11px]">
          <span>ថ្លៃទំនិញសរុប៖</span>
          <span id="itemsTotalText" class="text-slate-800 font-bold">$0.00</span>
        </div>
        <div class="flex justify-between text-slate-500 text-[11px]">
          <span>ថ្លៃដឹកជញ្ជូន៖</span>
          <span id="deliveryFeeText" class="text-slate-800 font-bold">$1.50</span>
        </div>
        <div class="flex justify-between items-center text-sm text-slate-900 pt-2 border-t border-slate-200/80">
          <span class="font-extrabold">សរុបត្រូវបង់៖</span>
          <span id="grandTotalText" class="text-xl text-blue-600 font-black tracking-tight">$0.00</span>
        </div>
      </div>

      <!-- 6️⃣ Action Buttons -->
      <div class="grid grid-cols-3 gap-2 pt-1">
        <button type="button" onclick="goBack()" 
                class="col-span-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-2xl text-center transition active:scale-95 border border-slate-200/60">
          ❌ បោះបង់
        </button>
        <button type="submit" 
                class="col-span-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-extrabold py-3 rounded-2xl shadow-lg shadow-blue-500/30 transition active:scale-95 flex items-center justify-center gap-1.5">
          <span>🚀</span> <span>បន្តទៅការបង់ប្រាក់</span>
        </button>
      </div>

    </form>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // 1️⃣ ទាញយកទិន្នន័យពី LocalStorage
    const buyNowItem = JSON.parse(localStorage.getItem('buyNowItem'));
    const cartItems = JSON.parse(localStorage.getItem('cartData')) || [];
    let checkoutItems = [];

    if (buyNowItem) {
      checkoutItems = [buyNowItem];
    } else {
      checkoutItems = cartItems;
    }

    // ប្រសិនបើគ្មានទំនិញ ត្រឡប់ទៅ index.html
    if (checkoutItems.length === 0) {
      window.location.href = 'index.html';
    }

    let itemsSubtotal = 0;

    // 2️⃣ Render បញ្ជីទំនិញ
    function renderCheckoutSummary() {
      const container = document.getElementById('selectedItems');
      document.getElementById('itemsBadgeCount').innerText = `${checkoutItems.length} មុខ`;
      itemsSubtotal = 0;

      container.innerHTML = checkoutItems.map((item, index) => {
        const price = parseFloat(item.price || 0);
        itemsSubtotal += price;

        const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
        const itemCode = codeMatch ? codeMatch[1] : (item.code || 'STOCK');

        return `
          <div class="flex justify-between items-center bg-white/80 p-2 rounded-xl border border-blue-100/80 shadow-2xs">
            <div class="flex items-center gap-1.5 truncate max-w-[70%]">
              <span class="font-extrabold bg-blue-100 text-blue-700 px-1.5 py-0.2 rounded-md text-[9px]">#${itemCode}</span>
              <span class="font-semibold text-slate-800 truncate">${item.title}</span>
            </div>
            <span class="font-black text-slate-900">$${price.toFixed(2)}</span>
          </div>
        `;
      }).join('');

      document.getElementById('itemsTotalText').innerText = `$${itemsSubtotal.toFixed(2)}`;
      calculateTotal();
    }

    // 3️⃣ គណនាប្រាក់សរុប
    function calculateTotal() {
      const deliveryFee = parseFloat(document.getElementById('deliveryLocation').value || 1.5);
      const grandTotal = itemsSubtotal + deliveryFee;

      document.getElementById('deliveryFeeText').innerText = `$${deliveryFee.toFixed(2)}`;
      document.getElementById('grandTotalText').innerText = `$${grandTotal.toFixed(2)}`;
    }

    // 4️⃣ ប៊ូតុង Back
    function goBack() {
      localStorage.removeItem('buyNowItem');
      window.location.href = 'index.html';
    }

    // 5️⃣ Submit Order
    function submitOrder(event) {
      event.preventDefault();

      const deliveryFee = parseFloat(document.getElementById('deliveryLocation').value || 1.5);
      const grandTotal = itemsSubtotal + deliveryFee;

      const orderData = {
        cart: checkoutItems,
        details: {
          customer: {
            name: document.getElementById('custName').value.trim(),
            phone: document.getElementById('custPhone').value.trim(),
            address: document.getElementById('custAddress').value.trim()
          },
          deliveryFee: deliveryFee,
          grandTotal: grandTotal,
          paymentMethod: 'ABA_KHQR'
        }
      };

      localStorage.setItem('pendingOrder', JSON.stringify(orderData));
      onOrderSuccess();
    }

    function onOrderSuccess() {
      if (localStorage.getItem('buyNowItem')) {
        localStorage.removeItem('buyNowItem');
      } else {
        localStorage.removeItem('cartData');
      }
      
      window.location.href = 'waiting-payment.html';
    }

    // Initialize Summary
    renderCheckoutSummary();
  </script>
</body>
</html>
