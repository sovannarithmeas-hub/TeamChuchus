<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ព័ត៌មានដឹកជញ្ជូន និងការទូទាត់ - តូបជជុស Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body { 
      font-family: 'Kantumruy Pro', sans-serif; 
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    }

    /* Glassmorphism Card Style */
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Input Focus Glow Animations */
    .custom-input {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .custom-input:focus {
      background-color: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
      transform: translateY(-1px);
    }

    /* Dynamic Pulse & Wave Animations */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    .animate-pulse-glow {
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-appear {
      animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen p-3 sm:p-4 flex flex-col items-center justify-center">

  <div class="glass-card w-full max-w-md p-5 rounded-3xl shadow-xl border border-white/80 space-y-4 animate-appear">
    
    <!-- 🚚 Header Page Section -->
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-3.5">
      <div class="flex items-center gap-3">
        <button type="button" onclick="goBack()" 
                class="w-9 h-9 bg-slate-100 hover:bg-slate-200/80 text-slate-700 rounded-2xl transition flex items-center justify-center active:scale-90 border border-slate-200/60 shadow-xs">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        
        <div class="relative">
          <img src="https://gzclvhcvsfcslilxaiyg.supabase.co/storage/v1/object/public/product-images/photo_2026-08-10_18-23-16.jpg" 
               onerror="this.src='https://via.placeholder.com/50';" 
               class="w-11 h-11 rounded-2xl object-cover border-2 border-blue-500/30 shadow-sm"
               oncontextmenu="return false;">
          <span class="absolute -bottom-1 -right-1 flex h-3.5 w-3.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500 border-2 border-white"></span>
          </span>
        </div>

        <div>
          <h1 class="font-extrabold text-sm text-slate-900 flex items-center gap-1.5">
            <span>🚚</span>
            <span>ព័ត៌មានដឹកជញ្ជូន និងទូទាត់</span>
          </h1>
          <p class="text-[10px] text-slate-500 font-medium mt-0.5">បំពេញព័ត៌មានដើម្បីបន្តទៅការបង់ប្រាក់</p>
        </div>
      </div>
    </div>

    <!-- 📦 Selected Items Summary Container -->
    <div class="bg-gradient-to-r from-blue-50/80 via-indigo-50/50 to-blue-50/80 border border-blue-100/80 p-3.5 rounded-2xl space-y-2 text-xs shadow-inner">
      <div class="flex items-center justify-between border-b border-blue-200/60 pb-1.5">
        <span class="font-bold text-blue-900 flex items-center gap-1.5 text-[11px]">
          <span class="p-1 bg-blue-500 text-white rounded-lg text-[10px]">📦</span> 
          <span>ទំនិញដែលបានជ្រើសរើស</span>
        </span>
        <span id="itemsBadgeCount" class="text-[10px] font-extrabold bg-blue-600 text-white px-2 py-0.5 rounded-full shadow-xs">
          0 មុខ
        </span>
      </div>
      <div id="selectedItems" class="space-y-1.5 pt-0.5 text-slate-700 max-h-36 overflow-y-auto pr-1"></div>
    </div>

    <!-- 📝 Delivery Form Section -->
    <form id="deliveryForm" onsubmit="submitOrder(event)" class="space-y-4 text-xs">
      
      <div class="space-y-3">
        <p class="font-bold text-slate-800 text-[13px] flex items-center gap-1.5 border-l-4 border-blue-600 pl-2">
          <span>📍</span> ព័ត៌មានអ្នកទទួល និងទីតាំង
        </p>

        <!-- Name Input -->
        <div class="space-y-1">
          <label class="font-semibold block text-slate-700 flex items-center gap-1">
            <span>👤</span> ឈ្មោះអតិថិជន <span class="text-rose-500">*</span>
          </label>
          <input type="text" id="custName" required placeholder="ឧទាហរណ៍៖ សុខ ជា" 
                 class="custom-input w-full p-3 bg-slate-50/80 border border-slate-200 rounded-2xl outline-none text-slate-800 font-medium placeholder:text-slate-400">
        </div>

        <!-- Phone Input -->
        <div class="space-y-1">
          <label class="font-semibold block text-slate-700 flex items-center gap-1">
            <span>📞</span> លេខទូរស័ព្ទ <span class="text-rose-500">*</span>
          </label>
          <input type="tel" id="custPhone" required placeholder="ឧទាហរណ៍៖ 012 345 678" 
                 class="custom-input w-full p-3 bg-slate-50/80 border border-slate-200 rounded-2xl outline-none text-slate-800 font-medium placeholder:text-slate-400">
        </div>

        <!-- Address Textarea -->
        <div class="space-y-1">
          <label class="font-semibold block text-slate-700 flex items-center gap-1">
            <span>📍</span> អាសយដ្ឋានដឹកជញ្ជូន / ទីតាំង <span class="text-rose-500">*</span>
          </label>
          <textarea id="custAddress" required rows="2" placeholder="ឧទាហរណ៍៖ ភ្នំពេញ, ផ្ទះលេខ..., ផ្លូវ..." 
                    class="custom-input w-full p-3 bg-slate-50/80 border border-slate-200 rounded-2xl outline-none text-slate-800 font-medium placeholder:text-slate-400 resize-none"></textarea>
        </div>

        <!-- Delivery Location Select -->
        <div class="space-y-1">
          <label class="font-semibold block text-slate-700 flex items-center gap-1">
            <span>🛵</span> តំបន់ដឹកជញ្ជូន
          </label>
          <div class="relative">
            <select id="deliveryLocation" onchange="calculateTotal()" 
                    class="custom-input w-full p-3 bg-slate-50/80 border border-slate-200 rounded-2xl outline-none font-semibold text-slate-800 appearance-none cursor-pointer pr-8">
              <option value="1.5">ភ្នំពេញ ($1.50)</option>
              <option value="2.5">តាមខេត្ត ($2.50)</option>
            </select>
            <span class="absolute right-3.5 top-3.5 pointer-events-none text-slate-400 text-xs">▼</span>
          </div>
        </div>
      </div>

      <!-- 💳 Payment Method Selection Card -->
      <div class="pt-2 border-t border-slate-200/80 space-y-2.5">
        <p class="font-bold text-slate-800 text-[13px] flex items-center gap-1.5 border-l-4 border-emerald-500 pl-2">
          <span>💳</span> ជ្រើសរើសវិធីសាស្ត្រទូទាត់ប្រាក់
        </p>

        <div class="grid grid-cols-1 gap-2">
          <label class="relative flex items-center justify-between p-3.5 border-2 border-blue-600 bg-gradient-to-r from-blue-50/60 to-indigo-50/40 rounded-2xl cursor-pointer shadow-xs transition-transform active:scale-[0.99]">
            <div class="flex items-center gap-3">
              <input type="radio" name="paymentMethod" value="ABA_KHQR" checked class="w-4 h-4 text-blue-600 accent-blue-600">
              <div>
                <p class="font-bold text-slate-900 text-xs flex items-center gap-1">
                  <span>ABA KHQR (ទូទាត់ភ្លាមៗ)</span>
                  <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                </p>
                <p class="text-[10px] text-slate-500 font-medium">ស្កែន ABA Mobile App ស្វ័យប្រវត្តិ</p>
              </div>
            </div>
            <span class="text-[10px] bg-rose-600 text-white font-extrabold px-2.5 py-1 rounded-lg shadow-xs tracking-wider">ABA</span>
          </label>
        </div>
      </div>

      <!-- 💰 Dynamic Pricing Summary Container -->
      <div class="border border-slate-200/80 pt-3 space-y-1.5 font-bold bg-slate-50/90 p-3.5 rounded-2xl shadow-inner">
        <div class="flex justify-between text-slate-500 text-xs">
          <span>ថ្លៃទំនិញសរុប៖</span>
          <span id="itemsTotalText" class="text-slate-800 font-extrabold">$0.00</span>
        </div>
        <div class="flex justify-between text-slate-500 text-xs">
          <span>ថ្លៃដឹកជញ្ជូន៖</span>
          <span id="deliveryFeeText" class="text-slate-800 font-extrabold">$1.50</span>
        </div>
        <div class="flex justify-between items-center text-sm text-blue-900 pt-2 border-t border-slate-200/80">
          <span class="font-extrabold">សរុបទឹកប្រាក់ត្រូវបង់៖</span>
          <span id="grandTotalText" class="text-xl text-blue-600 font-black tracking-tight">$0.00</span>
        </div>
      </div>

      <!-- 🚀 Action Buttons -->
      <div class="flex gap-2.5 pt-1">
        <button type="button" onclick="goBack()" 
                class="w-1/3 bg-slate-100 hover:bg-slate-200/80 text-slate-700 font-bold py-3.5 rounded-2xl text-xs transition active:scale-95 border border-slate-200/60 shadow-xs flex items-center justify-center gap-1">
          <span>❌</span> <span>បោះបង់</span>
        </button>
        <button type="submit" 
                class="w-2/3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 rounded-2xl text-xs shadow-lg shadow-blue-500/25 transition active:scale-95 flex items-center justify-center gap-1.5 animate-pulse-glow">
          <span>🚀</span> <span>បន្តទៅការបង់ប្រាក់</span>
        </button>
      </div>

    </form>
  </div>

  <!-- JAVASCRIPT LOGIC SECTION -->
  <script>
    // 1. Setup Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // 2. LocalStorage Checkout Items Retrieval
    const buyNowItem = JSON.parse(localStorage.getItem('buyNowItem'));
    const cartItems = JSON.parse(localStorage.getItem('cartData')) || [];
    let checkoutItems = [];

    if (buyNowItem) {
      checkoutItems = [buyNowItem];
    } else {
      checkoutItems = cartItems;
    }

    if (checkoutItems.length === 0) {
      window.location.href = 'index.html';
    }

    let itemsSubtotal = 0;

    // 3. Render Selected Checkout Items
    function renderCheckoutSummary() {
      const container = document.getElementById('selectedItems');
      const badge = document.getElementById('itemsBadgeCount');
      itemsSubtotal = 0;

      badge.innerText = `${checkoutItems.length} មុខ`;

      container.innerHTML = checkoutItems.map((item, index) => {
        const price = parseFloat(item.price || 0);
        itemsSubtotal += price;

        const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
        const itemCode = codeMatch ? codeMatch[1] : (item.code || 'N/A');

        return `
          <div class="flex justify-between items-center border-b border-blue-100/60 pb-1.5 last:border-none last:pb-0">
            <div class="flex items-center gap-2 truncate pr-2">
              <span class="font-black text-[10px] bg-blue-600 text-white px-1.5 py-0.5 rounded-md shrink-0 shadow-xs">#${itemCode}</span>
              <span class="font-bold text-slate-800 truncate">${item.title}</span>
            </div>
            <span class="font-black text-slate-900 shrink-0">$${price.toFixed(2)}</span>
          </div>
        `;
      }).join('');

      document.getElementById('itemsTotalText').innerText = `$${itemsSubtotal.toFixed(2)}`;
      calculateTotal();
    }

    // 4. Dynamic Grand Total Calculation
    function calculateTotal() {
      const deliveryFee = parseFloat(document.getElementById('deliveryLocation').value || 1.5);
      const grandTotal = itemsSubtotal + deliveryFee;

      document.getElementById('deliveryFeeText').innerText = `$${deliveryFee.toFixed(2)}`;
      document.getElementById('grandTotalText').innerText = `$${grandTotal.toFixed(2)}`;
    }

    // 5. Back Navigation
    function goBack() {
      localStorage.removeItem('buyNowItem');
      window.location.href = 'index.html';
    }

    // 6. Form Submission & Pending Order Handlers
    function submitOrder(event) {
      event.preventDefault();

      const deliveryFee = parseFloat(document.getElementById('deliveryLocation').value || 1.5);
      const grandTotal = itemsSubtotal + deliveryFee;

      const orderData = {
        cart: checkoutItems,
        details: {
          customer: {
            name: document.getElementById('custName').value.trim(),
            phone: document.getElementById('custPhone').value.trim(),
            address: document.getElementById('custAddress').value.trim()
          },
          deliveryFee: deliveryFee,
          grandTotal: grandTotal,
          paymentMethod: 'ABA_KHQR'
        }
      };

      localStorage.setItem('pendingOrder', JSON.stringify(orderData));
      onOrderSuccess();
    }

    function onOrderSuccess() {
      if (localStorage.getItem('buyNowItem')) {
        localStorage.removeItem('buyNowItem');
      } else {
        localStorage.removeItem('cartData');
      }
      
      window.location.href = 'waiting-payment.html';
    }

    // Initialize Page
    renderCheckoutSummary();
  </script>
</body>
</html>
