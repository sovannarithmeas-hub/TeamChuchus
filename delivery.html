<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>delivery.html - Dark Neon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Kantumruy Pro', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .neon-input { background: #1e293b; border: 1px solid #334155; color: white; transition: 0.3s; }
    .neon-input:focus { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.3); }
  </style>
</head>
<body class="min-h-screen p-3 flex justify-center items-center">

  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 p-5 rounded-3xl space-y-4 shadow-2xl">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <h1 class="font-extrabold text-sm text-cyan-400">🚚 ព័ត៌មានដឹកជញ្ជូន និងទូទាត់</h1>
      <button onclick="goBack()" class="p-2 bg-slate-800 text-slate-300 rounded-xl text-xs">⬅️</button>
    </div>

    <div id="selectedItems" class="bg-slate-800/60 border border-slate-700/50 p-3 rounded-2xl text-xs space-y-1"></div>

    <form onsubmit="submitOrder(event)" class="space-y-3 text-xs">
      <div>
        <label class="font-semibold text-slate-300 mb-1 block">👤 ឈ្មោះអតិថិជន *</label>
        <input type="text" id="custName" required placeholder="ឈ្មោះ..." class="neon-input w-full p-3 rounded-xl outline-none">
      </div>
      <div>
        <label class="font-semibold text-slate-300 mb-1 block">📞 លេខទូរស័ព្ទ *</label>
        <input type="tel" id="custPhone" required placeholder="លេខទូរស័ព្ទ..." class="neon-input w-full p-3 rounded-xl outline-none">
      </div>
      <div>
        <label class="font-semibold text-slate-300 mb-1 block">📍 អាសយដ្ឋាន *</label>
        <textarea id="custAddress" required rows="2" placeholder="អាសយដ្ឋាន..." class="neon-input w-full p-3 rounded-xl outline-none"></textarea>
      </div>
      <div>
        <label class="font-semibold text-slate-300 mb-1 block">🚚 តំបន់ដឹក</label>
        <select id="deliveryLocation" onchange="calculateTotal()" class="neon-input w-full p-3 rounded-xl font-bold outline-none">
          <option value="1.5">ភ្នំពេញ ($1.50)</option>
          <option value="2.5">តាមខេត្ត ($2.50)</option>
        </select>
      </div>

      <div class="bg-slate-800/80 p-3.5 rounded-2xl space-y-1.5 border border-slate-700 font-bold">
        <div class="flex justify-between text-slate-400"><span>ថ្លៃទំនិញ៖</span><span id="itemsTotalText">$0.00</span></div>
        <div class="flex justify-between text-slate-400"><span>ថ្លៃដឹក៖</span><span id="deliveryFeeText">$1.50</span></div>
        <div class="flex justify-between text-base text-cyan-400 pt-1 border-t border-slate-700"><span class="text-white">សរុបត្រូវបង់៖</span><span id="grandTotalText" class="font-black">$0.00</span></div>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-extrabold py-3.5 rounded-2xl shadow-lg shadow-cyan-500/20 active:scale-95 transition">
        🚀 បន្តទៅការបង់ប្រាក់
      </button>
    </form>
  </div>

  <script>
    const buyNowItem = JSON.parse(localStorage.getItem('buyNowItem'));
    const cartItems = JSON.parse(localStorage.getItem('cartData')) || [];
    let checkoutItems = buyNowItem ? [buyNowItem] : cartItems;
    if (checkoutItems.length === 0) window.location.href = 'index.html';

    let itemsSubtotal = 0;
    function renderCheckoutSummary() {
      const container = document.getElementById('selectedItems');
      itemsSubtotal = 0;
      container.innerHTML = checkoutItems.map((item, idx) => {
        const price = parseFloat(item.price || 0);
        itemsSubtotal += price;
        return `<div class="flex justify-between"><span>${idx+1}. ${item.title}</span><span class="font-bold">$${price.toFixed(2)}</span></div>`;
      }).join('');
      document.getElementById('itemsTotalText').innerText = `$${itemsSubtotal.toFixed(2)}`;
      calculateTotal();
    }
    function calculateTotal() {
      const fee = parseFloat(document.getElementById('deliveryLocation').value || 1.5);
      document.getElementById('deliveryFeeText').innerText = `$${fee.toFixed(2)}`;
      document.getElementById('grandTotalText').innerText = `$${(itemsSubtotal + fee).toFixed(2)}`;
    }
    function goBack() { localStorage.removeItem('buyNowItem'); window.location.href = 'index.html'; }
    function submitOrder(e) { e.preventDefault(); window.location.href = 'waiting-payment.html'; }
    renderCheckoutSummary();
  </script>
</body>
</html>
