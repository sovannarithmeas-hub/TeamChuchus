<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>delivery.html - Minimalist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Kantumruy Pro', sans-serif; background-color: #ffffff; } </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-center">

  <div class="w-full max-w-md space-y-5">
    <div class="flex items-center justify-between border-b-2 border-slate-900 pb-3">
      <h1 class="font-black text-base text-slate-900">🚚 ព័ត៌មានដឹកជញ្ជូន</h1>
      <button onclick="goBack()" class="text-xs font-bold bg-slate-100 px-3 py-1.5 rounded-lg">បកក្រោយ</button>
    </div>

    <div id="selectedItems" class="bg-slate-50 p-3 rounded-xl text-xs space-y-1 border"></div>

    <form onsubmit="submitOrder(event)" class="space-y-3.5 text-xs">
      <div>
        <label class="font-bold text-slate-900 block mb-1">ឈ្មោះអតិថិជន *</label>
        <input type="text" id="custName" required placeholder="បញ្ចូលឈ្មោះ..." class="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-slate-900 outline-none">
      </div>
      <div>
        <label class="font-bold text-slate-900 block mb-1">លេខទូរស័ព្ទ *</label>
        <input type="tel" id="custPhone" required placeholder="បញ្ចូលលេខទូរស័ព្ទ..." class="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-slate-900 outline-none">
      </div>
      <div>
        <label class="font-bold text-slate-900 block mb-1">អាសយដ្ឋាន *</label>
        <textarea id="custAddress" required rows="2" placeholder="បញ្ចូលអាសយដ្ឋាន..." class="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-slate-900 outline-none"></textarea>
      </div>
      <div>
        <label class="font-bold text-slate-900 block mb-1">តំបន់ដឹក</label>
        <select id="deliveryLocation" onchange="calculateTotal()" class="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl font-bold outline-none">
          <option value="1.5">ភ្នំពេញ ($1.50)</option>
          <option value="2.5">តាមខេត្ត ($2.50)</option>
        </select>
      </div>

      <div class="bg-slate-900 text-white p-4 rounded-2xl space-y-2">
        <div class="flex justify-between text-xs text-slate-300"><span>ថ្លៃទំនិញ៖</span><span id="itemsTotalText">$0.00</span></div>
        <div class="flex justify-between text-xs text-slate-300"><span>ថ្លៃដឹក៖</span><span id="deliveryFeeText">$1.50</span></div>
        <div class="flex justify-between text-sm font-extrabold border-t border-slate-700 pt-2"><span class="text-white">សរុបត្រូវបង់៖</span><span id="grandTotalText" class="text-blue-400">$0.00</span></div>
      </div>

      <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-xl text-xs transition">
        បន្តទៅការបង់ប្រាក់ ➔
      </button>
    </form>
  </div>

  <script>
    const buyNowItem = JSON.parse(localStorage.getItem('buyNowItem'));
    const cartItems = JSON.parse(localStorage.getItem('cartData')) || [];
    let checkoutItems = buyNowItem ? [buyNowItem] : cartItems;
    if (checkoutItems.length === 0) window.location.href = 'index.html';

    let itemsSubtotal = 0;
    function renderCheckoutSummary() {
      const container = document.getElementById('selectedItems');
      itemsSubtotal = 0;
      container.innerHTML = checkoutItems.map((item, idx) => {
        const price = parseFloat(item.price || 0);
        itemsSubtotal += price;
        return `<div class="flex justify-between"><span>${idx+1}. ${item.title}</span><span class="font-bold">$${price.toFixed(2)}</span></div>`;
      }).join('');
      document.getElementById('itemsTotalText').innerText = `$${itemsSubtotal.toFixed(2)}`;
      calculateTotal();
    }
    function calculateTotal() {
      const fee = parseFloat(document.getElementById('deliveryLocation').value || 1.5);
      document.getElementById('deliveryFeeText').innerText = `$${fee.toFixed(2)}`;
      document.getElementById('grandTotalText').innerText = `$${(itemsSubtotal + fee).toFixed(2)}`;
    }
    function goBack() { localStorage.removeItem('buyNowItem'); window.location.href = 'index.html'; }
    function submitOrder(e) { e.preventDefault(); window.location.href = 'waiting-payment.html'; }
    renderCheckoutSummary();
  </script>
</body>
</html>
