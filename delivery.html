<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>delivery.html - Glassmorphism</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kantumruy Pro', sans-serif; background: linear-gradient(135deg, #e0f2fe 0%, #f1f5f9 100%); }
    .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); }
    .custom-input { transition: all 0.25s ease; border: 1.5px solid #cbd5e1; }
    .custom-input:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15); }
    @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .animate-slide { animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="min-h-screen p-3 flex justify-center items-center">

  <div class="glass-card animate-slide w-full max-w-md p-5 rounded-3xl shadow-2xl border border-white/60 space-y-4">
    <!-- Header -->
    <div class="flex items-center gap-3 border-b pb-3">
      <button onclick="goBack()" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl transition active:scale-90">⬅️</button>
      <div>
        <h1 class="font-extrabold text-sm text-slate-900">🚚 ព័ត៌មានដឹកជញ្ជូន និងទូទាត់</h1>
        <p class="text-[10px] text-slate-500 font-medium">បំពេញព័ត៌មានដើម្បីបន្តទៅការបង់ប្រាក់</p>
      </div>
    </div>

    <!-- Order Items -->
    <div class="bg-blue-50/70 border border-blue-100 p-3.5 rounded-2xl text-xs space-y-1">
      <p class="font-extrabold text-blue-900 border-b border-blue-100 pb-1">📦 ទំនិញដែលបានជ្រើសរើស៖</p>
      <div id="selectedItems" class="text-slate-700 font-medium space-y-1 pt-1"></div>
    </div>

    <!-- Form -->
    <form id="deliveryForm" onsubmit="submitOrder(event)" class="space-y-3 text-xs">
      <div>
        <label class="font-bold text-slate-700 mb-1 block">👤 ឈ្មោះអតិថិជន *</label>
        <input type="text" id="custName" required placeholder="ឧទាហរណ៍៖ សុខ ជា" class="custom-input w-full p-3 bg-white/90 rounded-2xl outline-none font-medium">
      </div>

      <div>
        <label class="font-bold text-slate-700 mb-1 block">📞 លេខទូរស័ព្ទ *</label>
        <input type="tel" id="custPhone" required placeholder="ឧទាហរណ៍៖ 012 345 678" class="custom-input w-full p-3 bg-white/90 rounded-2xl outline-none font-medium">
      </div>

      <div>
        <label class="font-bold text-slate-700 mb-1 block">📍 អាសយដ្ឋានដឹកជញ្ជូន *</label>
        <textarea id="custAddress" required rows="2" placeholder="ឧទាហរណ៍៖ ភ្នំពេញ, ផ្ទះលេខ..." class="custom-input w-full p-3 bg-white/90 rounded-2xl outline-none font-medium"></textarea>
      </div>

      <div>
        <label class="font-bold text-slate-700 mb-1 block">🚚 តំបន់ដឹកជញ្ជូន</label>
        <select id="deliveryLocation" onchange="calculateTotal()" class="custom-input w-full p-3 bg-white/90 rounded-2xl font-bold text-slate-800 outline-none">
          <option value="1.5">ភ្នំពេញ ($1.50)</option>
          <option value="2.5">តាមខេត្ត ($2.50)</option>
        </select>
      </div>

      <!-- Payment -->
      <div class="pt-2 border-t space-y-2">
        <p class="font-bold text-slate-800">💳 វិធីសាស្ត្រទូទាត់ប្រាក់</p>
        <div class="p-3.5 border-2 border-blue-600 bg-blue-50/50 rounded-2xl flex justify-between items-center shadow-sm">
          <div class="flex items-center gap-2.5">
            <input type="radio" checked class="w-4 h-4 text-blue-600">
            <div>
              <p class="font-extrabold text-slate-900">ABA KHQR (ទូទាត់ភ្លាមៗ)</p>
              <p class="text-[10px] text-slate-500">ស្កែន ABA Mobile App ស្វ័យប្រវត្តិ</p>
            </div>
          </div>
          <span class="text-[10px] bg-rose-600 text-white font-black px-2 py-0.5 rounded-md">ABA</span>
        </div>
      </div>

      <!-- Pricing Summary -->
      <div class="bg-slate-50 p-3.5 rounded-2xl space-y-1.5 border font-bold">
        <div class="flex justify-between text-slate-500"><span>ថ្លៃទំនិញសរុប៖</span><span id="itemsTotalText">$0.00</span></div>
        <div class="flex justify-between text-slate-500"><span>ថ្លៃដឹកជញ្ជូន៖</span><span id="deliveryFeeText">$1.50</span></div>
        <div class="flex justify-between text-base text-blue-600 pt-1 border-t"><span class="text-slate-800">សរុបត្រូវបង់៖</span><span id="grandTotalText" class="font-black">$0.00</span></div>
      </div>

      <!-- Actions -->
      <div class="flex gap-2 pt-1">
        <button type="button" onclick="goBack()" class="w-1/3 bg-slate-100 hover:bg-slate-200 font-bold py-3.5 rounded-2xl text-slate-700">❌ បោះបង់</button>
        <button type="submit" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-2xl shadow-lg shadow-blue-500/30 active:scale-95 transition">🚀 បន្តទៅការបង់ប្រាក់</button>
      </div>
    </form>
  </div>

  <script>
    const buyNowItem = JSON.parse(localStorage.getItem('buyNowItem'));
    const cartItems = JSON.parse(localStorage.getItem('cartData')) || [];
    let checkoutItems = buyNowItem ? [buyNowItem] : cartItems;
    if (checkoutItems.length === 0) window.location.href = 'index.html';

    let itemsSubtotal = 0;
    function renderCheckoutSummary() {
      const container = document.getElementById('selectedItems');
      itemsSubtotal = 0;
      container.innerHTML = checkoutItems.map((item, idx) => {
        const price = parseFloat(item.price || 0);
        itemsSubtotal += price;
        return `<div class="flex justify-between"><span>${idx+1}. ${item.title}</span><span class="font-bold">$${price.toFixed(2)}</span></div>`;
      }).join('');
      document.getElementById('itemsTotalText').innerText = `$${itemsSubtotal.toFixed(2)}`;
      calculateTotal();
    }
    function calculateTotal() {
      const fee = parseFloat(document.getElementById('deliveryLocation').value || 1.5);
      document.getElementById('deliveryFeeText').innerText = `$${fee.toFixed(2)}`;
      document.getElementById('grandTotalText').innerText = `$${(itemsSubtotal + fee).toFixed(2)}`;
    }
    function goBack() { localStorage.removeItem('buyNowItem'); window.location.href = 'index.html'; }
    function submitOrder(e) { e.preventDefault(); window.location.href = 'waiting-payment.html'; }
    renderCheckoutSummary();
  </script>
</body>
</html>
