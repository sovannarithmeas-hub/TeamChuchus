<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ព័ត៌មានដឹកជញ្ជូន និងការទូទាត់ - តូបជជុស Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Kantumruy Pro', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen p-3 flex flex-col items-center justify-center">

  <div class="bg-white w-full max-w-md p-5 rounded-2xl shadow-sm border space-y-4">
    
    <div class="flex items-center justify-between border-b pb-3">
      <div class="flex items-center gap-2">
        <a href="index.html" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-xl text-gray-600 transition flex items-center justify-center">
          ⬅️
        </a>
        <img src="https://gzclvhcvsfcslilxaiyg.supabase.co/storage/v1/object/public/product-images/photo_2026-08-10_18-23-16.jpg" 
             onerror="this.src='https://via.placeholder.com/50';" class="w-10 h-10 rounded-full border">
        <div>
          <h1 class="font-bold text-sm">🚚 ព័ត៌មានដឹកជញ្ជូន និងទូទាត់</h1>
          <p class="text-[10px] text-gray-500">បំពេញព័ត៌មានដើម្បីបន្តទៅការបង់ប្រាក់</p>
        </div>
      </div>
    </div>

    <div class="bg-blue-50/50 border border-blue-100 p-3 rounded-xl space-y-1 text-xs">
      <p class="font-bold text-blue-900 border-b border-blue-100 pb-1">📦 ទំនិញដែលបានជ្រើសរើស៖</p>
      <div id="selectedItems" class="space-y-1 pt-1 text-gray-700"></div>
    </div>

    <form id="deliveryForm" onsubmit="submitOrder(event)" class="space-y-3.5 text-xs">
      
      <div class="space-y-2">
        <p class="font-bold text-gray-800 text-[13px] flex items-center gap-1">
          <span>📍</span> ព័ត៌មានអ្នកទទួល និងទីតាំង
        </p>

        <div>
          <label class="font-semibold block mb-1 text-gray-700">👤 ឈ្មោះអតិថិជន *</label>
          <input type="text" id="custName" required placeholder="ឧទាហរណ៍៖ សុខ ជា" 
                 class="w-full p-2.5 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>

        <div>
          <label class="font-semibold block mb-1 text-gray-700">📞 លេខទូរស័ព្ទ *</label>
          <input type="tel" id="custPhone" required placeholder="ឧទាហរណ៍៖ 012 345 678" 
                 class="w-full p-2.5 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>

        <div>
          <label class="font-semibold block mb-1 text-gray-700">📍 អាសយដ្ឋានដឹកជញ្ជូន / ទីតាំង *</label>
          <textarea id="custAddress" required rows="2" placeholder="ឧទាហរណ៍៖ ភ្នំពេញ, ផ្ទះលេខ..., ផ្លូវ..." 
                    class="w-full p-2.5 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition"></textarea>
        </div>

        <div>
          <label class="font-semibold block mb-1 text-gray-700">🚚 តំបន់ដឹកជញ្ជូន</label>
          <select id="deliveryLocation" onchange="calculateTotal()" 
                  class="w-full p-2.5 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-medium">
            <option value="1.5">ភ្នំពេញ ($1.50)</option>
            <option value="2.5">តាមខេត្ត ($2.50)</option>
          </select>
        </div>
      </div>

      <div class="pt-2 border-t space-y-2">
        <p class="font-bold text-gray-800 text-[13px] flex items-center gap-1">
          <span>💳</span> ជ្រើសរើសវិធីសាស្ត្រទូទាត់ប្រាក់
        </p>

        <div class="grid grid-cols-1 gap-2">
          <label class="flex items-center justify-between p-3 border-2 border-blue-600 bg-blue-50/30 rounded-xl cursor-pointer">
            <div class="flex items-center gap-2.5">
              <input type="radio" name="paymentMethod" value="ABA_KHQR" checked class="w-4 h-4 text-blue-600">
              <div>
                <p class="font-bold text-gray-800">ABA KHQR (ទូទាត់ភ្លាមៗ)</p>
                <p class="text-[10px] text-gray-500">ស្កែន ABA Mobile App ស្វ័យប្រវត្តិ</p>
              </div>
            </div>
            <span class="text-xs bg-red-600 text-white font-bold px-2 py-0.5 rounded">ABA</span>
          </label>
        </div>
      </div>

      <div class="border-t pt-3 space-y-1 font-bold bg-gray-50 p-3 rounded-xl">
        <div class="flex justify-between text-gray-600">
          <span>ថ្លៃទំនិញសរុប៖</span>
          <span id="itemsTotalText">$0.00</span>
        </div>
        <div class="flex justify-between text-gray-600">
          <span>ថ្លៃដឹកជញ្ជូន៖</span>
          <span id="deliveryFeeText">$1.50</span>
        </div>
        <div class="flex justify-between text-base text-blue-600 pt-1 border-t border-gray-200">
          <span>សរុបទឹកប្រាក់ត្រូវបង់៖</span>
          <span id="grandTotalText" class="text-lg text-blue-700 font-extrabold">$0.00</span>
        </div>
      </div>

      <div class="flex gap-2 pt-1">
        <a href="index.html" class="w-1/3 bg-gray-100 hover:bg-gray-200 text-
