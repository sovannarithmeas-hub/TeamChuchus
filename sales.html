<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - របាយការណ៍លក់ & ចំណេញ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
  <div class="max-w-2xl mx-auto">
    
    <div class="flex justify-between items-center mb-5 bg-white p-2 rounded-xl shadow-sm border border-gray-200">
      <a href="index.html" class="flex-1 py-1.5 text-center text-gray-600 hover:text-gray-800 rounded-lg font-medium text-xs transition">
        ➕ បញ្ចូលស្តុក
      </a>
      <a href="stock.html" class="flex-1 py-1.5 text-center text-gray-600 hover:text-gray-800 rounded-lg font-medium text-xs transition">
        📦 មើលស្តុក
      </a>
      <a href="sales.html" class="flex-1 py-1.5 text-center bg-blue-600 text-white rounded-lg font-bold text-xs shadow-sm">
        📈 របាយការណ៍
      </a>
    </div>

    <div class="mb-4">
      <h1 class="text-xl font-bold text-gray-800">📈 របាយការណ៍លក់ & ចំណេញ</h1>
      <p class="text-xs text-gray-500">តូបជជុស Online Summary</p>
    </div>

    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-white p-3.5 rounded-xl shadow-sm border border-gray-200 text-center">
        <p class="text-xs text-gray-500 font-medium">🛍️ លក់បានសរុប</p>
        <h2 id="totalItems" class="text-xl font-bold text-gray-800 mt-1">0 ខោ</h2>
      </div>
      <div class="bg-white p-3.5 rounded-xl shadow-sm border border-blue-200 text-center">
        <p class="text-xs text-gray-500 font-medium">💵 ចំណូលសរុប</p>
        <h2 id="totalRevenue" class="text-xl font-bold text-blue-600 mt-1">$0.00</h2>
      </div>
      <div class="bg-white p-3.5 rounded-xl shadow-sm border border-green-200 text-center bg-green-50/30">
        <p class="text-xs text-gray-600 font-medium">📈 ប្រាក់ចំណេញសរុប</p>
        <h2 id="totalProfit" class="text-xl font-bold text-green-600 mt-1">$0.00</h2>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-3.5 border-b bg-gray-50 flex justify-between items-center">
        <h3 class="font-bold text-gray-700 text-sm">📜 ប្រវត្តិទំនិញដែលលក់ដាច់</h3>
        <span class="text-xs text-gray-500" id="recordCount">0 មុខ</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-gray-600">
          <thead class="bg-gray-100 text-gray-700 uppercase font-semibold border-b">
            <tr>
              <th class="p-3">រូបភាព/ម៉ូដ</th>
              <th class="p-3">លេខកូដ</th>
              <th class="p-3">ថ្លៃដើម (Cost)</th>
              <th class="p-3">ថ្លៃលក់ (Price)</th>
              <th class="p-3">ចំណេញ (Profit)</th>
            </tr>
          </thead>
          <tbody id="salesTableBody" class="divide-y divide-gray-100">
            <tr>
              <td colspan="5" class="text-center py-6 text-gray-400">⏳ កំពុងគណនាទិន្នន័យ...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gzclvhcvsfcslilxaiyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VVZOPQCUQFRDSlOgXhUI5g_kri2S-Ww'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadSalesReport() {
      const tableBody = document.getElementById('salesTableBody');
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        const soldProducts = (data || []).filter(p => 
          p.stock_quantity === 0 || (p.description && p.description.includes('[SOLD OUT]'))
        );

        let totalRevenue = 0;
        let totalCost = 0;

        if (soldProducts.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-400">📭 មិនទាន់មានទិន្នន័យលក់ដាច់នៅឡើយទេ</td></tr>`;
          document.getElementById('totalItems').innerText = '0 ខោ';
          document.getElementById('totalRevenue').innerText = '$0.00';
          document.getElementById('totalProfit').innerText = '$0.00';
          document.getElementById('recordCount').innerText = '0 មុខ';
          return;
        }

        tableBody.innerHTML = soldProducts.map(item => {
          const firstImg = (item.images && item.images.length > 0) ? item.images[0] : 'https://via.placeholder.com/50';
          const price = parseFloat(item.price || 0);
          const cost = parseFloat(item.cost_price || 0);
          const profit = price - cost;

          totalRevenue += price;
          totalCost += cost;

          let code = 'N/A';
          if (item.description) {
            const match = item.description.match(/\[Code:\s*([^\]]+)\]/i);
            if (match) code = match[1];
          }

          return `
            <tr class="hover:bg-gray-50">
              <td class="p-3 flex items-center gap-2">
                <img src="${firstImg}" class="w-10 h-10 object-cover rounded border">
                <span class="font-bold text-gray-800">${item.title || 'ខោជជុស'}</span>
              </td>
              <td class="p-3 font-semibold text-blue-600">#${code}</td>
              <td class="p-3 text-gray-500">$${cost.toFixed(2)}</td>
              <td class="p-3 font-semibold text-gray-800">$${price.toFixed(2)}</td>
              <td class="p-3 font-bold ${profit >= 0 ? 'text-green-600' : 'text-red-500'}">
                +$${profit.toFixed(2)}
              </td>
            </tr>
          `;
        }).join('');

        const totalProfit = totalRevenue - totalCost;

        document.getElementById('totalItems').innerText = `${soldProducts.length} ខោ`;
        document.getElementById('totalRevenue').innerText = `$${totalRevenue.toFixed(2)}`;
        document.getElementById('totalProfit').innerText = `$${totalProfit.toFixed(2)}`;
        document.getElementById('recordCount').innerText = `${soldProducts.length} មុខ`;

      } catch (err) {
        console.error(err);
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-red-500">❌ មានបញ្ហាទាញទិន្នន័យ៖ ${err.message}</td></tr>`;
      }
    }

    loadSalesReport();
  </script>
</body>
</html>
