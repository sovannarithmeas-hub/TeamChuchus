<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - ទំព័រដើម</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Kantumruy Pro', sans-serif !important; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col">

  <header class="sticky top-0 z-30 bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-md mx-auto p-3">
      
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-3">
          
          <div class="w-12 h-12 rounded-full border-2 border-blue-500 overflow-hidden shadow-sm flex-shrink-0 bg-white flex items-center justify-center">
            <img src="https://gzclvhcvsfcslilxaiyg.supabase.co/storage/v1/object/public/product-images/photo_2026-08-10_18-23-16.jpg" 
                 onerror="this.style.display='none'" 
                 alt="តូបជជុស ONLINE Logo" 
                 class="w-full h-full object-cover rounded-full">
          </div>

          <div>
            <h1 class="text-base font-bold text-gray-900 leading-tight">តូបជជុស Online</h1>
            <p class="text-[11px] text-gray-500">ជ្រើសរើសខោជជុសគុណភាពខ្ពស់ ស្អាតៗ និងមានក្នុងស្តុកស្រាប់</p>
          </div>
        </div>

        <button onclick="openCartModal()" class="relative p-2 bg-blue-50 hover:bg-blue-100 rounded-xl transition text-blue-600">
          <span class="text-xl">🛒</span>
          <span id="cartBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
        </button>
      </div>

      <div class="relative">
        <input type="text" id="searchInput" oninput="filterProducts()" placeholder="🔍 ស្វែងរកតាមលេខកូដ (ឧ. J-001) ឬប្រភេទខោ..." class="w-full pl-3 pr-8 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition">
      </div>

    </div>
  </header>

  <main class="flex-1 max-w-md mx-auto w-full p-3 space-y-3">
    
    <div class="flex justify-between items-center px-1">
      <span class="text-xs font-bold text-gray-700 flex items-center gap-1">
        📦 ខោដែលមានក្នុងស្តុក
      </span>
      <span id="stockCount" class="text-[11px] bg-blue-100 text-blue-700 font-bold px-2.5 py-0.5 rounded-full">
        0 មុខ
      </span>
    </div>

    <div id="productList" class="space-y-3">
      <div class="text-center py-10 text-xs text-gray-400">
        ⏳ កំពុងទាញទិន្នន័យទំនិញ...
      </div>
    </div>

  </main>

  <div id="productModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm transition-opacity">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[85vh] overflow-y-auto p-4 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="modalCode" class="text-sm font-bold text-blue-600"></h3>
        <button onclick="closeProductModal()" class="text-gray-400 hover:text-gray-600 text-lg font-bold px-2">✕</button>
      </div>
      
      <div class="aspect-square bg-gray-100 rounded-xl overflow-hidden border">
        <img id="modalImage" src="" alt="Product Image" class="w-full h-full object-cover">
      </div>

      <div>
        <div class="flex justify-between items-start mb-1">
          <h2 id="modalTitle" class="text-base font-bold text-gray-800"></h2>
          <span id="modalPrice" class="text-base font-extrabold text-blue-600"></span>
        </div>
        <div id="modalSize" class="text-xs text-gray-500 mb-2"></div>
        <div id="modalDetails" class="text-xs bg-gray-50 p-2.5 rounded-xl border border-gray-100 space-y-1 text-gray-700 leading-relaxed font-mono whitespace-pre-line"></div>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-2 border-t">
        <button id="modalAddToCartBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1">
          🛒 បញ្ចូលកន្ត្រក់
        </button>
        <button id="modalBuyNowBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1">
          ⚡ ទិញឥឡូវនេះ
        </button>
      </div>
    </div>
  </div>

  <div id="cartModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[80vh] flex flex-col p-4">
      <div class="flex justify-between items-center border-b pb-2 mb-2">
        <h3 class="text-sm font-bold text-gray-800 flex items-center gap-1">🛒 កន្ត្រក់ទំនិញរបស់អ្នក</h3>
        <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600 text-lg font-bold px-2">✕</button>
      </div>

      <div id="cartItemsList" class="flex-1 overflow-y-auto space-y-2 py-2">
        </div>

      <div class="border-t pt-3 mt-2 space-y-2">
        <div class="flex justify-between items-center text-xs font-bold text-gray-800">
          <span>សរុប៖</span>
          <span id="cartTotalPrice" class="text-sm text-blue-600">$0.00</span>
        </div>
        <button onclick="checkoutCartTelegram()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
          💬 ផ្ញើការកុម្ម៉ង់ទាំងអស់ទៅ Telegram
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gzclvhcvsfcslilxaiyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VVZOPQCUQFRDSlOgXhUI5g_kri2S-Ww'; 
    const TELEGRAM_USERNAME = 'Torp_jojus_online'; // Telegram Admin Username

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];
    let cart = [];

    // ទាញទិន្នន័យពី Supabase ពេលបើក Page
    async function fetchProducts() {
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .eq('stock_quantity', 1) // យកតែខោដែលមានក្នុងស្តុក
          .order('created_at', { ascending: false });

        if (error) throw error;

        allProducts = data || [];
        renderProducts(allProducts);
      } catch (err) {
        document.getElementById('productList').innerHTML = `<div class="text-center py-5 text-xs text-red-500">❌ បរាជ័យទាញទិន្នន័យ៖ ${err.message}</div>`;
      }
    }

    // បង្ហាញបញ្ជីខោ
    function renderProducts(products) {
      const listEl = document.getElementById('productList');
      document.getElementById('stockCount').innerText = `${products.length} មុខ`;

      if (products.length === 0) {
        listEl.innerHTML = `<div class="text-center py-10 text-xs text-gray-400">មិនមានខោក្នុងស្តុកទេ</div>`;
        return;
      }

      listEl.innerHTML = products.map(p => {
        const imgUrl = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/300';
        
        // ស្រង់ Code ពី Description
        const codeMatch = p.description ? p.description.match(/\[Code:\s*([^\]]+)\]/) : null;
        const codeText = codeMatch ? codeMatch[1] : (p.code || 'N/A');

        return `
          <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-200/80 hover:shadow-md transition flex flex-col justify-between">
            
            <div onclick="openProductModal('${p.id}')" class="cursor-pointer space-y-2">
              <div class="relative aspect-[4/3] bg-gray-100 rounded-xl overflow-hidden border border-gray-100">
                <img src="${imgUrl}" alt="${p.title}" class="w-full h-full object-cover">
                <span class="absolute top-2 left-2 bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-md shadow-sm">
                  #${codeText}
                </span>
              </div>

              <div>
                <div class="flex justify-between items-start">
                  <h3 class="font-bold text-gray-800 text-sm hover:text-blue-600 transition">${p.title}</h3>
                  <span class="font-extrabold text-blue-600 text-sm">$${parseFloat(p.price).toFixed(2)}</span>
                </div>
                <p class="text-[11px] text-gray-500 line-clamp-2 mt-0.5">${p.description || ''}</p>
                <div class="mt-1">
                  <span class="inline-block bg-gray-100 text-gray-600 text-[10px] font-medium px-2 py-0.5 rounded border">
                    Size: ${p.sizes ? p.sizes.join(', ') : 'N/A'}
                  </span>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-3 pt-2 border-t border-gray-100">
              <button onclick="addToCart('${p.id}')" class="w-full bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold py-1.5 rounded-xl text-[11px] border border-amber-200 transition flex items-center justify-center gap-1">
                🛒 ចូលកន្ត្រក់
              </button>
              <button onclick="buyNowDirect('#${codeText}', '${p.title}', '${p.price}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded-xl text-[11px] shadow-sm transition flex items-center justify-center gap-1">
                ⚡ ទិញឥឡូវនេះ
              </button>
            </div>

          </div>
        `;
      }).join('');
    }

    // Search Filter
    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = allProducts.filter(p => 
        p.title.toLowerCase().includes(query) || 
        (p.description && p.description.toLowerCase().includes(query))
      );
      renderProducts(filtered);
    }

    // 🔍 OPEN PRODUCT DETAIL MODAL
    function openProductModal(productId) {
      const product = allProducts.find(p => p.id == productId);
      if (!product) return;

      const codeMatch = product.description ? product.description.match(/\[Code:\s*([^\]]+)\]/) : null;
      const codeText = codeMatch ? codeMatch[1] : (product.code || 'N/A');

      document.getElementById('modalCode').innerText = `#${codeText}`;
      document.getElementById('modalTitle').innerText = product.title;
      document.getElementById('modalPrice').innerText = `$${parseFloat(product.price).toFixed(2)}`;
      document.getElementById('modalSize').innerText = `Size: ${product.sizes ? product.sizes.join(', ') : 'N/A'}`;
      document.getElementById('modalDetails').innerText = product.description || 'គ្មានព័ត៌មានបន្ថែម';
      document.getElementById('modalImage').src = (product.images && product.images.length > 0) ? product.images[0] : 'https://via.placeholder.com/300';

      document.getElementById('modalAddToCartBtn').onclick = () => { addToCart(product.id); closeProductModal(); };
      document.getElementById('modalBuyNowBtn').onclick = () => { buyNowDirect(`#${codeText}`, product.title, product.price); };

      document.getElementById('productModal').classList.remove('hidden');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.add('hidden');
    }

    // 🛒 CART FUNCTIONS
    function addToCart(productId) {
      const product = allProducts.find(p => p.id == productId);
      if (!product) return;

      if (!cart.some(item => item.id == productId)) {
        cart.push(product);
        updateCartUI();
        alert('✅ បានបន្ថែមចូលក្នុងកន្ត្រក់!');
      } else {
        alert('⚠️ ខោមួយនេះមាននៅក្នុងកន្ត្រក់រួចហើយ!');
      }
    }

    function updateCartUI() {
      const badge = document.getElementById('cartBadge');
      if (cart.length > 0) {
        badge.innerText = cart.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function openCartModal() {
      const container = document.getElementById('cartItemsList');
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-xs text-gray-400">គ្មានទំនិញក្នុងកន្ត្រក់ទេ</div>`;
      } else {
        container.innerHTML = cart.map((item, index) => {
          total += parseFloat(item.price);
          const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
          const codeText = codeMatch ? codeMatch[1] : 'N/A';

          return `
            <div class="flex justify-between items-center p-2 bg-gray-50 rounded-xl border text-xs">
              <div>
                <span class="font-bold text-blue-600">#${codeText}</span> - ${item.title}
                <div class="text-[10px] text-gray-500">$${parseFloat(item.price).toFixed(2)}</div>
              </div>
              <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 font-bold px-2">🗑️</button>
            </div>
          `;
        }).join('');
      }

      document.getElementById('cartTotalPrice').innerText = `$${total.toFixed(2)}`;
      document.getElementById('cartModal').classList.remove('hidden');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
      openCartModal();
    }

    function closeCartModal() {
      document.getElementById('cartModal').classList.add('hidden');
    }

    // ⚡ DIRECT BUY VIA TELEGRAM
    function buyNowDirect(code, title, price) {
      const msg = `ជម្រាបសួរ តូបជជុស Online! ខ្ញុំចង់កុម្ម៉ង់ទិញខោ៖\n\n🏷️ លេខកូដ៖ ${code}\n👖 ម៉ូដ៖ ${title}\n💵 តម្លៃ៖ $${parseFloat(price).toFixed(2)}`;
      window.open(`https://t.me/${TELEGRAM_USERNAME}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // 💬 CHECKOUT ENTIRE CART TO TELEGRAM
    function checkoutCartTelegram() {
      if (cart.length === 0) return;

      let msg = `ជម្រាបសួរ តូបជជុស Online! ខ្ញុំចង់កុម្ម៉ង់ទិញខោចំនួន (${cart.length} មុខ)៖\n\n`;
      let total = 0;

      cart.forEach((item, idx) => {
        const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
        const codeText = codeMatch ? codeMatch[1] : 'N/A';
        total += parseFloat(item.price);
        msg += `${idx + 1}. #${codeText} - ${item.title} ($${parseFloat(item.price).toFixed(2)})\n`;
      });

      msg += `\n💰 <b>សរុបទាំងអស់៖ $${total.toFixed(2)}</b>`;
      window.open(`https://t.me/${TELEGRAM_USERNAME}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // Load ទិន្នន័យដំបូង
    fetchProducts();
  </script>
</body>
</html>
