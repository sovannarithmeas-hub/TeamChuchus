<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - Admin Stock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6">
    <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">👖 បញ្ចូលស្តុកខោអាវ (Fast Mode)</h2>
    
    <form id="stockForm" class="space-y-3">
      <div>
        <label class="block text-sm font-medium text-gray-700">លេខកូដខោ (Code)</label>
        <input type="text" id="code" required class="mt-1 w-full p-2 border rounded-md uppercase font-bold" placeholder="ឧ. J-001">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">ប្រភេទ/ម៉ូដខោ</label>
        <input type="text" id="title" required class="mt-1 w-full p-2 border rounded-md" placeholder="ឧ. ខោជើងវែង/ជើងកណ្តឹង">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">តម្លៃ ($)</label>
        <input type="number" step="0.01" id="price" required class="mt-1 w-full p-2 border rounded-md" placeholder="15.50">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Size (ទំហំ)</label>
        <div class="flex gap-3 mt-1 flex-wrap">
          <label><input type="checkbox" name="sizes" value="S"> S</label>
          <label><input type="checkbox" name="sizes" value="M"> M</label>
          <label><input type="checkbox" name="sizes" value="L"> L</label>
          <label><input type="checkbox" name="sizes" value="XL"> XL</label>
          <label><input type="checkbox" name="sizes" value="Free Size"> Free Size</label>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 bg-blue-50 p-3 rounded-lg border border-blue-200">
        <div>
          <label class="block text-xs font-semibold text-blue-800">ចង្កេះ (W)</label>
          <input type="text" id="waist" class="mt-1 w-full p-1.5 border rounded-md bg-white" placeholder="ឧ. 32">
        </div>
        <div>
          <label class="block text-xs font-semibold text-blue-800">ប្រវែង (L)</label>
          <input type="text" id="length" class="mt-1 w-full p-1.5 border rounded-md bg-white" placeholder="ឧ. 106">
        </div>
        <div>
          <label class="block text-xs font-semibold text-blue-800">ជុងជើង</label>
          <input type="text" id="leg" class="mt-1 w-full p-1.5 border rounded-md bg-white" placeholder="ឧ. 17">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">ចំណាំបន្ថែម (ជម្រើស)</label>
        <input type="text" id="description" class="mt-1 w-full p-2 border rounded-md" placeholder="ឧ. សាច់ទន់ ស្អាត 99%">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">រូបថត (ជ្រើសរើសបានច្រើន)</label>
        <input type="file" id="images" multiple accept="image/*" class="mt-1 w-full p-2 border rounded-md">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700">
        📤 រក្សាទុក & បញ្ចូលស្តុក
      </button>
    </form>
    <div id="status" class="mt-4 text-center font-medium"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gzclvhcvsfcslilxaiyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VVZOPQCUQFRDSlOgXhUI5g_kri2S-Ww'; 
    
    const TELEGRAM_BOT_TOKEN = '8994221143:AAFtNb2tA7eqIzmbonP58qhdvgcxyODwZWA'; 
    const TELEGRAM_CHAT_ID = '@tobchuchusonline';       
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function sendToTelegramChannel(code, title, price, sizes, waist, length, leg, note, imageUrls) {
      if (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN === 'YOUR_TELEGRAM_BOT_TOKEN_HERE') return;

      try {
        let detailText = '';
        if (waist) detailText += `• ចង្កេះ (Waist)៖ <b>${waist}</b>\n`;
        if (length) detailText += `• ប្រវែង (Length)៖ <b>${length}</b>\n`;
        if (leg) detailText += `• ជុងជើង៖ <b>${leg}</b>\n`;
        if (note) detailText += `• ចំណាំ៖ ${note}\n`;
        if (!detailText) detailText = '• សាច់ស្អាត គុណភាពល្អ ជ្រើសរើសរួច ១០០%\n';

        const captionText = `✨ <b>[ ផលិតផលថ្មីចូលស្តុក ]</b> ✨\n\n` +
                            `🏷️ លេខកូដទំនិញ៖ <b>#${code.toUpperCase()}</b>\n` +
                            `👖 ប្រភេទម៉ូដ៖ <b>${title}</b>\n` +
                            `💵 តម្លៃ៖ <b>$${price.toFixed(2)}</b>\n` +
                            `📏 Size / ទំហំ៖ <b>${sizes.join(', ') || 'Free Size'}</b>\n\n` +
                            `📝 <b>ព័ត៌មានទំហំ & លម្អិត៖</b>\n` +
                            `${detailText}\n` +
                            `──────────────────\n` +
                            `🛍️ <b>កម្ម៉ង់ទិញឆាតមក Admin៖</b> @YourAdminUsername\n` +
                            `🚚 <b>សេវាកម្មដឹកជញ្ជូន៖</b> ២៥ ខេត្ត/ក្រុង`;

        if (imageUrls.length === 1) {
          await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, photo: imageUrls[0], caption: captionText, parse_mode: 'HTML' })
          });
        } else if (imageUrls.length > 1) {
          const media = imageUrls.map((url, index) => ({
            type: 'photo', media: url, caption: index === 0 ? captionText : '', parse_mode: 'HTML'
          }));
          await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMediaGroup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, media: media })
          });
        }
      } catch (tgErr) {
        console.error('Telegram Post Error:', tgErr);
      }
    }

    document.getElementById('stockForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');
      
      statusDiv.className = 'mt-4 text-center font-medium text-blue-600';
      statusDiv.innerText = '⏳ កំពុងដំណើរការ...';
      submitBtn.disabled = true;

      try {
        const code = document.getElementById('code').value.trim();
        const title = document.getElementById('title').value;
        const price = parseFloat(document.getElementById('price').value);
        const waist = document.getElementById('waist').value.trim();
        const length = document.getElementById('length').value.trim();
        const leg = document.getElementById('leg').value.trim();
        const note = document.getElementById('description').value.trim();
        
        const sizeNodes = document.querySelectorAll('input[name="sizes"]:checked');
        const sizes = Array.from(sizeNodes).map(node => node.value);
        const imageFiles = document.getElementById('images').files;

        if (imageFiles.length === 0) {
          alert('សូមជ្រើសរើសរូបថតយ៉ាងហោចណាស់ ១ សន្លឹក!');
          submitBtn.disabled = false;
          statusDiv.innerText = '';
          return;
        }

        statusDiv.innerText = '⏳ កំពុង Upload រូបភាព...';
        const imageUrls = [];

        for (let i = 0; i < imageFiles.length; i++) {
          const rawFile = imageFiles[i];
          const ext = rawFile.name.split('.').pop().toLowerCase() || 'jpg';
          const fileName = `${Date.now()}_${i}.${ext}`;

          const blobData = new Blob([await rawFile.arrayBuffer()], { type: rawFile.type || 'image/jpeg' });

          const { error: uploadError } = await supabaseClient.storage
            .from('product-images')
            .upload(fileName, blobData, {
              contentType: rawFile.type || 'image/jpeg',
              cacheControl: '3600',
              upsert: true
            });

          if (uploadError) throw new Error('Upload រូបភាពមិនបាន៖ ' + uploadError.message);

          const { data: publicUrlData } = supabaseClient.storage
            .from('product-images')
            .getPublicUrl(fileName);

          imageUrls.push(publicUrlData.publicUrl);
        }

        statusDiv.innerText = '⏳ កំពុងរក្សាទុកទិន្នន័យស្តុក...';

        // 💡 រក្សាទុកកូដបញ្ចូលក្នុង description តែម្តង ដើម្បីការពារ Error Column
        const fullDescription = `[Code: ${code.toUpperCase()}] W:${waist} L:${length} Leg:${leg} ${note}`;

        const { error: dbError } = await supabaseClient
          .from('products')
          .insert([{
            title: title,
            price: price,
            sizes: sizes,
            description: fullDescription,
            images: imageUrls,
            stock_quantity: 1
          }]);

        if (dbError) throw dbError;

        statusDiv.innerText = '⏳ កំពុង Post ទៅ Telegram...';
        await sendToTelegramChannel(code, title, price, sizes, waist, length, leg, note, imageUrls);

        statusDiv.className = 'mt-4 text-center font-medium text-green-600';
        statusDiv.innerText = '✅ បញ្ចូលស្តុក និង Post រួចរាល់!';
        document.getElementById('stockForm').reset();
      } catch (err) {
        console.error(err);
        statusDiv.className = 'mt-4 text-center font-medium text-red-600';
        statusDiv.innerText = '❌ ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
