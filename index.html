<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>តូបជជុស Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Kantumruy Pro', sans-serif; 
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none; /* បិទ Menu ពេល Long Press លើរូប */
    }

    /* បិទការជ្រើសរើស ឬ Save រូបភាព */
    img {
      -webkit-user-drag: none;
      user-select: none;
      -moz-user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      pointer-events: auto;
    }

    /* Modern Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* Custom Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.35s ease-out forwards;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(37, 99, 235, 0.2); }
      50% { box-shadow: 0 0 25px rgba(37, 99, 235, 0.4); }
    }
    .glow-effect { animation: pulseGlow 3s infinite; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12 select-none">

  <!-- Header Section with Glassmorphism -->
  <header class="sticky top-0 bg-white/85 backdrop-blur-md z-40 border-b border-slate-200/80 shadow-sm transition-all">
    <div class="max-w-md mx-auto p-3 space-y-2.5">
      
      <!-- Top Branding Bar -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="relative">
            <img src="https://gzclvhcvsfcslilxaiyg.supabase.co/storage/v1/object/public/product-images/photo_2026-08-10_18-23-16.jpg" 
                 onerror="this.src='https://via.placeholder.com/40';" 
                 class="w-10 h-10 rounded-2xl object-cover border-2 border-blue-500/20 shadow-sm"
                 oncontextmenu="return false;">
            <span class="absolute -bottom-1 -right-1 flex h-3.5 w-3.5">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500 border-2 border-white"></span>
            </span>
          </div>
          <div>
            <h1 class="font-bold text-sm text-slate-800 tracking-tight leading-none">តូបជជុស Online</h1>
            <p class="text-[10px] text-slate-500 font-medium mt-0.5">ខោជជុសរើសគុណភាពខ្ពស់ 👖</p>
          </div>
        </div>

        <!-- Header Cart Button -->
        <button onclick="openCartModal()" 
                class="relative p-2.5 bg-slate-100 hover:bg-blue-50 text-slate-700 hover:text-blue-600 rounded-2xl border border-slate-200/60 active:scale-95 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
          <span id="cartCountBadge" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white font-extrabold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow-sm hidden">
            0
          </span>
        </button>
      </div>

      <!-- Search Input -->
      <div class="relative">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="🔍 ស្វែងរកតាមកូដ (#J01) ឬឈ្មោះ..." 
               class="w-full pl-9 pr-4 py-2.5 text-xs bg-slate-100/90 border border-slate-200/80 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-all placeholder:text-slate-400">
        <span class="absolute left-3 top-3 text-slate-400 text-xs">🔎</span>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-3 space-y-3">
    
    <!-- Controls Header: Total Items & Switch View Layout Buttons -->
    <div class="flex justify-between items-center bg-white p-2.5 rounded-2xl border border-slate-200/70 shadow-sm">
      <div class="flex items-center gap-1.5">
        <span class="text-xs">📦</span>
        <span class="text-xs font-bold text-slate-700">ស្តុកទំនិញ</span>
        <span id="totalItemsCount" class="text-[10px] font-extrabold bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full border border-blue-100">
          0 មុខ
        </span>
      </div>

      <!-- Switch Layout View Control (1 Column, 2 Columns, 3 Columns) -->
      <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200/50">
        <!-- 1 Column Button -->
        <button id="viewBtn1" onclick="changeGridView(1)" 
                title="1 Column" class="p-1.5 rounded-lg text-slate-500 transition-all active:scale-95">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M3 5a2 2 0 012-2h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5z"/>
          </svg>
        </button>
        <!-- 2 Columns Button (Default) -->
        <button id="viewBtn2" onclick="changeGridView(2)" 
                title="2 Columns" class="p-1.5 rounded-lg bg-white text-blue-600 shadow-sm font-bold transition-all active:scale-95">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M3 5a2 2 0 012-2h6a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5zm10 0a2 2 0 012-2h4a2 2 0 012 2v14a2 2 0 01-2 2h-4a2 2 0 01-2-2V5z"/>
          </svg>
        </button>
        <!-- 3 Columns Button -->
        <button id="viewBtn3" onclick="changeGridView(3)" 
                title="3 Columns" class="p-1.5 rounded-lg text-slate-500 transition-all active:scale-95">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M2 5a2 2 0 012-2h4a2 2 0 012 2v14a2 2 0 01-2 2H4a2 2 0 01-2-2V5zm7 0a2 2 0 012-2h4a2 2 0 012 2v14a2 2 0 01-2 2h-4a2 2 0 01-2-2V5zm7 0a2 2 0 012-2h4a2 2 0 012 2v14a2 2 0 01-2 2h-4a2 2 0 01-2-2V5z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Dynamic Product Grid -->
    <div id="productGrid" class="grid grid-cols-2 gap-2.5 transition-all"></div>

  </main>

  <!-- 🖼️ Image Viewer / Album Modal (មើលរូបការពារ Download) -->
  <div id="imageViewerModal" class="fixed inset-0 bg-black/90 hidden flex-col items-center justify-between p-4 z-50 backdrop-blur-md" onclick="closeImageViewer()">
    <!-- Top Modal Header -->
    <div class="w-full max-w-md flex justify-between items-center text-white z-10 pt-2" onclick="event.stopPropagation()">
      <div class="flex items-center gap-2">
        <span id="albumCodeTag" class="bg-blue-600 text-white font-bold text-xs px-2.5 py-1 rounded-lg">#CODE</span>
        <span id="albumCounter" class="text-xs text-slate-300">1/1</span>
      </div>
      <button onclick="closeImageViewer()" class="w-8 h-8 rounded-full bg-white/20 text-white flex items-center justify-center font-bold hover:bg-white/30 transition">✕</button>
    </div>

    <!-- Main Image Display Container -->
    <div class="relative w-full max-w-md flex-1 flex items-center justify-center my-auto overflow-hidden" onclick="event.stopPropagation()">
      <img id="viewerImage" src="" 
           class="max-h-[72vh] w-auto max-w-full object-contain rounded-2xl shadow-2xl transition-all duration-300 select-none"
           oncontextmenu="return false;" 
           ondragstart="return false;">

      <!-- Prev / Next Navigation Arrows -->
      <button id="prevImgBtn" onclick="navigateImage(-1)" class="absolute left-1 bg-black/50 hover:bg-black/70 text-white p-2.5 rounded-full border border-white/20 backdrop-blur-sm transition">
        ❮
      </button>
      <button id="nextImgBtn" onclick="navigateImage(1)" class="absolute right-1 bg-black/50 hover:bg-black/70 text-white p-2.5 rounded-full border border-white/20 backdrop-blur-sm transition">
        ❯
      </button>
    </div>

    <!-- Bottom Thumbnail Strip -->
    <div class="w-full max-w-md flex justify-center gap-1.5 overflow-x-auto py-2 z-10" id="thumbnailContainer" onclick="event.stopPropagation()"></div>
  </div>

  <!-- 🛒 Modal កន្ត្រកទំនិញ (Cart Modal Popup) -->
  <div id="cartModal" class="fixed inset-0 bg-black/60 hidden items-end sm:items-center justify-center p-0 sm:p-4 z-50 backdrop-blur-sm" onclick="closeCartModal()">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-4 space-y-3 shadow-2xl max-h-[85vh] flex flex-col animate-fade-in" onclick="event.stopPropagation()">
      
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-sm text-slate-800 flex items-center gap-2">
          <span class="p-1.5 bg-blue-50 text-blue-600 rounded-xl text-xs">🛒</span> 
          <span>កន្ត្រកទំនិញរបស់អ្នក</span>
        </h3>
        <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-600 font-bold bg-slate-100 w-8 h-8 rounded-full flex items-center justify-center text-xs">✕</button>
      </div>

      <div id="cartModalItems" class="overflow-y-auto flex-1 space-y-2 pr-1 min-h-[120px]"></div>

      <div class="border-t pt-3 space-y-3">
        <div class="flex justify-between items-center font-bold text-sm">
          <span class="text-slate-600">សរុបទឹកប្រាក់៖</span>
          <span id="cartModalTotal" class="text-blue-600 font-extrabold text-lg">$0.00</span>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="clearCart()" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold py-3 rounded-2xl text-xs transition active:scale-95">
            🗑️ សម្អាតកន្ត្រក
          </button>
          <button onclick="goToCheckout()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-2xl text-xs shadow-lg shadow-blue-500/30 transition active:scale-95">
            🚀 ទៅបង់ប្រាក់
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md text-white text-xs px-4 py-2.5 rounded-2xl shadow-xl border border-slate-700 hidden z-50 transition-all">
    ✅ បានបន្ថែមទំនិញចូលកន្ត្រក!
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // 1. Setup Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    localStorage.removeItem('buyNowItem');

    // 2. Supabase Configuration
    const SUPABASE_URL = "https://gzclvhcvsfcslilxaiyg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6Y2x2aGN2c2Zjc2xpbHhhaXlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjUyMjAsImV4cCI6MjEwMTYwMTIyMH0.8gD4bwPpxdLl9kGtPVCRRPylEsES_DHWH4KhKDJvzuE";

    let productsList = [];
    let currentLayoutColumns = 2; // Default Grid layout = 2 Columns

    async function loadProducts() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        productsList = await response.json();
        renderProducts(productsList);
      } catch (err) {
        console.error("Error loading products:", err);
      }
    }

    // 3. Switch Grid View (1, 2, 3 Columns)
    function changeGridView(cols) {
      currentLayoutColumns = cols;
      const grid = document.getElementById('productGrid');
      
      // Reset buttons state
      [1, 2, 3].forEach(c => {
        const btn = document.getElementById(`viewBtn${c}`);
        if (c === cols) {
          btn.className = "p-1.5 rounded-lg bg-white text-blue-600 shadow-sm font-bold transition-all active:scale-95";
        } else {
          btn.className = "p-1.5 rounded-lg text-slate-500 transition-all active:scale-95";
        }
      });

      // Change CSS Grid Columns
      if (cols === 1) {
        grid.className = "grid grid-cols-1 gap-3 transition-all";
      } else if (cols === 2) {
        grid.className = "grid grid-cols-2 gap-2.5 transition-all";
      } else if (cols === 3) {
        grid.className = "grid grid-cols-3 gap-1.5 transition-all";
      }

      renderProducts(productsList);
    }

    // 4. Render Product Cards dynamically
    function renderProducts(items) {
      const container = document.getElementById('productGrid');
      document.getElementById('totalItemsCount').innerText = `${items.length} មុខ`;

      if (items.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center text-xs text-slate-400 py-12">ពុំមានទំនិញក្នុងស្តុកទេ</p>`;
        return;
      }

      const isCompact3Cols = currentLayoutColumns === 3;
      const isLarge1Col = currentLayoutColumns === 1;

      container.innerHTML = items.map((item, index) => {
        const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
        const itemCode = codeMatch ? codeMatch[1] : (item.code || item.title || 'STOCK');
        const imageList = item.images && item.images.length > 0 ? item.images : [item.image_url || 'https://via.placeholder.com/300'];

        return `
          <div class="bg-white rounded-2xl p-2 sm:p-2.5 border border-slate-200/70 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group animate-fade-in" style="animation-delay: ${index * 0.03}s">
            
            <div class="space-y-1.5">
              <!-- Product Image Box (Click to View Album Modal - Cannot Download) -->
              <div onclick="openAlbumModal('${item.id}')" 
                   class="relative rounded-xl overflow-hidden bg-slate-100 aspect-square cursor-pointer group-hover:opacity-95 transition-opacity">
                <img src="${imageList[0]}" 
                     class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                     oncontextmenu="return false;" 
                     ondragstart="return false;">
                
                <!-- Code Badge -->
                <span class="absolute top-1.5 left-1.5 bg-blue-600/90 backdrop-blur-md text-white font-extrabold text-[9px] ${isCompact3Cols ? 'px-1.5 py-0.2' : 'px-2 py-0.5'} rounded-md shadow-sm">
                  #${itemCode}
                </span>

                <!-- Album Images Count Indicator -->
                ${imageList.length > 1 ? `
                  <span class="absolute bottom-1.5 right-1.5 bg-black/60 backdrop-blur-md text-white text-[9px] font-medium px-1.5 py-0.5 rounded-md flex items-center gap-1">
                    📷 ${imageList.length}
                  </span>
                ` : ''}
              </div>

              <!-- Product Details -->
              <div class="pt-0.5">
                <h2 class="font-bold text-slate-800 ${isCompact3Cols ? 'text-[10px] truncate' : isLarge1Col ? 'text-sm' : 'text-xs truncate'}">${item.title}</h2>
                ${!isCompact3Cols && item.description ? `<p class="text-[10px] text-slate-500 line-clamp-1">${item.description}</p>` : ''}
              </div>
            </div>

            <!-- Price and Actions -->
            <div class="pt-1 space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="font-extrabold text-blue-600 ${isCompact3Cols ? 'text-xs' : 'text-sm'}">$${parseFloat(item.price || 0).toFixed(2)}</span>
              </div>

              <!-- Action Buttons -->
              <div class="grid ${isCompact3Cols ? 'grid-cols-1' : 'grid-cols-2'} gap-1">
                <button onclick="addToCart('${item.id}', true)" 
                        class="bg-amber-50 hover:bg-amber-100 active:bg-amber-200 text-amber-700 font-bold ${isCompact3Cols ? 'py-1 text-[9px]' : 'py-2 text-[11px]'} rounded-xl flex items-center justify-center gap-0.5 transition active:scale-95">
                  🛒 <span>កន្ត្រក</span>
                </button>
                
                <button onclick="buyNow('${item.id}')" 
                        class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold ${isCompact3Cols ? 'py-1 text-[9px]' : 'py-2 text-[11px]'} rounded-xl flex items-center justify-center gap-0.5 shadow-sm transition active:scale-95">
                  ⚡ <span>ទិញ</span>
                </button>
              </div>
            </div>

          </div>
        `;
      }).join('');

      updateCartBadge();
    }

    // 5. Album Image Viewer (Lightbox Protection)
    let currentAlbumImages = [];
    let currentImageIndex = 0;

    function openAlbumModal(productId) {
      const product = productsList.find(p => String(p.id) === String(productId));
      if (!product) return;

      currentAlbumImages = product.images && product.images.length > 0 ? product.images : [product.image_url || 'https://via.placeholder.com/400'];
      currentImageIndex = 0;

      const codeMatch = product.description ? product.description.match(/\[Code:\s*([^\]]+)\]/) : null;
      const itemCode = codeMatch ? codeMatch[1] : (product.code || 'ITEM');

      document.getElementById('albumCodeTag').innerText = `#${itemCode}`;
      updateImageViewer();

      const modal = document.getElementById('imageViewerModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function updateImageViewer() {
      const imgElem = document.getElementById('viewerImage');
      imgElem.src = currentAlbumImages[currentImageIndex];

      document.getElementById('albumCounter').innerText = `${currentImageIndex + 1} / ${currentAlbumImages.length}`;

      // Show/Hide Prev/Next Buttons
      document.getElementById('prevImgBtn').style.display = currentAlbumImages.length > 1 ? 'block' : 'none';
      document.getElementById('nextImgBtn').style.display = currentAlbumImages.length > 1 ? 'block' : 'none';

      // Render Thumbnails
      const thumbContainer = document.getElementById('thumbnailContainer');
      if (currentAlbumImages.length > 1) {
        thumbContainer.innerHTML = currentAlbumImages.map((img, idx) => `
          <img src="${img}" 
               onclick="selectViewerImage(${idx})" 
               class="w-10 h-10 object-cover rounded-lg cursor-pointer border-2 transition-all ${idx === currentImageIndex ? 'border-blue-500 scale-105' : 'border-transparent opacity-60'}"
               oncontextmenu="return false;">
        `).join('');
      } else {
        thumbContainer.innerHTML = '';
      }
    }

    function navigateImage(direction) {
      currentImageIndex += direction;
      if (currentImageIndex < 0) currentImageIndex = currentAlbumImages.length - 1;
      if (currentImageIndex >= currentAlbumImages.length) currentImageIndex = 0;
      updateImageViewer();
    }

    function selectViewerImage(index) {
      currentImageIndex = index;
      updateImageViewer();
    }

    function closeImageViewer() {
      const modal = document.getElementById('imageViewerModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 6. Toast Notification Handler
    function showToast(message) {
      const toast = document.getElementById('toastNotification');
      toast.innerText = message;
      toast.classList.remove('hidden');
      setTimeout(() => { toast.classList.add('hidden'); }, 2000);
    }

    // 7. Cart Operations
    function getCart() {
      return JSON.parse(localStorage.getItem('cartData')) || [];
    }

    function saveCart(cart) {
      localStorage.setItem('cartData', JSON.stringify(cart));
      updateCartBadge();
    }

    function updateCartBadge() {
      const cart = getCart();
      const badge = document.getElementById('cartCountBadge');
      if (cart.length > 0) {
        badge.innerText = cart.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function addToCart(productId, showNotification = true) {
      const product = productsList.find(p => String(p.id) === String(productId));
      if (!product) return;

      let cart = getCart();
      cart.push(product);
      saveCart(cart);

      if (showNotification) {
        showToast('✅ បានបន្ថែមខោចូលកន្ត្រកហើយ!');
      }
    }

    function buyNow(productId) {
      const product = productsList.find(p => String(p.id) === String(productId));
      if (!product) return;

      localStorage.setItem('buyNowItem', JSON.stringify(product));
      window.location.href = 'delivery.html';
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = productsList.filter(p => {
        const title = (p.title || '').toLowerCase();
        const desc = (p.description || '').toLowerCase();
        const code = (p.code || '').toLowerCase();
        return title.includes(query) || desc.includes(query) || code.includes(query);
      });
      renderProducts(filtered);
    }

    // 8. Modal Cart Controls
    function openCartModal() {
      renderCartModalItems();
      const modal = document.getElementById('cartModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeCartModal() {
      const modal = document.getElementById('cartModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function renderCartModalItems() {
      const cart = getCart();
      const container = document.getElementById('cartModalItems');
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 space-y-1">
            <p class="text-3xl">🛒</p>
            <p class="text-xs">គ្មានទំនិញក្នុងកន្ត្រក់ទេ</p>
          </div>
        `;
        document.getElementById('cartModalTotal').innerText = '$0.00';
        return;
      }

      container.innerHTML = cart.map((item, index) => {
        const price = parseFloat(item.price || 0);
        total += price;
        const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
        const itemCode = codeMatch ? codeMatch[1] : (item.code || 'N/A');

        return `
          <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-2xl border border-slate-200/60 text-xs">
            <div class="flex items-center gap-2">
              <span class="font-extrabold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-lg text-[10px]">#${itemCode}</span>
              <span class="font-semibold text-slate-800 truncate max-w-[150px]">${item.title}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-slate-700">$${price.toFixed(2)}</span>
              <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 font-bold p-1">✕</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cartModalTotal').innerText = `$${total.toFixed(2)}`;
    }

    function removeFromCart(index) {
      let cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
      renderCartModalItems();
    }

    function clearCart() {
      localStorage.removeItem('cartData');
      updateCartBadge();
      renderCartModalItems();
      showToast('🗑️ បានសម្អាតកន្ត្រករួចរាល់');
    }

    function goToCheckout() {
      const cart = getCart();
      if (cart.length === 0) {
        showToast('⚠️ សូមជ្រើសរើសទំនិញយ៉ាងហោចណាស់ ១!');
        return;
      }
      localStorage.removeItem('buyNowItem');
      window.location.href = 'delivery.html';
    }

    // Load items on page ready
    loadProducts();
  </script>
</body>
</html>
