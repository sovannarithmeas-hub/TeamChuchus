<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111827" />
    <title>ហាងខោអាវជជុស</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="loading" class="loading-container">
        <div class="loading-spinner"></div>
        <p>កំពុង​ផ្ទុក...</p>
    </div>

    <div id="app" style="display:none;">
        <header class="header">
            <button id="backBtn" class="back-btn" style="display:none;" aria-label="ត្រឡប់">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 id="pageTitle">ហាងខោអាវជជុស</h1>
            <div class="header-actions">
                <button id="cartBtn" class="cart-btn" aria-label="កន្ត្រក">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cartCount" class="cart-badge">0</span>
                </button>
                <button id="adminBtn" class="admin-btn" aria-label="អ្នកគ្រប់គ្រង" style="display:none;">
                    <i class="fas fa-user-shield"></i>
                </button>
            </div>
        </header>
        <div id="pageContainer" class="page-container"></div>
    </div>

    <script>
      // Set this to the real public KHQR image URL when the shop QR is available.
      window.CHUCHUS_KHQR_IMAGE_URL = '';
    </script>
    <script type="importmap">
      {"imports":{"@supabase/supabase-js":"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"}}
    </script>
    <script type="module" src="app.js"></script>
    <script type="module" src="checkout-rpc.js"></script>
    <script src="ui-fixes.js"></script>
</body>
</html>
