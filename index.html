<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>តូបជជុស Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body { 
      font-family: 'Kantumruy Pro', sans-serif; 
      background-color: #f8fafc;
      -webkit-touch-callout: none;
    }

    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      pointer-events: auto;
    }

    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-card {
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes softPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    .pulse-cute { animation: softPulse 2.5s infinite ease-in-out; }

    .slider-track {
      display: flex;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    /* Modal Controls */
    #imageViewerModal {
      display: none;
    }
    #imageViewerModal.flex {
      display: flex;
    }
    #cartModal {
      display: none;
    }
    #cartModal.flex {
      display: flex;
    }
    #toastNotification {
      display: none;
    }
    #toastNotification.show {
      display: block;
    }
  </style>
</head>
<body class="min-h-screen pb-14 text-slate-800">

  <!-- Header -->
  <header class="sticky top-0 z-40 glass-header border-b border-slate-200/80 shadow-xs transition-all">
    <div class="max-w-md mx-auto p-3 space-y-2.5">
      
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="relative">
            <img src="https://gzclvhcvsfcslilxaiyg.supabase.co/storage/v1/object/public/product-images/photo_2026-08-10_18-23-16.jpg" 
                 onerror="this.src='https://via.placeholder.com/40';" 
                 class="w-10 h-10 rounded-2xl object-cover border-2 border-blue-500/30 shadow-md transition-transform hover:scale-105"
                 oncontextmenu="return false;">
            <span class="absolute -bottom-0.5 -right-0.5 flex h-3.5 w-3.5">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500 border-2 border-white"></span>
            </span>
          </div>
          <div>
            <div class="flex items-center gap-1">
              <h1 class="font-extrabold text-sm text-slate-900 tracking-tight leading-none">តូបជជុស Online</h1>
              <span class="text-[10px] px-1.5 py-0.2 bg-blue-100 text-blue-700 rounded-md font-bold">PRO</span>
            </div>
            <p class="text-[10px] text-slate-500 font-medium mt-0.5">ខោជជុសរើសគុណភាពខ្ពស់ 👖✨</p>
          </div>
        </div>

        <button onclick="openCartModal()" 
                class="relative p-2.5 bg-slate-100/80 hover:bg-blue-50 text-slate-700 hover:text-blue-600 rounded-2xl border border-slate-200/70 active:scale-90 transition-all shadow-xs">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
          <span id="cartCountBadge" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white font-black text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow-md hidden">
            0
          </span>
        </button>
      </div>

      <div class="relative">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="🔍 ស្វែងរកតាមកូដ (#J01) ឬឈ្មោះខោ..." 
               class="w-full pl-9 pr-8 py-2.5 text-xs bg-slate-100/90 border border-slate-200/80 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all shadow-inner placeholder:text-slate-400">
        <span class="absolute right-3 top-2.5 text-slate-300 text-xs hover:text-slate-500 cursor-pointer" onclick="clearSearch()">✕</span>
      </div>

    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto p-3 space-y-3">
    
    <div class="flex justify-between items-center bg-white p-2.5 rounded-2xl border border-slate-200/80 shadow-xs">
      <div class="flex items-center gap-1.5">
        <span class="text-xs pulse-cute">✨</span>
        <span class="text-xs font-bold text-slate-700">ស្តុកទំនិញ</span>
        <span id="totalItemsCount" class="text-[10px] font-extrabold bg-blue-50 text-blue-600 px-2.5 py-0.5 rounded-full border border-blue-100/80">0 មុខ</span>
      </div>

      <div class="flex items-center gap-1 bg-slate-100/90 p-1 rounded-2xl border border-slate-200/60 shadow-inner">
        <button id="viewBtn1" onclick="changeGridView(1)" title="1 Column View"
                class="p-1.5 rounded-xl text-slate-400 hover:text-slate-600 transition-all active:scale-90 flex items-center justify-center">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="3" />
          </svg>
        </button>
        <button id="viewBtn2" onclick="changeGridView(2)" title="2 Columns View"
                class="p-1.5 rounded-xl bg-white text-blue-600 shadow-sm font-bold transition-all active:scale-90 flex items-center justify-center">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <rect x="3" y="4" width="8.5" height="16" rx="2" />
            <rect x="12.5" y="4" width="8.5" height="16" rx="2" />
          </svg>
        </button>
        <button id="viewBtn3" onclick="changeGridView(3)" title="3 Columns View"
                class="p-1.5 rounded-xl text-slate-400 hover:text-slate-600 transition-all active:scale-90 flex items-center justify-center">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <rect x="2" y="4" width="5.5" height="16" rx="1.5" />
            <rect x="9.25" y="4" width="5.5" height="16" rx="1.5" />
            <rect x="16.5" y="4" width="5.5" height="16" rx="1.5" />
          </svg>
        </button>
      </div>
    </div>

    <div id="productGrid" class="grid grid-cols-2 gap-2.5 transition-all">
      <div class="bg-white rounded-2xl p-2.5 border border-slate-200/60 animate-pulse space-y-2">
        <div class="bg-slate-200 aspect-square rounded-xl"></div>
        <div class="h-3 bg-slate-200 rounded w-3/4"></div>
        <div class="h-3 bg-slate-200 rounded w-1/2"></div>
      </div>
      <div class="bg-white rounded-2xl p-2.5 border border-slate-200/60 animate-pulse space-y-2">
        <div class="bg-slate-200 aspect-square rounded-xl"></div>
        <div class="h-3 bg-slate-200 rounded w-3/4"></div>
        <div class="h-3 bg-slate-200 rounded w-1/2"></div>
      </div>
    </div>

  </main>

  <!-- Image Viewer Modal -->
  <div id="imageViewerModal" class="fixed inset-0 bg-black/95 flex-col justify-between p-3 z-50 backdrop-blur-lg select-none" onclick="closeImageViewer()">
    <div class="w-full max-w-md mx-auto flex justify-between items-center text-white z-20 pt-2 px-2" onclick="event.stopPropagation()">
      <div class="flex items-center gap-2">
        <span id="albumCodeTag" class="bg-blue-600/90 text-white font-extrabold text-xs px-3 py-1 rounded-xl shadow-md border border-blue-400/30">#CODE</span>
        <span id="albumCounter" class="text-xs text-slate-300 font-medium bg-white/10 px-2 py-0.5 rounded-lg backdrop-blur-md">1/1</span>
      </div>
      <button onclick="closeImageViewer()" class="w-9 h-9 rounded-full bg-white/20 text-white flex items-center justify-center font-bold hover:bg-white/30 active:scale-90 transition">✕</button>
    </div>
    <div class="relative w-full max-w-md mx-auto flex-1 flex items-center overflow-hidden my-auto" id="sliderViewport" onclick="event.stopPropagation()">
      <div id="sliderTrack" class="slider-track w-full h-full items-center"></div>
      <button id="prevImgBtn" onclick="navigateImage(-1)" class="absolute left-2 bg-black/40 hover:bg-black/70 text-white p-3 rounded-full border border-white/20 backdrop-blur-md transition hidden sm:block">❮</button>
      <button id="nextImgBtn" onclick="navigateImage(1)" class="absolute right-2 bg-black/40 hover:bg-black/70 text-white p-3 rounded-full border border-white/20 backdrop-blur-md transition hidden sm:block">❯</button>
    </div>
    <div class="w-full max-w-md mx-auto flex justify-center gap-2 overflow-x-auto py-2 z-20" id="thumbnailContainer" onclick="event.stopPropagation()"></div>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black/60 items-end sm:items-center justify-center p-0 sm:p-4 z-50 backdrop-blur-sm" onclick="closeCartModal()">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-4 space-y-3 shadow-2xl max-h-[85vh] flex flex-col transition-transform duration-300" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-extrabold text-sm text-slate-800 flex items-center gap-2">
          <span class="p-1.5 bg-blue-50 text-blue-600 rounded-xl text-xs">🛒</span> 
          <span>កន្ត្រកទំនិញរបស់អ្នក</span>
        </h3>
        <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-600 font-bold bg-slate-100 w-8 h-8 rounded-full flex items-center justify-center text-xs">✕</button>
      </div>
      <div id="cartModalItems" class="overflow-y-auto flex-1 space-y-2 pr-1 min-h-[120px]"></div>
      <div class="border-t pt-3 space-y-3">
        <div class="flex justify-between items-center font-bold text-sm">
          <span class="text-slate-600">សរុបទឹកប្រាក់៖</span>
          <span id="cartModalTotal" class="text-blue-600 font-black text-xl">$0.00</span>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="clearCart()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-3 rounded-2xl text-xs transition active:scale-95">🗑️ សម្អាតកន្ត្រក</button>
          <button onclick="goToCheckout()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-2xl text-xs shadow-lg shadow-blue-500/30 transition active:scale-95">🚀 ទៅបង់ប្រាក់</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs font-semibold px-4 py-2.5 rounded-2xl shadow-2xl border border-slate-700 z-50 transition-all">✅ បានបន្ថែមទំនិញចូលកន្ត្រក!</div>

  <script>
    // 1. Setup Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // 2. Supabase Config
    const SUPABASE_URL = "https://gzclvhcvsfcslilxaiyg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6Y2x2aGN2c2Zjc2xpbHhhaXlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjUyMjAsImV4cCI6MjEwMTYwMTIyMH0.8gD4bwPpxdLl9kGtPVCRRPylEsES_DHWH4KhKDJvzuE";

    let productsList = [];
    let currentLayoutColumns = 2;

    async function loadProducts() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        if (!response.ok) throw new Error('Failed to fetch products');
        productsList = await response.json();
        renderProducts(productsList);
      } catch (err) {
        console.error("Error loading products:", err);
        const container = document.getElementById('productGrid');
        container.innerHTML = `
          <div class="col-span-full text-center py-12 space-y-2">
            <span class="text-4xl">⚠️</span>
            <p class="text-xs text-slate-400">មិនអាចផ្ទុកទំនិញបានទេ</p>
            <button onclick="loadProducts()" class="text-xs text-blue-500 underline">ព្យាយាមម្តងទៀត</button>
          </div>`;
      }
    }

    function changeGridView(cols) {
      currentLayoutColumns = cols;
      const grid = document.getElementById('productGrid');
      
      [1, 2, 3].forEach(c => {
        const btn = document.getElementById(`viewBtn${c}`);
        if (!btn) return;
        if (c === cols) {
          btn.className = "p-1.5 rounded-xl bg-white text-blue-600 shadow-sm font-bold transition-all active:scale-90 flex items-center justify-center";
        } else {
          btn.className = "p-1.5 rounded-xl text-slate-400 hover:text-slate-600 transition-all active:scale-90 flex items-center justify-center";
        }
      });

      if (cols === 1) grid.className = "grid grid-cols-1 gap-3 transition-all";
      else if (cols === 2) grid.className = "grid grid-cols-2 gap-2.5 transition-all";
      else if (cols === 3) grid.className = "grid grid-cols-3 gap-1.5 transition-all";

      renderProducts(productsList);
    }

    function renderProducts(items) {
      const container = document.getElementById('productGrid');
      const countElement = document.getElementById('totalItemsCount');
      if (countElement) countElement.innerText = `${items.length} មុខ`;

      if (!items || items.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 space-y-2">
            <span class="text-4xl">🔍</span>
            <p class="text-xs text-slate-400">ពុំមានទំនិញក្នុងស្តុកឡើយ</p>
          </div>`;
        return;
      }

      const isCompact3Cols = currentLayoutColumns === 3;
      const isLarge1Col = currentLayoutColumns === 1;

      container.innerHTML = items.map((item, index) => {
        const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
        const itemCode = codeMatch ? codeMatch[1] : (item.code || item.title || 'STOCK');
        const imageList = item.images && item.images.length > 0 ? item.images : [item.image_url || 'https://via.placeholder.com/300'];

        return `
          <div class="bg-white rounded-2xl p-2 sm:p-2.5 border border-slate-200/80 shadow-xs hover:shadow-md transition-all flex flex-col justify-between group animate-card" style="animation-delay: ${index * 0.03}s">
            <div class="space-y-1.5">
              <div onclick="openAlbumModal('${item.id}')" 
                   class="relative rounded-xl overflow-hidden bg-slate-100 aspect-square cursor-pointer group-hover:opacity-95 transition-opacity">
                <img src="${imageList[0]}" 
                     class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 pointer-events-none"
                     oncontextmenu="return false;" 
                     ondragstart="return false;">
                <span class="absolute top-1.5 left-1.5 bg-blue-600/90 backdrop-blur-md text-white font-extrabold text-[9px] ${isCompact3Cols ? 'px-1.5 py-0.2' : 'px-2 py-0.5'} rounded-md shadow-xs">#${itemCode}</span>
                ${imageList.length > 1 ? `
                  <span class="absolute bottom-1.5 right-1.5 bg-black/60 backdrop-blur-md text-white text-[9px] font-semibold px-1.5 py-0.5 rounded-md flex items-center gap-0.5">📷 ${imageList.length}</span>
                ` : ''}
              </div>
              <div class="pt-0.5">
                <h2 class="font-bold text-slate-800 ${isCompact3Cols ? 'text-[10px] truncate' : isLarge1Col ? 'text-sm' : 'text-xs truncate'}">${item.title || 'ទំនិញ'}</h2>
                ${!isCompact3Cols && item.description ? `<p class="text-[10px] text-slate-400 line-clamp-1">${item.description}</p>` : ''}
              </div>
            </div>
            <div class="pt-1.5 space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="font-black text-blue-600 ${isCompact3Cols ? 'text-xs' : 'text-sm'}">$${parseFloat(item.price || 0).toFixed(2)}</span>
              </div>
              <div class="grid ${isCompact3Cols ? 'grid-cols-1' : 'grid-cols-2'} gap-1">
                <button onclick="addToCart('${item.id}', true)" 
                        class="bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold ${isCompact3Cols ? 'py-1 text-[9px]' : 'py-2 text-[11px]'} rounded-xl flex items-center justify-center gap-0.5 transition active:scale-95 border border-amber-200/50">
                  🛒 <span>កន្ត្រក</span>
                </button>
                <button onclick="buyNow('${item.id}')" 
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold ${isCompact3Cols ? 'py-1 text-[9px]' : 'py-2 text-[11px]'} rounded-xl flex items-center justify-center gap-0.5 shadow-xs transition active:scale-95">
                  ⚡ <span>ទិញ</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      updateCartBadge();
    }

    // Image Viewer Functions
    let currentAlbumImages = [];
    let currentImageIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    function openAlbumModal(productId) {
      const product = productsList.find(p => String(p.id) === String(productId));
      if (!product) return;

      currentAlbumImages = product.images && product.images.length > 0 ? product.images : [product.image_url || 'https://via.placeholder.com/400'];
      currentImageIndex = 0;

      const codeMatch = product.description ? product.description.match(/\[Code:\s*([^\]]+)\]/) : null;
      const itemCode = codeMatch ? codeMatch[1] : (product.code || 'ITEM');

      document.getElementById('albumCodeTag').innerText = `#${itemCode}`;
      
      renderSliderTrack();
      updateImageViewerPosition();

      const modal = document.getElementById('imageViewerModal');
      modal.classList.add('flex');

      setupTouchSwipe();
    }

    function renderSliderTrack() {
      const track = document.getElementById('sliderTrack');
      track.innerHTML = currentAlbumImages.map((imgUrl) => `
        <div class="w-full flex-shrink-0 h-full flex items-center justify-center p-2">
          <img src="${imgUrl}" 
               class="max-h-[70vh] w-auto max-w-full object-contain rounded-2xl shadow-2xl pointer-events-none select-none"
               oncontextmenu="return false;" 
               ondragstart="return false;">
        </div>
      `).join('');
    }

    function updateImageViewerPosition() {
      const track = document.getElementById('sliderTrack');
      track.style.transform = `translateX(-${currentImageIndex * 100}%)`;

      document.getElementById('albumCounter').innerText = `${currentImageIndex + 1} / ${currentAlbumImages.length}`;

      const thumbContainer = document.getElementById('thumbnailContainer');
      if (currentAlbumImages.length > 1) {
        thumbContainer.innerHTML = currentAlbumImages.map((img, idx) => `
          <img src="${img}" 
               onclick="selectViewerImage(${idx})" 
               class="w-10 h-10 object-cover rounded-xl cursor-pointer border-2 transition-all ${idx === currentImageIndex ? 'border-blue-500 scale-105 shadow-md' : 'border-transparent opacity-50'}"
               oncontextmenu="return false;">
        `).join('');
      } else {
        thumbContainer.innerHTML = '';
      }
    }

    function navigateImage(direction) {
      if (!currentAlbumImages.length) return;
      currentImageIndex += direction;
      if (currentImageIndex < 0) currentImageIndex = currentAlbumImages.length - 1;
      if (currentImageIndex >= currentAlbumImages.length) currentImageIndex = 0;
      updateImageViewerPosition();
    }

    function selectViewerImage(index) {
      currentImageIndex = index;
      updateImageViewerPosition();
    }

    function setupTouchSwipe() {
      const viewport = document.getElementById('sliderViewport');
      if (!viewport) return;

      viewport.ontouchstart = (e) => {
        touchStartX = e.changedTouches[0].screenX;
      };

      viewport.ontouchend = (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const swipeThreshold = 40;
        if (touchEndX < touchStartX - swipeThreshold) {
          navigateImage(1);
        }
        if (touchEndX > touchStartX + swipeThreshold) {
          navigateImage(-1);
        }
      };
    }

    function closeImageViewer() {
      const modal = document.getElementById('imageViewerModal');
      modal.classList.remove('flex');
    }

    // Toast Notification
    function showToast(message) {
      const toast = document.getElementById('toastNotification');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    // Cart Handler
    function getCart() {
      try {
        return JSON.parse(localStorage.getItem('cartData')) || [];
      } catch {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem('cartData', JSON.stringify(cart));
      updateCartBadge();
    }

    function updateCartBadge() {
      const cart = getCart();
      const badge = document.getElementById('cartCountBadge');
      if (!badge) return;
      if (cart.length > 0) {
        badge.innerText = cart.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function addToCart(productId, showNotification = true) {
      const product = productsList.find(p => String(p.id) === String(productId));
      if (!product) return;

      let cart = getCart();
      cart.push(product);
      saveCart(cart);

      if (showNotification) {
        showToast('✅ បានបន្ថែមខោចូលកន្ត្រកហើយ!');
      }
    }

    function buyNow(productId) {
      const product = productsList.find(p => String(p.id) === String(productId));
      if (!product) return;

      localStorage.setItem('buyNowItem', JSON.stringify(product));
      window.location.href = 'delivery.html';
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) {
        renderProducts(productsList);
        return;
      }
      const filtered = productsList.filter(p => {
        const title = (p.title || '').toLowerCase();
        const desc = (p.description || '').toLowerCase();
        const code = (p.code || '').toLowerCase();
        return title.includes(query) || desc.includes(query) || code.includes(query);
      });
      renderProducts(filtered);
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      if (input) input.value = '';
      renderProducts(productsList);
    }

    // Cart Modal Controls
    function openCartModal() {
      renderCartModalItems();
      const modal = document.getElementById('cartModal');
      modal.classList.add('flex');
    }

    function closeCartModal() {
      const modal = document.getElementById('cartModal');
      modal.classList.remove('flex');
    }

    function renderCartModalItems() {
      const cart = getCart();
      const container = document.getElementById('cartModalItems');
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 space-y-1">
            <p class="text-3xl">🛒</p>
            <p class="text-xs">គ្មានទំនិញក្នុងកន្ត្រក់ទេ</p>
          </div>
        `;
        document.getElementById('cartModalTotal').innerText = '$0.00';
        return;
      }

      container.innerHTML = cart.map((item, index) => {
        const price = parseFloat(item.price || 0);
        total += price;
        const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
        const itemCode = codeMatch ? codeMatch[1] : (item.code || 'N/A');

        return `
          <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-2xl border border-slate-200/60 text-xs">
            <div class="flex items-center gap-2">
              <span class="font-extrabold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-lg text-[10px]">#${itemCode}</span>
              <span class="font-semibold text-slate-800 truncate max-w-[150px]">${item.title || 'ទំនិញ'}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-slate-700">$${price.toFixed(2)}</span>
              <button onclick="removeFromCart(${index})" class="text-rose-500 hover:text-rose-700 font-bold p-1">✕</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cartModalTotal').innerText = `$${total.toFixed(2)}`;
    }

    function removeFromCart(index) {
      let cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
      renderCartModalItems();
    }

    function clearCart() {
      localStorage.removeItem('cartData');
      updateCartBadge();
      renderCartModalItems();
      showToast('🗑️ បានសម្អាតកន្ត្រករួចរាល់');
    }

    function goToCheckout() {
      const cart = getCart();
      if (cart.length === 0) {
        showToast('⚠️ សូមជ្រើសរើសទំនិញយ៉ាងហោចណាស់ ១!');
        return;
      }
      localStorage.removeItem('buyNowItem');
      window.location.href = 'delivery.html';
    }

    // Initialize
    loadProducts();
    updateCartBadge();
  </script>
</body>
</html>
