<!DOCTYPE html>
<html lang="km">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>តូបជជុស Online</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:'Kantumruy Pro',sans-serif;background:#f3f4f6;}
.product-card{background:white;border-radius:16px;padding:16px;box-shadow:0 4px 6px rgba(0,0,0,0.05);transition:0.2s;}
.product-card:hover{transform:translateY(-3px);box-shadow:0 10px 15px rgba(0,0,0,0.1);}
.btn-buy{background:#2563eb;color:white;padding:10px 16px;border-radius:12px;font-weight:bold;border:none;width:100%;cursor:pointer;}
</style>
</head>
<body class="p-4 max-w-md mx-auto">
<h1 class="text-xl font-bold mb-4 text-center">🛍️ តូបជជុស Online</h1>
<div id="productList" class="grid grid-cols-1 gap-4"></div>

<script>
// ទិន្នន័យទំនិញគំរូ
const products = [
  { id: 1, title: "ខោ តេស", code: "J-001", price: 11.50, image: "https://via.placeholder.com/150" },
  { id: 2, title: "ខោ ខ្មៅ", code: "J-002", price: 15.50, image: "https://via.placeholder.com/150" }
];

const container = document.getElementById('productList');
products.forEach(p => {
  container.innerHTML += `
    <div class="product-card flex gap-4 items-center">
      <img src="${p.image}" class="w-24 h-24 rounded-xl object-cover">
      <div class="flex-1">
        <p class="font-bold">${p.title}</p>
        <p class="text-sm text-gray-500">Code: ${p.code}</p>
        <p class="text-blue-600 font-bold mt-1">$${p.price.toFixed(2)}</p>
        <button onclick="buyNow(${p.id})" class="btn-buy mt-2">🛒 ទិញឥឡូវ</button>
      </div>
    </div>
  `;
});

function buyNow(id) {
  const item = products.find(p => p.id === id);
  localStorage.setItem('buyNowItem', JSON.stringify(item));
  window.location.href = 'delivery.html';
}
</script>
</body>
</html>
