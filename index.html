<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - Admin Stock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6">
    <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">👖 បញ្ចូលស្តុកខោអាវថ្មី</h2>
    
    <form id="stockForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">ឈ្មោះខោ/ម៉ូដ</label>
        <input type="text" id="title" required class="mt-1 w-full p-2 border rounded-md" placeholder="ឧ. ខោជើងកណ្តឹង ក្បាលខ្ពស់">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">តម្លៃ ($)</label>
        <input type="number" step="0.01" id="price" required class="mt-1 w-full p-2 border rounded-md" placeholder="12.50">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Size (ជ្រើសរើសបានច្រើន)</label>
        <div class="flex gap-4 mt-1 flex-wrap">
          <label><input type="checkbox" name="sizes" value="S"> S</label>
          <label><input type="checkbox" name="sizes" value="M"> M</label>
          <label><input type="checkbox" name="sizes" value="L"> L</label>
          <label><input type="checkbox" name="sizes" value="XL"> XL</label>
          <label><input type="checkbox" name="sizes" value="Free Size"> Free Size</label>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">ការពិពណ៌នាបន្ថែម (Caption)</label>
        <textarea id="description" rows="3" class="mt-1 w-full p-2 border rounded-md" placeholder="សាច់ស្អាត ទន់ លាតសន្ធឹងបានល្អ..."></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">ថតរូប/ជ្រើសរើសរូប (៤ - ៥ សន្លឹក)</label>
        <input type="file" id="images" multiple accept="image/*" class="mt-1 w-full p-2 border rounded-md">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700">
        📤 រក្សាទុក & បញ្ចូលស្តុក
      </button>
    </form>
    <div id="status" class="mt-4 text-center font-medium"></div>
  </div>

  <script>
    const SUPABASE_PROJECT_ID = 'gzclvhcvsfcslilxaiyg';
    const SUPABASE_URL = `https://${SUPABASE_PROJECT_ID}.supabase.co`;
    
    // ⚠️ សូម Paste Anon Key វែង (eyJhbGci...) ឬ Publishable Key របស់អ្នកនៅទីនេះ
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6Y2x2aGN2c2Zjc2xpbHhhaXlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjUyMjAsImV4cCI6MjEwMTYwMTIyMH0.8gD4bwPpxdLl9kGtPVCRRPylEsES_DHWH4KhKDJvzuE'; 
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('stockForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');
      
      statusDiv.className = 'mt-4 text-center font-medium text-blue-600';
      statusDiv.innerText = '⏳ កំពុង Upload រូបភាព...';
      submitBtn.disabled = true;

      try {
        const title = document.getElementById('title').value;
        const price = parseFloat(document.getElementById('price').value);
        const description = document.getElementById('description').value;
        const sizeNodes = document.querySelectorAll('input[name="sizes"]:checked');
        const sizes = Array.from(sizeNodes).map(node => node.value);
        const imageFiles = document.getElementById('images').files;

        if (imageFiles.length === 0) {
          alert('សូមជ្រើសរើសរូបថតយ៉ាងហោចណាស់ ១ សន្លឹក!');
          submitBtn.disabled = false;
          statusDiv.innerText = '';
          return;
        }

        const imageUrls = [];

        for (let i = 0; i < imageFiles.length; i++) {
          const file = imageFiles[i];
          const ext = file.name.split('.').pop().toLowerCase() || 'jpg';
          const fileName = `img_${Date.now()}_${i}.${ext}`;

          // 🔥 ប្រើ Direct Direct Storage REST API (ដើរលើ Telegram 100%)
          const uploadUrl = `${SUPABASE_URL}/storage/v1/object/product-images/${fileName}`;
          
          const uploadResponse = await fetch(uploadUrl, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'apikey': SUPABASE_KEY,
              'Content-Type': file.type || 'image/jpeg',
              'x-upsert': 'true'
            },
            body: file
          });

          if (!uploadResponse.ok) {
            const errJson = await uploadResponse.json().catch(() => ({}));
            throw new Error(errJson.message || errJson.error || `Upload មិនបាន (Code ${uploadResponse.status})`);
          }

          // ទាញ Public URL មកវិញ
          const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;
          imageUrls.push(publicUrl);
        }

        statusDiv.innerText = '⏳ កំពុងរក្សាទុកទិន្នន័យស្តុក...';

        // បញ្ចូលទិន្នន័យទៅ Table Products
        const { error: dbError } = await supabaseClient
          .from('products')
          .insert([{
            title: title,
            price: price,
            sizes: sizes,
            description: description,
            images: imageUrls,
            stock_quantity: 1
          }]);

        if (dbError) throw dbError;

        statusDiv.className = 'mt-4 text-center font-medium text-green-600';
        statusDiv.innerText = '✅ បញ្ចូលស្តុកជោគជ័យ!';
        document.getElementById('stockForm').reset();
      } catch (err) {
        console.error(err);
        statusDiv.className = 'mt-4 text-center font-medium text-red-600';
        statusDiv.innerText = '❌ ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
