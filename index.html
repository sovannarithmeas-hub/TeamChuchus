<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>តូបជជុស Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kantumruy Pro', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

  <!-- Header Section -->
  <header class="sticky top-0 bg-white/90 backdrop-blur-md z-40 border-b p-3 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img src="https://gzclvhcvsfcslilxaiyg.supabase.co/storage/v1/object/public/product-images/photo_2026-08-10_18-23-16.jpg" 
             onerror="this.src='https://via.placeholder.com/40';" 
             class="w-10 h-10 rounded-full border">
        <div>
          <h1 class="font-bold text-sm text-gray-800">តូបជជុស Online</h1>
          <p class="text-[10px] text-gray-500">ខោជជុសគុណភាពខ្ពស់</p>
        </div>
      </div>

      <!-- ប៊ូតុងកន្ត្រកខាងលើ (Header Cart) -->
      <button onclick="openCartModal()" class="relative p-2.5 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100 transition">
        🛒
        <span id="cartCountBadge" class="absolute -top-1 -right-1 bg-red-500 text-white font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center hidden">
          0
        </span>
      </button>
    </div>

    <!-- Search Input -->
    <div class="max-w-md mx-auto mt-2">
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="🔍 ស្វែងរកតាមលេខកូដ ឬប្រភេទខោ..." 
             class="w-full p-2.5 text-xs bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-3 space-y-3">
    <div class="flex justify-between items-center px-1">
      <p class="text-xs font-bold text-gray-700 flex items-center gap-1">
        <span>📦</span> ឥវ៉ាន់ដែលមានក្នុងស្តុក
      </p>
      <span id="totalItemsCount" class="text-[10px] font-bold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">
        0 មុខ
      </span>
    </div>

    <!-- Product Feed Grid -->
    <div id="productGrid" class="space-y-4"></div>
  </main>

  <!-- 🛒 Modal បង្ហាញកន្ត្រកទំនិញ (Cart Modal Popup) -->
  <div id="cartModal" class="fixed inset-0 bg-black/60 hidden items-end sm:items-center justify-center p-0 sm:p-4 z-50 backdrop-blur-sm" onclick="closeCartModal()">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-4 space-y-3 shadow-2xl max-h-[85vh] flex flex-col" onclick="event.stopPropagation()">
      
      <!-- Header Modal -->
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm text-gray-800 flex items-center gap-1.5">
          <span>🛒</span> កន្ត្រកទំនិញរបស់អ្នក
        </h3>
        <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600 font-bold bg-gray-100 w-7 h-7 rounded-full flex items-center justify-center text-xs">✕</button>
      </div>

      <!-- បញ្ជីទំនិញក្នុង Cart -->
      <div id="cartModalItems" class="overflow-y-auto flex-1 space-y-2 pr-1 min-h-[120px]"></div>

      <!-- Footer Modal / Total & Action -->
      <div class="border-t pt-3 space-y-2.5">
        <div class="flex justify-between items-center font-bold text-sm">
          <span class="text-gray-600">សរុបទឹកប្រាក់៖</span>
          <span id="cartModalTotal" class="text-blue-600 font-extrabold text-base">$0.00</span>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="clearCart()" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold py-3 rounded-xl text-xs transition">
            🗑️ សម្អាតកន្ត្រក
          </button>
          <button onclick="goToCheckout()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs shadow-md transition">
            🚀 ទៅបង់ប្រាក់
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Notification (ជំនួស alert() កុំឱ្យលោត Domain) -->
  <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg border border-gray-700 hidden z-50 transition-all">
    ✅ បានបន្ថែមទំនិញចូលកន្ត្រក!
  </div>

  <!-- JAVASCRIPT SECTION -->
  <script>
    // 1. Setup Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // 🧹 Clear ទិន្នន័យ buyNowItem ចាស់ចោល ពេលអ្នកប្រើត្រឡប់មក HomePage
    localStorage.removeItem('buyNowItem');

    // 2. Fetch Products from Supabase
    const SUPABASE_URL = "https://gzclvhcvsfcslilxaiyg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6Y2x2aGN2c2Zjc2xpbHhhaXlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjUyMjAsImV4cCI6MjEwMTYwMTIyMH0.8gD4bwPpxdLl9kGtPVCRRPylEsES_DHWH4KhKDJvzuE";

    let productsList = [];

    async function loadProducts() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        productsList = await response.json();
        renderProducts(productsList);
      } catch (err) {
        console.error("Error loading products:", err);
      }
    }

    // 3. Render Product Cards
    function renderProducts(items) {
      const container = document.getElementById('productGrid');
      document.getElementById('totalItemsCount').innerText = `${items.length} មុខ`;

      if (items.length === 0) {
        container.innerHTML = `<p class="text-center text-xs text-gray-400 py-10">ពុំមានទំនិញក្នុងស្តុកទេ</p>`;
        return;
      }

      container.innerHTML = items.map(item => {
        const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
        const itemCode = codeMatch ? codeMatch[1] : (item.code || item.title || 'STOCK');
        const imageList = item.images && item.images.length > 0 ? item.images : [item.image_url || 'https://via.placeholder.com/300'];

        return `
          <div class="bg-white rounded-2xl p-3 border shadow-sm space-y-2">
            <div class="relative rounded-xl overflow-hidden bg-gray-100 aspect-square">
              <img src="${imageList[0]}" class="w-full h-full object-cover">
              <span class="absolute top-2 left-2 bg-blue-600 text-white font-bold text-[11px] px-2.5 py-0.5 rounded-lg shadow">
                #${itemCode}
              </span>
              ${imageList.length > 1 ? `
                <span class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-md text-white text-[10px] px-2 py-0.5 rounded-full">
                  📷 ${imageList.length} រូប
                </span>
              ` : ''}
            </div>

            <div class="flex justify-between items-start pt-1">
              <div>
                <h2 class="font-bold text-xs text-gray-800">${item.title}</h2>
                <p class="text-[10px] text-gray-500">${item.description || ''}</p>
              </div>
              <span class="font-bold text-sm text-blue-600">$${parseFloat(item.price || 0).toFixed(2)}</span>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
              <button onclick="addToCart('${item.id}', true)" 
                      class="bg-amber-50 hover:bg-amber-100 active:bg-amber-200 text-amber-700 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1 transition">
                🛒 ចូលកន្ត្រក
              </button>
              
              <button onclick="buyNow('${item.id}')" 
                      class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1 shadow-md transition">
                ⚡ ទិញភ្លាមៗ
              </button>
            </div>
          </div>
        `;
      }).join('');

      updateCartBadge();
    }

    // Toast Notification Handler
    function showToast(message) {
      const toast = document.getElementById('toastNotification');
      toast.innerText = message;
      toast.classList.remove('hidden');
      setTimeout(() => { toast.classList.add('hidden'); }, 2000);
    }

    // 4. Cart Operations
    function getCart() {
      return JSON.parse(localStorage.getItem('cartData')) || [];
    }

    function saveCart(cart) {
      localStorage.setItem('cartData', JSON.stringify(cart));
      updateCartBadge();
    }

    function updateCartBadge() {
      const cart = getCart();
      const badge = document.getElementById('cartCountBadge');
      if (cart.length > 0) {
        badge.innerText = cart.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function addToCart(productId, showNotification = true) {
      const product = productsList.find(p => String(p.id) === String(productId));
      if (!product) return;

      let cart = getCart();
      cart.push(product);
      saveCart(cart);

      if (showNotification) {
        showToast('✅ បានបន្ថែមខោចូលកន្ត្រកហើយ!');
      }
    }

    function buyNow(productId) {
      const product = productsList.find(p => String(p.id) === String(productId));
      if (!product) return;

      localStorage.setItem('buyNowItem', JSON.stringify(product));
      window.location.href = 'delivery.html';
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = productsList.filter(p => {
        const title = (p.title || '').toLowerCase();
        const desc = (p.description || '').toLowerCase();
        const code = (p.code || '').toLowerCase();
        return title.includes(query) || desc.includes(query) || code.includes(query);
      });
      renderProducts(filtered);
    }

    function openCartModal() {
      renderCartModalItems();
      const modal = document.getElementById('cartModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeCartModal() {
      const modal = document.getElementById('cartModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function renderCartModalItems() {
      const cart = getCart();
      const container = document.getElementById('cartModalItems');
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-gray-400 space-y-1">
            <p class="text-2xl">🛒</p>
            <p class="text-xs">គ្មានទំនិញក្នុងកន្ត្រក់ទេ</p>
          </div>
        `;
        document.getElementById('cartModalTotal').innerText = '$0.00';
        return;
      }

      container.innerHTML = cart.map((item, index) => {
        const price = parseFloat(item.price || 0);
        total += price;
        const codeMatch = item.description ? item.description.match(/\[Code:\s*([^\]]+)\]/) : null;
        const itemCode = codeMatch ? codeMatch[1] : (item.code || 'N/A');

        return `
          <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl border text-xs">
            <div class="flex items-center gap-2">
              <span class="font-bold bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded text-[10px]">#${itemCode}</span>
              <span class="font-semibold text-gray-800">${item.title}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-gray-700">$${price.toFixed(2)}</span>
              <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 font-bold p-1">✕</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cartModalTotal').innerText = `$${total.toFixed(2)}`;
    }

    function removeFromCart(index) {
      let cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
      renderCartModalItems();
    }

    function clearCart() {
      localStorage.removeItem('cartData');
      updateCartBadge();
      renderCartModalItems();
      showToast('🗑️ បានសម្អាតកន្ត្រករួចរាល់');
    }

    function goToCheckout() {
      const cart = getCart();
      if (cart.length === 0) {
        showToast('⚠️ សូមជ្រើសរើសទំនិញយ៉ាងហោចណាស់ ១!');
        return;
      }
      // ត្រូវ Clear buyNowItem ដើម្បីឱ្យវាទាញចេញពី Cart វិញ
      localStorage.removeItem('buyNowItem');
      window.location.href = 'delivery.html';
    }

    loadProducts();
  </script>
</body>
</html>
