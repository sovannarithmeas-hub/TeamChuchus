<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - ហាងទំនិញ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Kantumruy Pro', sans-serif !important;
    }
  </style>
</head>
<body class="bg-gray-100 p-3 sm:p-4 font-sans text-gray-800">
  <div class="max-w-xl mx-auto">
    
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 mb-4 text-center">
      <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2 text-2xl border border-blue-200">
        👖
      </div>
      <h1 class="text-xl font-bold text-gray-800">តូបជជុស Online</h1>
      <p class="text-xs text-gray-500 mt-0.5">ជ្រើសរើសខោជជុសគុណភាពខ្ពស់ ស្អាតៗ និងមានក្នុងស្តុកស្រាប់</p>
    </div>

    <div class="mb-4">
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="🔍 ស្វែងរកតាមលេខកូដ (ឧ. J-001) ឬប្រភេទខោ..." class="w-full p-3 border rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-sm">
    </div>

    <div class="flex justify-between items-center mb-3 px-1">
      <h2 class="font-bold text-gray-700 text-sm">📦 ខោដែលមានក្នុងស្តុក</h2>
      <span class="text-xs font-semibold bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full" id="stockCount">0 មុខ</span>
    </div>

    <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <p class="text-center text-gray-500 py-8 col-span-full">⏳ កំពុងទាញទិន្នន័យស្តុក...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gzclvhcvsfcslilxaiyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VVZOPQCUQFRDSlOgXhUI5g_kri2S-Ww'; 
    const TELEGRAM_USERNAME = 'Torp_jojus_online';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let availableProducts = [];

    async function loadProducts() {
      const container = document.getElementById('productList');
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        availableProducts = (data || []).filter(p => 
          p.stock_quantity > 0 && !(p.description && p.description.includes('[SOLD OUT]'))
        );

        document.getElementById('stockCount').innerText = `${availableProducts.length} មុខ`;
        filterProducts();
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p class="text-center text-red-500 py-8 col-span-full">❌ មិនអាចទាញទិន្នន័យបានទេ៖ ${err.message}</p>`;
      }
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      let filtered = availableProducts;
      if (query) {
        filtered = availableProducts.filter(p => 
          (p.title && p.title.toLowerCase().includes(query)) ||
          (p.description && p.description.toLowerCase().includes(query))
        );
      }

      renderProducts(filtered);
    }

    function renderProducts(products) {
      const container = document.getElementById('productList');
      if (products.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400 py-8 col-span-full">📭 មិនមានទំនិញក្នុងស្តុកនៅឡើយទេ</p>`;
        return;
      }

      container.innerHTML = products.map(item => {
        const firstImg = (item.images && item.images.length > 0) ? item.images[0] : 'https://via.placeholder.com/200';
        const sizes = Array.isArray(item.sizes) ? item.sizes.join(', ') : (item.sizes || 'N/A');
        
        let code = 'N/A';
        if (item.description) {
          const match = item.description.match(/\[Code:\s*([^\]]+)\]/i);
          if (match) code = match[1];
        }

        const buyMessage = encodeURIComponent(`ជម្រាបសួរ! ខ្ញុំចង់កម្ម៉ង់ទិញខោ៖\n🏷️ លេខកូដ៖ #${code}\n👖 ម៉ូដ៖ ${item.title || 'ខោជជុស'}\n💵 តម្លៃ៖ $${parseFloat(item.price).toFixed(2)}`);
        const telegramUrl = `https://t.me/${TELEGRAM_USERNAME}?text=${buyMessage}`;

        return `
          <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between">
            <div>
              <div class="relative">
                <img src="${firstImg}" class="w-full h-48 object-cover">
                <span class="absolute top-2 left-2 bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded-md shadow">
                  #${code}
                </span>
              </div>
              
              <div class="p-3">
                <h3 class="font-bold text-gray-800 text-base flex justify-between items-center">
                  <span>${item.title || 'ខោជជុស'}</span>
                  <span class="text-blue-600 font-extrabold text-base">$${parseFloat(item.price).toFixed(2)}</span>
                </h3>
                
                <p class="text-xs text-gray-500 mt-1 line-clamp-2">${item.description || ''}</p>
                
                <div class="mt-2 flex items-center gap-1.5">
                  <span class="text-[11px] bg-gray-100 text-gray-700 px-2 py-0.5 rounded border font-medium">
                    Size: ${sizes}
                  </span>
                </div>
              </div>
            </div>

            <div class="p-3 pt-0">
              <a href="${telegramUrl}" target="_blank" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition">
                💬 ឆាតទិញតាម Telegram
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    loadProducts();
  </script>
</body>
</html>
