<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តូបជជុស Online - Admin Stock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6">
    <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">👖 បញ្ចូលស្តុកខោអាវថ្មី</h2>
    
    <form id="stockForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">ឈ្មោះខោ/ម៉ូដ</label>
        <input type="text" id="title" required class="mt-1 w-full p-2 border rounded-md" placeholder="ឧ. ខោជើងកណ្តឹង ក្បាលខ្ពស់">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">តម្លៃ ($)</label>
        <input type="number" step="0.01" id="price" required class="mt-1 w-full p-2 border rounded-md" placeholder="12.50">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Size (ជ្រើសរើសបានច្រើន)</label>
        <div class="flex gap-4 mt-1 flex-wrap">
          <label><input type="checkbox" name="sizes" value="S"> S</label>
          <label><input type="checkbox" name="sizes" value="M"> M</label>
          <label><input type="checkbox" name="sizes" value="L"> L</label>
          <label><input type="checkbox" name="sizes" value="XL"> XL</label>
          <label><input type="checkbox" name="sizes" value="Free Size"> Free Size</label>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">ការពិពណ៌នាបន្ថែម (Caption)</label>
        <textarea id="description" rows="3" class="mt-1 w-full p-2 border rounded-md" placeholder="សាច់ស្អាត ទន់ លាតសន្ធឹងបានល្អ..."></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">ថតរូប/ជ្រើសរើសរូប (៤ - ៥ សន្លឹក)</label>
        <input type="file" id="images" multiple accept="image/*" class="mt-1 w-full p-2 border rounded-md">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700">
        📤 រក្សាទុក & បញ្ចូលស្តុក
      </button>
    </form>
    <div id="status" class="mt-4 text-center font-medium"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gzclvhcvsfcslilxaiyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VVZOPQCUQFRDSlOgXhUI5g_kri2S-Ww'; // ⚠️ ឬ Anon Key របស់អ្នក
    
    // ⚙️ ការកំណត់ TELEGRAM BOT (សូមបំពេញ Token និង Channel Username របស់អ្នកនៅទីនេះ)
    const TELEGRAM_BOT_TOKEN = 'YOUR_TELEGRAM_BOT_TOKEN_HERE'; // ឧ. 123456789:ABCdefGhIJK...
    const TELEGRAM_CHAT_ID = '@your_channel_username';       // ឧ. @TobChuchusChannel ឬ ID -100xxxxxxxxx
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Function ផ្ញើសារទៅ Telegram (ការពារមិនឱ្យដួល Mini App បើផ្ញើមិនចេញ)
    async function sendToTelegramChannel(title, price, sizes, description, imageUrls) {
      if (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN === 'YOUR_TELEGRAM_BOT_TOKEN_HERE') {
        console.log(' Telegram Bot Token មិនទាន់បានកំណត់');
        return;
      }

      try {
        const captionText = `👖 <b>${title}</b>\n\n` +
                            `💵 តម្លៃ៖ <b>$${price.toFixed(2)}</b>\n` +
                            `Free Size/Size៖ <b>${sizes.join(', ')}</b>\n` +
                            `📝 ពណ៌នា៖ ${description || 'គ្មាន'}\n\n` +
                            `📩 កម្ម៉ង់ទិញភ្លាមៗតាម Telegram Admin!`;

        if (imageUrls.length === 1) {
          await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID,
              photo: imageUrls[0],
              caption: captionText,
              parse_mode: 'HTML'
            })
          });
        } else if (imageUrls.length > 1) {
          const media = imageUrls.map((url, index) => ({
            type: 'photo',
            media: url,
            caption: index === 0 ? captionText : '',
            parse_mode: 'HTML'
          }));

          await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMediaGroup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID,
              media: media
            })
          });
        }
      } catch (tgErr) {
        console.error(' Telegram Post Error (មិនប៉ះពាល់ដល់ស្តុក):', tgErr);
      }
    }

    document.getElementById('stockForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');
      
      statusDiv.className = 'mt-4 text-center font-medium text-blue-600';
      statusDiv.innerText = '⏳ កំពុង Upload រូបភាព...';
      submitBtn.disabled = true;

      try {
        const title = document.getElementById('title').value;
        const price = parseFloat(document.getElementById('price').value);
        const description = document.getElementById('description').value;
        const sizeNodes = document.querySelectorAll('input[name="sizes"]:checked');
        const sizes = Array.from(sizeNodes).map(node => node.value);
        const imageFiles = document.getElementById('images').files;

        if (imageFiles.length === 0) {
          alert('សូមជ្រើសរើសរូបថតយ៉ាងហោចណាស់ ១ សន្លឹក!');
          submitBtn.disabled = false;
          statusDiv.innerText = '';
          return;
        }

        const imageUrls = [];

        // 1. រក្សាកូដ Upload រូបភាព Blob ដែលដើរជោគជ័យមុននេះដដែល
        for (let i = 0; i < imageFiles.length; i++) {
          const rawFile = imageFiles[i];
          const ext = rawFile.name.split('.').pop().toLowerCase() || 'jpg';
          const fileName = `${Date.now()}_${i}.${ext}`;

          const blobData = new Blob([await rawFile.arrayBuffer()], { type: rawFile.type || 'image/jpeg' });

          const { data, error: uploadError } = await supabaseClient.storage
            .from('product-images')
            .upload(fileName, blobData, {
              contentType: rawFile.type || 'image/jpeg',
              cacheControl: '3600',
              upsert: true
            });

          if (uploadError) throw new Error('Upload រូបភាពមិនបាន៖ ' + uploadError.message);

          const { data: publicUrlData } = supabaseClient.storage
            .from('product-images')
            .getPublicUrl(fileName);

          imageUrls.push(publicUrlData.publicUrl);
        }

        statusDiv.innerText = '⏳ កំពុងរក្សាទុកទិន្នន័យស្តុក...';

        // 2. រក្សាកូដ Insert ចូល Database ដដែល
        const { error: dbError } = await supabaseClient
          .from('products')
          .insert([{
            title: title,
            price: price,
            sizes: sizes,
            description: description,
            images: imageUrls,
            stock_quantity: 1
          }]);

        if (dbError) throw dbError;

        // 3. ផ្ញើ Auto-Post ទៅ Telegram (បើខុសក៏មិនធ្វើឱ្យដួលបញ្ចូលស្តុកដែរ)
        statusDiv.innerText = '⏳ កំពុង Post ទៅ Telegram Channel...';
        await sendToTelegramChannel(title, price, sizes, description, imageUrls);

        statusDiv.className = 'mt-4 text-center font-medium text-green-600';
        statusDiv.innerText = '✅ បញ្ចូលស្តុកជោគជ័យ!';
        document.getElementById('stockForm').reset();
      } catch (err) {
        console.error(err);
        statusDiv.className = 'mt-4 text-center font-medium text-red-600';
        statusDiv.innerText = '❌ ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
