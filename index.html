<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ហាងខោអាវជជុស</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;700&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading" class="loading-container">
        <div class="loading-spinner"></div>
        <p>កំពុង​ផ្ទុក...</p>
    </div>

    <!-- Main App -->
    <div id="app" style="display:none;">
        <!-- Header -->
        <header class="header">
            <button id="backBtn" class="back-btn" style="display:none;">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 id="pageTitle">ហាងខោអាវជជុស</h1>
            <div class="header-actions">
                <button id="cartBtn" class="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cartCount" class="cart-badge">0</span>
                </button>
                <button id="adminBtn" class="admin-btn">
                    <i class="fas fa-user-cog"></i>
                </button>
            </div>
        </header>

        <!-- Page Container -->
        <div id="pageContainer" class="page-container">
            <!-- ទំព័រនឹង​ត្រូវ​បាន​ render ដោយ JavaScript -->
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
            }
        }
    </script>
    
    <script type="module" src="app.js"></script>
    <script type="module" src="checkout-rpc.js"></script>
</body>
</html>
